      if (undoStack.length > 100) undoStack.shift();
      flash(`${evLabel(ev)} moved to ${fmt(ev.start)} s.`);
    }
  }
  renderAll();
});

/* insert tool: click anywhere on the staff to place a note */
function penInsert(clickX, clickY) {
  let t = Math.max(0, (clickX - PAD_L) / lastPxPerSec);
  const midi = midiOfY(clickY);
  let dur = parseFloat(String($("penDur").value).trim().replace(",", "."));
  if (isNaN(dur) || dur < 0.01) dur = 0.5;
  let snapped = false;
  if (!S.penAnywhere) {
    /* a click above, below, or on an existing note WITHIN its duration is a
       chord: the new tone takes that note's exact start and duration.
       Uniform displays (round/pill) hide the duration span, so there the
       chord window is only what's VISIBLE — the glyph itself — and a tap in
       the seemingly empty space beyond it places the NEXT note instead. */
    const hostWin = e => NOTE_STYLE === "classic"
      ? evEnd(e) - 1e-9
      : e.start + Math.min(e.dur, Math.max(NOTE_STYLES[NOTE_STYLE][0], 12) / lastPxPerSec) - 1e-9;
    const host = bar().filter(e => e.type === "note" && t >= e.start - 1e-9 && t < hostWin(e))
      .sort((a, b) => b.start - a.start)[0];
    if (host) {
      if (host.midis.includes(midi) || coincidentTwin(host, midi)) {
        flash(`${dName(midi)} is already in that chord.`);
        return;
      }
      const ce = { id: idCounter++, type: "note", midis: [midi], start: host.start, dur: host.dur };
      if (S.entryInst) ce.inst = S.entryInst; else if (host.inst) ce.inst = host.inst;
      if (host.shape) ce.shape = host.shape;
      S.bars[S.barIdx].push(ce);
      pushUndo({ kind: "addEvent", barIdx: S.barIdx, id: ce.id });
      previewTone(midi, Math.min(host.dur, 1));
      flash(`${dName(midi)} added as a chord with ${dName(host.midis[0])} (${fmt(host.dur)} s) — independent tone.`);
      renderAll();
      return;
    }
    /* no-gap placement: the entry begins where the preceding sound stops —
       the latest end among events starting at/before the click (0 if none) */
    let prevEnd = 0;
    bar().forEach(e => { if (e.start <= t + 1e-9) prevEnd = Math.max(prevEnd, evEnd(e)); });
    snapped = Math.abs(prevEnd - t) > 0.0005;
    t = prevEnd;
  }
  const ev = { id: idCounter++, type: "note", midis: [midi], start: r3(t), dur: r3(dur) };
  if (S.entryInst) ev.inst = S.entryInst;
  if (S.noteShape !== "regular") ev.shape = S.noteShape;
  S.bars[S.barIdx].push(ev);
  pushUndo({ kind: "addEvent", barIdx: S.barIdx, id: ev.id });
  previewTone(midi, Math.min(dur, 1));
  flash(`Inserted ${dName(midi)} at ${fmt(ev.start)} s · ${fmt(ev.dur)} s${snapped ? " (no-gap snap)" : ""}.`);
  renderAll();
}

/* chord maker: merge selected notes into one chord —
   every tone assumes the length (and start) of the LOWEST tone */
function createChord() {
  const evs = [...S.mergeSel].map(id => findEv(id)).filter(Boolean)
    .filter(x => x.bi === S.barIdx).map(x => x.ev).filter(e => e.type === "note");
  if (evs.length < 2) { flash("Select at least two notes first."); return; }
  const union = [...new Set(evs.flatMap(e => e.midis))].sort((a, b) => a - b);
  if (union.length > MAX_TONES) { flash(`That would be ${union.length} tones — max ${MAX_TONES} per chord.`); return; }
  const lowest = union[0];
  const host = evs.find(e => e.midis.includes(lowest));
  const nev = { id: idCounter++, type: "note", midis: union, start: host.start, dur: host.dur };
  const b = S.bars[S.barIdx];
  const removed = [];
  evs.forEach(e => { const i = b.indexOf(e); if (i >= 0) { removed.push(e); b.splice(i, 1); } });
  b.push(nev);
  pushUndo({ kind: "merge", barIdx: S.barIdx, removed, newId: nev.id });
  S.mergeSel.clear();
  flash(`Chord ${union.map(midiName).join("+")} created — length of lowest tone ${midiName(lowest)}: ${fmt(nev.dur)} s.`);
  renderAll();
}

/* time adjust: take off (−) / add on (+) one increment.
   A single tone inside a chord is split into its own event on first adjustment. */
function adjustSelected(delta) {
  const f = S.selectedId ? findEv(S.selectedId) : null;
  if (!f) { flash("Select a note, chord, or rest on the staff first."); return; }
  let ev = f.ev;
  if (S.selectedMidi != null && ev.type === "note" && ev.midis.length > 1) {
    const idx = ev.midis.indexOf(S.selectedMidi);
    if (idx >= 0) {
      ev.midis.splice(idx, 1);
      const nev = { id: idCounter++, type: "note", midis: [S.selectedMidi], start: ev.start, dur: ev.dur };
      S.bars[f.bi].push(nev);
      pushUndo({ kind: "split", barIdx: f.bi, origId: ev.id, newId: nev.id, midi: S.selectedMidi });
      S.selectedId = nev.id; S.selectedMidi = null;
      ev = nev;
    }
  }
  const targets = [ev, ...S.adjSel.map(id => findEv(id)).filter(q => q && q.bi === S.barIdx &&
    Math.abs(q.ev.dur - ev.dur) < 0.0005).map(q => q.ev)];
  let ok = true;
  targets.forEach(t => {
    const end = evEnd(t);
    let r;
    if (S.adjField === "start") r = applyTiming(t, t.start + delta, end);
    else if (S.adjField === "stop") r = applyTiming(t, t.start, end + delta);
    else r = applyTiming(t, t.start + delta, end + delta);
    ok = ok && r;
  });
  if (ok) renderAll(); else renderAdjust();
}

function renderStaff() {
  const svg = $("staff");
  const b = bar();
  const sorted = [...b].sort((x, y) => x.start - y.start || x.id - y.id);

  /* live extents */
  let liveEnd = 0;
  if (S.holding) liveEnd = holdBarStart + S.elapsed;
  const latchLive = null;
  const totalDur = Math.max(barLen(b), liveEnd, 0);

  /* time scale with a minimum drawn width so events don't jumble */
  let minDur = Infinity;
  b.forEach(e => { if (e.dur > 0) minDur = Math.min(minDur, e.dur); });
  /* the staff fills its container: fit-to-width against the frame's real
     width (falls back to BASE_W before first layout / on narrow screens) */
  const frame = document.querySelector(".staffFrame");
  const targetW = Math.max(BASE_W, (frame && frame.clientWidth ? frame.clientWidth : 0) - 4);
  /* STABLE TIME SCALE: pixels-per-second is a constant (times the user's
     Shrink / Magnify / pinch factor), never derived from the content — so an
     entry appears exactly where it was clicked and the view never rescales
     underneath the user. */
  const PX_BASE = 100;
  /* uniform note display: consecutive entries must sit at least a glyph-width
     apart, so tight rhythms can still raise the scale when glyphs would pile up */
  let uniPx = 0;
  if (NOTE_STYLE !== "classic") {
    const gw = NOTE_STYLES[NOTE_STYLE][0];
    const starts = [...new Set(b.filter(e => e.type === "note" || e.type === "bass")
      .map(e => Math.round(e.start * 1000) / 1000))].sort((p, q) => p - q);
    let minDelta = Infinity;
    for (let i = 1; i < starts.length; i++) minDelta = Math.min(minDelta, starts[i] - starts[i - 1]);
    if (isFinite(minDelta) && minDelta > 0.0005) uniPx = Math.min((gw + UNI_MIN_GAP) / minDelta, 2000);
  }
  const pxPerSec = drag ? drag.pxPerSec : grab ? grab.pxPerSec : gdrag ? gdrag.px
    : Math.max(PX_BASE * HZOOM, uniPx);
  lastPxPerSec = pxPerSec;
  /* entry runway: a CONSTANT strip of empty, clickable staff past the content —
     the width grows only as the music actually approaches the edge */
  const RUNWAY_PX = 340;
  const svgW = Math.max(targetW, PAD_L + PAD_R + totalDur * pxPerSec + RUNWAY_PX);
  const X = t => PAD_L + t * pxPerSec;

  svg.setAttribute("width", svgW);
  svg.setAttribute("height", STAFF_H);
  svg.style.background = TH().sheet;
  svg.replaceChildren();

  svg.append(svgEl("text",
    { x: PAD_L, y: 15, "font-size": 11, fill: TH().header, "font-family": "Georgia, serif" },
    (S.notation === "tonal"
      ? `Bar ${S.barIdx + 1} · ${S.tonal.instrument} · ${S.tonal.key} (${keySig(S.tonal.key)}) · ${S.tonal.sig} · ♩=${S.tonal.tempo} · ${totalDur.toFixed(2)} s`
      : `Bar ${S.barIdx + 1} · ${totalDur.toFixed(2)} s · x-axis = time`)
    + (S.chordMode ? " · Chord+ active: click above/below a note to stack a tone" : "")
    + (S.alignPending ? " · click the reference event" : "")));

  /* semitone guides: every line labeled; octave Fs bold, naturals solid, sharps dashed */
  for (let m = VIEW_LO; m <= VIEW_HI; m++) {
    const y = yOfMidi(m), oct = OCTAVE_FS.includes(m), sh = isSharp(m);
    const T = TH();
    const line = svgEl("line", {
      x1: 0, x2: svgW - PAD_R, y1: y, y2: y,
      stroke: oct ? T.lineOct : sh ? T.lineSharp : T.lineNat,
      "stroke-width": oct ? T.wOct : T.wNat,
    });
    if (sh && !oct) line.setAttribute("stroke-dasharray", "4 3");
    svg.append(line);
    if (false) svg.append(svgEl("text", {
      x: PAD_L - 8, y: y + 3, "text-anchor": "end",
      "font-size": oct ? 10.5 : 8.5, "font-weight": oct ? 700 : 400,
      fill: oct ? T.labOct : sh ? T.labSharp : T.labNat,
      "font-family": oct ? "Georgia, serif" : "system-ui, sans-serif",
    }, dName(m)));
  }

  /* Pattern Studio: heavy double lines at every internal bar boundary + the group end */
  if (S.patEdit && SHOW_BAR_SEPARATORS) {
    const bcap = patBarCap();
    for (let k = 1; k <= S.patEdit.groupLen; k++) {
      const bt = k * bcap;
      [X(bt) - 1.6, X(bt) + 1.6].forEach(lx =>
        svg.append(svgEl("line", { x1: lx, x2: lx, y1: PAD_T - 6, y2: STAFF_H - PAD_B + 6,
          stroke: "#000", "stroke-width": 2, "pointer-events": "none" })));
      if (k <= S.patEdit.groupLen - 1)
        svg.append(svgEl("text", { x: X(bt) + 5, y: PAD_T + 2, "font-size": 9, fill: "#000",
          "font-weight": 700, "pointer-events": "none" }, `bar ${k + 1}`));
    }
  }

  /* tonal beat grid: beat + eighth gridlines, bold bar-capacity marker */
  if (S.notation === "tonal" && SHOW_BAR_SEPARATORS) {
    const qs = 60 / S.tonal.tempo;
    const beats = TS_BEATS[S.tonal.sig] || 4;
    const cap = beats * qs;
    const T2 = TH();
    const limit = Math.max(totalDur, cap) + 0.001;
    for (let t = qs / 2; t <= limit; t += qs / 2) {
      const onBeat = Math.abs(t / qs - Math.round(t / qs)) < 1e-6;
      svg.append(svgEl("line", { x1: X(t), x2: X(t), y1: PAD_T, y2: STAFF_H - PAD_B,
        stroke: onBeat ? T2.gridBeat : T2.grid, "stroke-width": onBeat ? 1 : 0.75,
        "pointer-events": "none" }));
    }
    svg.append(svgEl("line", { x1: X(cap), x2: X(cap), y1: PAD_T - 6, y2: STAFF_H - PAD_B + 6,
      stroke: T2.lineOct, "stroke-width": 2, "stroke-dasharray": "6 3", "pointer-events": "none" }));
    svg.append(svgEl("text", { x: X(cap) + 4, y: PAD_T + 2, "font-size": 9, fill: T2.header,
      "pointer-events": "none" }, `bar end (${S.tonal.sig})`));
  }

  /* loop region band */
  if (S.loop && S.loop.barIdx === S.barIdx && S.loop.barIdx < S.bars.length) {
    const lx = X(S.loop.startT), lw = Math.max((S.loop.endT - S.loop.startT) * pxPerSec, 4);
    svg.append(svgEl("rect", { x: lx, y: PAD_T - 4, width: lw, height: STAFF_H - PAD_T - PAD_B + 8,
      fill: "rgba(30,136,229,0.08)", "pointer-events": "none" }));
    svg.append(svgEl("line", { x1: lx, x2: lx + lw, y1: PAD_T - 4, y2: PAD_T - 4,
      stroke: "#1e88e5", "stroke-width": 2.5, "pointer-events": "none" }));
    [lx, lx + lw].forEach(bx => svg.append(svgEl("line", { x1: bx, x2: bx, y1: PAD_T - 4, y2: PAD_T + 6,
      stroke: "#1e88e5", "stroke-width": 2, "pointer-events": "none" })));
    svg.append(svgEl("text", { x: lx + lw / 2, y: PAD_T - 8, "text-anchor": "middle",
      "font-size": 10, "font-weight": 700, fill: "#1e88e5", "pointer-events": "none" },
      `⟲ LOOP ${S.loop.mode === "continuous" ? "∞" : "×" + S.loop.count}`));
  }
  if (S.loopPickStart) {
    const lx = X(S.loopPickStart.t);
    svg.append(svgEl("line", { x1: lx, x2: lx, y1: PAD_T - 4, y2: STAFF_H - PAD_B + 4,
      stroke: "#1e88e5", "stroke-width": 2, "stroke-dasharray": "4 3", "pointer-events": "none" }));
  }

  /* events */
  sorted.forEach(ev => {
    const x = X(ev.start);
    /* uniform styles size notes/bass identically regardless of duration;
       rests and classic notes keep their true duration span */
    const uni = NOTE_STYLE !== "classic" && (ev.type === "note" || ev.type === "bass");
    const w = uni ? NOTE_STYLES[NOTE_STYLE][0] : Math.max(ev.dur * pxPerSec, 6);
    const selected = S.selectedId === ev.id || (S.mergeMode && S.mergeSel.has(ev.id)) ||
      (S.quantMode && S.quantSel.has(ev.id)) || (S.selMode && S.groupSel.has(ev.id)) ||
      (S.stencilMode && S.stencilSel.has(ev.id));
    const playingNow = S.playing && S.playBarIdx === S.barIdx &&
      S.playTime >= ev.start && S.playTime < evEnd(ev);

    const hook = (shape, toneMidi) => {
      shape.style.cursor = S.dragMode ? "ew-resize"
        : S.grabMode ? "move"
        : (S.selMode && S.groupSel.has(ev.id)) ? "move"
        : S.penMode ? "copy" : "pointer";
      if (S.selMode) shape.addEventListener("pointerdown", e => {
        if (S.playing || gdrag || !S.groupSel.has(ev.id)) return;
        e.stopPropagation(); e.preventDefault();
        try { shape.setPointerCapture(e.pointerId); } catch (err) {}
        beginGroupDrag(e, ev.id);
      });
      if (S.grabMode) shape.addEventListener("pointerdown", e => {
        if (S.playing || grab) return;
        e.stopPropagation(); e.preventDefault();
        try { shape.setPointerCapture(e.pointerId); } catch (err) {}
        grab = { id: ev.id, bi: S.barIdx, startX: e.clientX, startY: e.clientY,
          origStart: ev.start, pxPerSec: lastPxPerSec,
          origMidis: ev.type === "note" ? [...ev.midis] : null,
          origMidi: ev.type === "bass" ? ev.midi : null,
          toneIdx: ev.type === "note" && toneMidi != null ? Math.max(0, ev.midis.indexOf(toneMidi)) : 0 };
        svg.setAttribute("width", +svg.getAttribute("width") + 800);
      });
      if (S.dragMode) shape.addEventListener("pointerdown", e => {
        if (S.playing || drag) return;
        e.stopPropagation(); e.preventDefault();
        try { shape.setPointerCapture(e.pointerId); } catch (err) {}
        drag = { id: ev.id, bi: S.barIdx, startX: e.clientX,
          origStart: ev.start, origDur: ev.dur, pxPerSec: lastPxPerSec, snappedWith: null };
        /* widen the svg so extending past the edge stays visible */
        svg.setAttribute("width", +svg.getAttribute("width") + 800);
      });
      /* "click" (not pointerdown): browsers suppress click after a scroll/drag
         gesture, so swiping the staff can't select or stack tones by accident */
      attachTap(shape, e => {
        const rect = svg.getBoundingClientRect();
        eventClicked(ev, e.clientX - rect.left, e.clientY - rect.top, toneMidi);
      });
      shape.addEventListener("contextmenu", e => {
        e.preventDefault(); e.stopPropagation();
        openPreciseDialog(ev);
      });
    };

    if (ev.type === "rest") {
      const restFill = playingNow ? TH().restFillHot : TH().restFill;
      const r = ev.gapRest
        ? svgEl("rect", { x: x + 1, y: PAD_T + 6, width: Math.max(w - 2, 4), height: STAFF_H - PAD_T - PAD_B - 12,
            fill: "none", stroke: TH().tLabel, "stroke-width": 1.4, "stroke-dasharray": "4 4", rx: 4,
            /* fill:none is invisible to hit-testing — without this the box
               interior can't be tapped to select, resize, adjust, or delete */
            "pointer-events": "all",
            "data-ev": ev.id, "data-basefill": "none" })
        : svgEl("rect", { x, y: PAD_T, width: Math.max(4, w - 6), height: STAFF_H - PAD_T - PAD_B,
            fill: restFill, "data-ev": ev.id, "data-basefill": restFill });
      if (selected) { r.setAttribute("stroke", "#000"); r.setAttribute("stroke-width", 1.5); r.setAttribute("stroke-dasharray", "5 3"); }
      r.append(svgEl("title", {}, `rest / ${fmt(ev.start)} – ${fmt(evEnd(ev))} s`));
      hook(r, null);
      svg.append(r);
      svg.append(svgEl("text", { x: x + w / 2, y: STAFF_H / 2, "text-anchor": "middle",
        "font-size": 12, fill: "#777", "font-family": "Georgia, serif", "pointer-events": "none",
        "data-cl": ev.id, "data-x0": x }, "𝄽"));
      svg.append(svgEl("text", { x: x + w / 2, y: STAFF_H / 2 + 14, "text-anchor": "middle",
        "font-size": 9.5, fill: TH().tLabel, "pointer-events": "none",
        "data-cl": ev.id, "data-x0": x, "data-time": "1" },
        `${fmt(ev.start)}–${fmt(evEnd(ev))} s`));
      return;
    }

    if (ev.type === "pattern") return;   // rendered separately as a boxed instance

    const midis = ev.type === "bass" ? [ev.midi] : ev.midis;
    const isBass = ev.type === "bass";
    const ys = midis.map(yOfMidi);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);

    if (selected) {
      const single = S.selectedMidi != null && midis.includes(S.selectedMidi);
      const oy1 = single ? yOfMidi(S.selectedMidi) - 10 : yMin - 10;
      const oy2 = single ? yOfMidi(S.selectedMidi) + 10 : yMax + 10;
      svg.append(svgEl("rect", {
        x: x - 3, y: oy1, width: w + 6, height: oy2 - oy1, rx: 5,
        fill: "none", stroke: "#000", "stroke-width": 1.5, "stroke-dasharray": "5 3" }));
    }

    midis.forEach((m, ti) => {
      const below = m < VIEW_LO, above = m > VIEW_HI;
      const y = above ? PAD_T + 4 : below ? STAFF_H - PAD_B - 4 : yOfMidi(m);
      if (ev.inst && !IB.color && ti === 0 && !above && !below) {
        svg.append(svgEl("text", { x: x + 1, y: y - 7, "font-size": 7.5, fill: "#555",
          "pointer-events": "none" }, instShort(ev.inst)));
      }
      if (above || below) {
        svg.append(svgEl("text", { x: x + w / 2, y: above ? PAD_T - 2 : STAFF_H - PAD_B + 10,
          "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#c62828",
          "pointer-events": "none" }, above ? `▲${dName(m)}` : `▼${dName(m)}`));
      }
      const merged = (S.mergeMode && S.mergeSel.has(ev.id)) || (S.quantMode && S.quantSel.has(ev.id)) ||
        (S.selMode && S.groupSel.has(ev.id)) || (S.stencilMode && S.stencilSel.has(ev.id));
      const cust = toneColor(ev, m);
      const toneFill = merged ? "#777"
        : (cust || (IB.color && ev.inst ? instColor(ev.inst) : (isBass ? "#666" : TH().note)));
      const mutedOp = ev.muted ? 0.28 : (isBass ? 0.9 : 1);
      const gh = uni ? NOTE_STYLES[NOTE_STYLE][1] : 8;
      const VIS_GAP = uni ? 0 : Math.min(6, w * 0.3);    // 1/16 inch of visual air; the stored time is untouched
      const barShape = svgEl("rect", {
        x, y: y - gh / 2, width: Math.max(2, w - VIS_GAP), height: gh, rx: uni ? gh / 2 : 4,
        fill: toneFill,
        opacity: mutedOp,
        "data-ev": ev.id, "data-basefill": toneFill,
        "data-spec": `${dName(m)} / ${fmt(ev.start)} – ${fmt(evEnd(ev))}`,
        "data-baseop": mutedOp, "data-idx": ti, "data-hh": gh / 2,
      });
      if (ev.muted) { barShape.setAttribute("stroke", "#555"); barShape.setAttribute("stroke-width", 1); barShape.setAttribute("stroke-dasharray", "3 2"); }
      if (cust && isLight(cust)) { barShape.setAttribute("stroke", "#999"); barShape.setAttribute("stroke-width", 1); }
      if (playingNow) { barShape.setAttribute("stroke", "#000"); barShape.setAttribute("stroke-width", 3); }
      hook(barShape, m);
      barShape.append(svgEl("title", {},
        `${dName(m)} / ${fmt(ev.start)} – ${fmt(evEnd(ev))} s${ev.inst ? ` · ${instShort(ev.inst)}` : ""}`));
      svg.append(barShape);
      const nameTxt = dName(m) + (isBass ? " (bass)" : "");
      if (cust) {
        /* colored chip behind the label: light hues → black text, dark hues → white text */
        const cw = nameTxt.length * 6 + 10;
        const chip = svgEl("rect", { x: x + w / 2 - cw / 2, y: y - 17, width: cw, height: 12, rx: 3,
          fill: cust, "pointer-events": "none",
          "data-clb": ev.id, "data-x0": x, "data-idx": ti, "data-cw": cw });
        if (isLight(cust)) { chip.setAttribute("stroke", "#999"); chip.setAttribute("stroke-width", 0.8); }
        svg.append(chip);
        svg.append(svgEl("text", { x: x + w / 2, y: y - 8, "text-anchor": "middle",
          "font-size": 10, "font-weight": 600, fill: isLight(cust) ? "#000" : "#fff",
          "font-style": isBass ? "italic" : "normal",
          "pointer-events": "none", "data-cl": ev.id, "data-x0": x,
          "data-name": "1", "data-idx": ti }, nameTxt));
      } else {
        svg.append(svgEl("text", { x: x + w / 2, y: y - 8, "text-anchor": "middle",
          "font-size": 10, "font-weight": 600, fill: TH().nLabel,
          "font-style": isBass ? "italic" : "normal",
          stroke: TH().halo, "stroke-width": 3, "paint-order": "stroke",
          "pointer-events": "none", "data-cl": ev.id, "data-x0": x,
          "data-name": "1", "data-idx": ti }, nameTxt));
      }
    });
    svg.append(svgEl("text", { x: x + w / 2, y: yMax + 17, "text-anchor": "middle",
      "font-size": 9.5, fill: TH().tLabel,
      stroke: TH().halo, "stroke-width": 3, "paint-order": "stroke",
      "pointer-events": "none", "data-cl": ev.id, "data-x0": x, "data-time": "1", "data-timey": "1" },
      `${(S.stencilMode || S.notation === "tonal") ? (durGlyph(ev.dur) ? durGlyph(ev.dur) + " " : "") : ""}${fmt(ev.start)}–${fmt(evEnd(ev))} s`));

    /* chord-mode full-height drop zone across this note's span — always the
       TRUE duration span (never just the uniform glyph) so it stays easy to hit */
    if (S.chordMode && !S.timeAdjust && ev.type === "note") {
      const zone = svgEl("rect", { x, y: PAD_T, width: Math.max(ev.dur * pxPerSec, w), height: STAFF_H - PAD_T - PAD_B,
        fill: "rgba(0,0,0,0.02)" });
      zone.style.cursor = "copy";
      zone.addEventListener("click", e => {
        e.stopPropagation();
        const rect = svg.getBoundingClientRect();
        chordAdd(ev, midiOfY(e.clientY - rect.top));
      });
      zone.addEventListener("contextmenu", e => { e.preventDefault(); openPreciseDialog(ev); });
      svg.append(zone);
    }
  });

  /* live previews */
  if (S.holding) {
    const w = Math.max(S.elapsed * pxPerSec, 6);
    if (S.holding.kind === "rest")
      svg.append(svgEl("rect", { x: X(holdBarStart), y: PAD_T, width: w,
        height: STAFF_H - PAD_T - PAD_B, fill: "rgba(0,0,0,0.08)", "pointer-events": "none" }));
    else
      svg.append(svgEl("rect", { x: X(holdBarStart), y: yOfMidi(S.holding.midi) - 4,
        width: w, height: 8, rx: 4, fill: "#555", "pointer-events": "none" }));
  }

  /* live MIDI: held keys draw growing bars from the strike instant — the
     entry is visible at key-down, not just when the key comes up */
  if (midiHeld.size) {
    const nowW = performance.now();
    midiHeld.forEach((rec, m) => {
      const g = rec.group;
      const wv = Math.max((nowW - g.startWall) / 1000 * pxPerSec, 6);
      if (m >= VIEW_LO && m <= VIEW_HI)
        svg.append(svgEl("rect", { x: X(g.startBar), y: yOfMidi(m) - 4, width: wv, height: 8, rx: 4,
          fill: "#555", opacity: 0.85, "data-midilive": "1", "pointer-events": "none" }));
    });
  }
  /* playhead */
  if (S.playing && S.playBarIdx === S.barIdx && S.playTime >= 0) {
    svg.append(svgEl("line", { x1: X(S.playTime), x2: X(S.playTime),
      y1: PAD_T - 6, y2: STAFF_H - PAD_B + 6, stroke: "#000", "stroke-width": 1, opacity: 0.3,
      "pointer-events": "none" }));
  }

  /* Gap→Rest armed: outline every detectable gap so it can simply be clicked */
  if (S.gapRestMode) allGaps().forEach(g => {
    const gx = X(g.s), gw = Math.max((g.e - g.s) * pxPerSec, 8);
    const box = svgEl("rect", { x: gx + 1, y: PAD_T + 6, width: gw - 2, height: STAFF_H - PAD_T - PAD_B - 12,
      fill: "rgba(0,0,0,0.03)", stroke: "#999", "stroke-width": 1.2, "stroke-dasharray": "3 4", rx: 4 });
    box.style.cursor = "copy";
    attachTap(box, () => gapRestAt((g.s + g.e) / 2));
    svg.append(box);
    svg.append(svgEl("text", { x: gx + gw / 2, y: PAD_T + 20, "text-anchor": "middle",
      "font-size": 9.5, fill: "#999", "pointer-events": "none" }, `⌷ ${fmt(g.e - g.s)} s`));
  });
  /* Gap→Rest also fills AFTER the last event: outline the trailing runway; a
     tap there makes a rest from the content end to the tapped time (the box is
     pointer-transparent so the staff tap handler reads the exact position) */
  if (S.gapRestMode) {
    const tx = X(totalDur), tw = svgW - PAD_R - tx;
    if (tw > 14) {
      svg.append(svgEl("rect", { x: tx + 1, y: PAD_T + 6, width: tw - 2, height: STAFF_H - PAD_T - PAD_B - 12,
        fill: "rgba(0,0,0,0.02)", stroke: "#bbb", "stroke-width": 1.2, "stroke-dasharray": "3 6", rx: 4,
        "pointer-events": "none" }));
      svg.append(svgEl("text", { x: tx + 8, y: PAD_T + 20, "text-anchor": "start",
        "font-size": 9.5, fill: "#999", "pointer-events": "none" },
        totalDur > 0 ? "⌷ trailing rest — tap where it should end" : "⌷ tap where the opening rest should end"));
    }
  }

  /* time slider: a draggable ▲ along the staff bottom; released, it plants a
     thin red line through the whole staff; a plain tap on ▲ hides the line */
  {
    const tx = X(Math.max(0, TMARK.t));
    if (TMARK.on) {
      svg.append(svgEl("line", { id: "tmLine", x1: tx, x2: tx, y1: PAD_T - 6, y2: STAFF_H - PAD_B + 6,
        stroke: "#c62828", "stroke-width": 1.2, "pointer-events": "none" }));
      svg.append(svgEl("text", { id: "tmTime", x: tx + 3, y: PAD_T - 8, "font-size": 9,
        "font-weight": 700, fill: "#c62828", "pointer-events": "none" }, `${fmt(TMARK.t)} s`));
    }
    const tri = svgEl("path", { id: "tmTri",
      d: `M ${tx} ${STAFF_H - PAD_B + 3} l -7 10 l 14 0 z`,
      fill: TMARK.on ? "#c62828" : "#888", stroke: "#000", "stroke-width": 0.8,
      "pointer-events": "none" });
    svg.append(tri);
    /* the finger target is a generous invisible pad that owns its touches
       outright — the browser can never steal the drag for scrolling */
    const hitW = 30, hitH = 22;
    const hit = svgEl("rect", { id: "tmHit", x: tx - hitW / 2, y: STAFF_H - PAD_B + 1,
      width: hitW, height: hitH, fill: "transparent", "data-ev": "" });
    hit.style.cursor = "ew-resize";
    hit.style.touchAction = "none";
    hit.addEventListener("pointerdown", e => {
      if (S.playing) return;
      e.stopPropagation();
      try { hit.setPointerCapture(e.pointerId); } catch (err) {}
      tmDrag = { id: e.pointerId, x0: e.clientX, t0: TMARK.t, moved: false };
    });
    svg.append(hit);
    const lbl = svgEl("text", { id: "tmLbl", x: tx, y: STAFF_H - PAD_B + 26, "text-anchor": "middle",
      "font-size": 9.5, "font-weight": 700, fill: "#c62828", "pointer-events": "none",
      visibility: "hidden" }, "");
    svg.append(lbl);
  }

  /* Pattern Composer overlays: reference patterns drawn behind the draft's own
     notes, in their box border colour, never interactive */
  if (S.patEdit && S.pcompDraft && S.pcompOverlays.length) {
    S.pcompOverlays.forEach((o, oi) => {
      const p2 = patById(o.pid);
      if (!p2) return;
      const col = overlayColor(o.pid, oi);
      const draftLen = Math.max(barLen(S.bars[0]), p2.span);
      overlayPlacements(o, draftLen).forEach(t0off => {
        p2.events.forEach(pe => {
          if (pe.type !== "note") return;
          const t = t0off + pe.start;
          if (t + pe.dur <= 0) return;                 // entirely before the draft begins
          const tv = Math.max(0, t);
          const dv = pe.dur - (tv - t);
          pe.midis.forEach(m => {
            if (m < VIEW_LO || m > VIEW_HI) return;
            svg.append(svgEl("rect", { x: X(tv), y: yOfMidi(m) - 4,
              width: Math.max(dv * pxPerSec - 1, 3), height: 8, rx: 2,
              fill: col, opacity: o.muted ? 0.3 : 0.5, stroke: col, "stroke-width": 1,
              "stroke-dasharray": "3 2", "pointer-events": "none" }));
          });
        });
      });
    });
  }

  /* pattern instances: a translucent ghost band shows the extent but intercepts
     NOTHING (notes can be entered beneath it) + a compact chip that drags the
     instance and taps open to its controls */
  {
    const lanes = [];
    bar().filter(e => e.type === "pattern").sort((a, b) => a.start - b.start).forEach(ev => {
      const p = patById(ev.pid);
      const x = X(ev.start);
      const w = Math.max(patInstSpan(ev) * pxPerSec, 24);
      const col = p ? p.color : "#888";
      svg.append(svgEl("rect", { x, y: PAD_T, width: w, height: STAFF_H - PAD_T - PAD_B,
        fill: col, opacity: ev.muted ? 0.04 : 0.08, "pointer-events": "none" }));
      svg.append(svgEl("rect", { x, y: PAD_T, width: w, height: STAFF_H - PAD_T - PAD_B,
        fill: "none", stroke: col, "stroke-width": 1.2, "stroke-dasharray": "5 4", rx: 4,
        opacity: ev.muted ? 0.3 : 0.55, "pointer-events": "none" }));
      if (p) p.events.forEach(pe => {
        if (pe.type !== "note") return;
        pe.midis.forEach(m => {
          const mm = m + (ev.tr || 0);
          if (mm < VIEW_LO || mm > VIEW_HI) return;
          svg.append(svgEl("rect", { x: X(ev.start + pe.start), y: yOfMidi(mm) - 3,
            width: Math.max(pe.dur * pxPerSec - 1, 3), height: 6,
            fill: col, opacity: 0.75, rx: 2, "pointer-events": "none" }));
        });
      });
      let lane = 0;
      while (lane < lanes.length && lanes[lane] > x + 2) lane++;
      const chipW = Math.max(64, Math.min(w, 150));
      lanes[lane] = x + chipW + 6;
      const cy = PAD_T + 2 + lane * 21;
      const chip = svgEl("rect", { x, y: cy, width: chipW, height: 17, rx: 4,
        fill: col, stroke: "#000", "stroke-width": 1, opacity: ev.muted ? 0.45 : 1, "data-ev": ev.id });
      chip.style.cursor = "grab";
      const trTag = ev.tr ? ` ${ev.tr > 0 ? "+" : ""}${ev.tr}` : "";
      const modeTag = ev.pmode === "li" ? " Li∞" : ev.pmode === "lo" ? ` Lo×${ev.pcount || 1}` : "";
      const tfill = isLight(col) ? "#000" : "#fff";
      svg.append(chip, svgEl("text", { x: x + 5, y: cy + 12.5, "font-size": 9.5, "font-weight": 700,
        fill: tfill, "pointer-events": "none" }, `⧉ ${p ? p.name : "?"}${trTag}${modeTag}`));
      chip.addEventListener("pointerdown", e => {
        if (S.playing || grab || gdrag) return;
        try { chip.setPointerCapture(e.pointerId); } catch (err) {}
        beginPatGrab(ev, e);
      });
      attachTap(chip, e => {
        if (S.deleteMode || S.selMode || S.grabMode) {
          const rect = svg.getBoundingClientRect();
          eventClicked(ev, e.clientX - rect.left, e.clientY - rect.top, null);
        } else openPatInstanceModal(ev);
      });
      chip.addEventListener("contextmenu", e => { e.preventDefault(); openPatInstanceModal(ev); });
    });
  }

  /* harmony entry point — the vertical positioning bar */
  if (S.stencilMode && S.harmonyOn && S.harmonyT != null) {
    const hx = X(S.harmonyT);
    svg.append(svgEl("line", { x1: hx, x2: hx, y1: PAD_T - 8, y2: STAFF_H - PAD_B + 6,
      stroke: "#d81b60", "stroke-width": 2, "pointer-events": "none" }));
    svg.append(svgEl("text", { x: hx + 4, y: PAD_T - 10, "font-size": 9.5, "font-weight": 700,
      fill: "#d81b60", "pointer-events": "none" }, `▼ harmony ${fmt(S.harmonyT)} s`));
  }

  /* floating pitch label (insert hover / grab drag) — recreated each render, topmost */
  const hg = svgEl("g", { "pointer-events": "none", visibility: "hidden" });
  const hr = svgEl("rect", { x: 0, y: 0, width: 34, height: 16, rx: 4,
    fill: "#fff", stroke: "#000", "stroke-width": 1.2 });
  const ht = svgEl("text", { x: 0, y: 0, "font-size": 11, "font-weight": 700,
    fill: "#000", "text-anchor": "middle" });
  hg.append(hr, ht);
  svg.append(hg);
  hoverEls = { g: hg, rect: hr, text: ht };
}

function showHoverAt(xl, yl, txt) {
  if (!hoverEls) return;
  const wch = txt.length * 7 + 12;
  hoverEls.rect.setAttribute("width", wch);
  hoverEls.rect.setAttribute("x", xl + 12);
  hoverEls.rect.setAttribute("y", yl - 24);
  hoverEls.text.setAttribute("x", xl + 12 + wch / 2);
  hoverEls.text.setAttribute("y", yl - 12);
  hoverEls.text.textContent = txt;
  hoverEls.g.setAttribute("visibility", "visible");
}
function hideHover() { if (hoverEls) hoverEls.g.setAttribute("visibility", "hidden"); }

function renderInspector() {
  const el = $("inspector");
  const f = S.selectedId ? findEv(S.selectedId) : null;
  if (!f || f.bi !== S.barIdx) { el.style.display = "none"; el.replaceChildren(); return; }
  const ev = f.ev;
  el.style.display = "block";
  el.replaceChildren();
  const row = document.createElement("div");
  row.className = "row";
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = evLabel(ev);
  const times = document.createElement("span");
  times.className = "times";
  times.textContent = `${fmt(ev.start)} → ${fmt(evEnd(ev))} s (${fmt(ev.dur)} s)`;
  const mk = (txt, fn, title) => {
    const b = document.createElement("button");
    b.className = "btn small"; b.textContent = txt;
    if (title) b.title = title;
    b.addEventListener("click", fn);
    return b;
  };
  row.append(who, times,
    mk("Precise timing…", () => openPreciseDialog(ev), "Enter exact start/stop times"),
    mk("Align start…", () => beginAlign("start"), "Match this event's start to another, or vice versa"),
    mk("Align stop…", () => beginAlign("end"), "Match this event's stop to another, or vice versa"),
    mk("Delete", () => removeEventById(ev.id)),
    mk("Deselect", () => { S.selectedId = null; S.selectedMidi = null; renderAll(); }));
  el.append(row);
}

function renderAdjust() {
  const el = $("adjustPanel");
  if (!S.timeAdjust) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();

  const f = S.selectedId ? findEv(S.selectedId) : null;
  const ev = f && f.bi === S.barIdx ? f.ev : null;

  const head = document.createElement("div");
  head.className = "row";
  const who = document.createElement("span");
  who.className = "who";
  if (!ev) who.textContent = "Time adjust — select a note, chord, or rest on the staff.";
  else {
    const scope = ev.type === "note" && ev.midis.length > 1
      ? (S.selectedMidi != null ? ` — ${midiName(S.selectedMidi)} only (Chord+ off)` : " — entire chord")
      : "";
    S.adjSel = S.adjSel.filter(id => { const q = findEv(id); return q && q.bi === S.barIdx && Math.abs(q.ev.dur - ev.dur) < 0.0005; });
    who.textContent = "Adjusting " + evLabel(ev) + scope +
      (S.adjSel.length ? ` + ${S.adjSel.length} more (equal ${fmt(ev.dur)} s — tap notes to add/remove)` : " — tap equal-duration notes to adjust them together");
  }
  head.append(who);
  if (ev) {
    const times = document.createElement("span");
    times.className = "times";
    times.textContent = `${fmt(ev.start)} → ${fmt(evEnd(ev))} s (${fmt(ev.dur)} s)`;
    head.append(times);
  }
  el.append(head);

  const seg = (lblTxt, options, cur, set) => {
    const row = document.createElement("div");
    row.className = "row";
    const lab = document.createElement("span");
    lab.className = "seglbl";
    lab.textContent = lblTxt;
    row.append(lab);
    options.forEach(([val, txt]) => {
      const b = document.createElement("button");
      b.className = "btn small" + (cur === val ? " active" : "");
      b.textContent = txt;
      b.addEventListener("click", () => { set(val); renderAdjust(); });
      row.append(b);
    });
    return row;
  };
  el.append(seg("Edge", [["start", "Start"], ["stop", "Stop"], ["shift", "Shift both"]],
    S.adjField, v => { S.adjField = v; }));
  el.append(seg("Increment", [[0.1, "0.1 s"], [0.01, "0.01 s"], [0.001, "0.001 s"]],
    S.adjInc, v => { S.adjInc = v; }));

  const act = document.createElement("div");
  act.className = "row";
  const minus = document.createElement("button");
  minus.className = "btn";
  minus.textContent = `− take off ${S.adjInc} s`;
  minus.disabled = !ev;
  minus.addEventListener("click", () => adjustSelected(-S.adjInc));
  const plus = document.createElement("button");
  plus.className = "btn";
  plus.textContent = `+ add on ${S.adjInc} s`;
  plus.disabled = !ev;
  plus.addEventListener("click", () => adjustSelected(S.adjInc));
  act.append(minus, plus);
  const note = document.createElement("span");
  note.style.cssText = "font-size:11px;color:#999";
  note.textContent = S.chordMode
    ? "Chord+ on: adjustments apply to the whole chord."
    : "Chord+ off: clicking one tone of a chord adjusts that tone alone (it splits into its own event).";
  act.append(note);
  el.append(act);
}

function renderMerge() {
  const el = $("mergePanel");
  if (!S.mergeMode) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();
  const row = document.createElement("div");
  row.className = "row";
  const who = document.createElement("span");
  who.className = "who";
  const sel = [...S.mergeSel].map(id => findEv(id)).filter(Boolean)
    .filter(x => x.bi === S.barIdx).map(x => x.ev).filter(e => e.type === "note");
  if (!sel.length) who.textContent = "Chord maker — click notes on the staff to select them.";
  else {
    const union = [...new Set(sel.flatMap(e => e.midis))].sort((a, b) => a - b);
    const lowest = union[0];
    const host = sel.find(e => e.midis.includes(lowest));
    who.textContent = `Selected: ${sel.map(e => `${evLabel(e)} (${fmt(e.dur)} s)`).join(", ")}` +
      (sel.length >= 2 ? ` → chord length from lowest tone ${midiName(lowest)}: ${fmt(host.dur)} s` : "");
  }
  row.append(who);
  const make = document.createElement("button");
  make.className = "btn" + (sel.length >= 2 ? " active" : "");
  make.textContent = `Create chord (${sel.length})`;
  make.disabled = sel.length < 2;
  make.addEventListener("click", createChord);
  const clr = document.createElement("button");
  clr.className = "btn small";
  clr.textContent = "Clear selection";
  clr.disabled = !sel.length;
  clr.addEventListener("click", () => { S.mergeSel.clear(); renderAll(); });
  row.append(make, clr);
  el.append(row);
}

function renderLoop() {
  const el = $("loopPanel");
  if (!S.loopMode && !S.loop) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();
  const row = document.createElement("div");
  row.className = "row";
  const who = document.createElement("span");
  who.className = "who";
  if (S.loop) {
    who.textContent = `⟲ Loop — bar ${S.loop.barIdx + 1}: ${fmt(S.loop.startT)} – ${fmt(S.loop.endT)} s · ` +
      (S.loop.mode === "continuous" ? "continuous (plays until Stop)" : `×${S.loop.count}`);
  } else {
    who.textContent = S.loopPickStart
      ? `Loop start at ${fmt(S.loopPickStart.t)} s — click the ending note/chord.`
      : "Loop — click a note/chord on the staff to set the loop start.";
  }
  row.append(who);
  if (S.loop) {
    const edit = document.createElement("button");
    edit.className = "btn small";
    edit.textContent = "Edit settings";
    edit.addEventListener("click", () => openLoopModal(S.loop.startT, S.loop.endT));
    const clr = document.createElement("button");
    clr.className = "btn small";
    clr.textContent = "Clear loop";
    clr.addEventListener("click", () => { S.loop = null; flash("Loop cleared."); renderAll(); });
    row.append(edit, clr);
  }
  el.append(row);
}

function renderColor() {
  const el = $("colorPanel");
  if (!S.colorMode) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();

  const row1 = document.createElement("div");
  row1.className = "row";
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "Color:";
  row1.append(who);
  PALETTE.forEach(([name, hex]) => {
    const b = document.createElement("button");
    b.className = "swatch" + (S.colorSel === hex ? " sel" : "");
    b.style.background = hex;
    b.title = name;
    b.addEventListener("click", () => { S.colorSel = hex; renderColor(); renderStatus(); });
    row1.append(b);
  });
  const none = document.createElement("button");
  none.className = "btn small" + (S.colorSel === null ? " active" : "");
  none.textContent = "∅ clear";
  none.title = "Click a note to remove its custom color";
  none.addEventListener("click", () => { S.colorSel = null; renderColor(); renderStatus(); });
  row1.append(none);
  el.append(row1);

  /* range rule builder */
  const row2 = document.createElement("div");
  row2.className = "row";
  const lbl = document.createElement("span");
  lbl.style.cssText = "font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666";
  lbl.textContent = "Range rule";
  const mkSel = def => {
    const sel = document.createElement("select");
    sel.className = "pitchSel";
    for (let m = MIDI_MIN; m <= MIDI_MAX; m++) {
      const o = document.createElement("option");
      o.value = m; o.textContent = midiName(m);
      if (m === def) o.selected = true;
      sel.append(o);
    }
    return sel;
  };
  const loSel = mkSel(MIDI_MIN), hiSel = mkSel(53);
  const dash = document.createElement("span"); dash.textContent = "–";
  const add = document.createElement("button");
  add.className = "btn small";
  add.textContent = "Add rule (uses selected color)";
  add.addEventListener("click", () => {
    if (!S.colorSel) { flash("Pick a color swatch first — rules need a color."); return; }
    let lo = +loSel.value, hi = +hiSel.value;
    if (lo > hi) [lo, hi] = [hi, lo];
    S.colorRules.push({ lo, hi, color: S.colorSel });
    flash(`Rule added: ${midiName(lo)}–${midiName(hi)}.`);
    renderAll();
  });
  row2.append(lbl, loSel, dash, hiSel, add);
  el.append(row2);

  if (S.colorRules.length) {
    const row3 = document.createElement("div");
    row3.className = "row";
    S.colorRules.forEach((r, i) => {
      const chip = document.createElement("button");
      chip.className = "btn small";
      chip.style.background = r.color;
      chip.style.borderColor = isLight(r.color) ? "#999" : r.color;
      chip.style.color = isLight(r.color) ? "#000" : "#fff";
      chip.textContent = `${midiName(r.lo)}–${midiName(r.hi)} ✕`;
      chip.title = "Remove this rule";
      chip.addEventListener("click", () => { S.colorRules.splice(i, 1); renderAll(); });
      row3.append(chip);
    });
    el.append(row3);
  }
  const note = document.createElement("div");
  note.style.cssText = "font-size:11px;color:#999;margin-top:6px";
  note.textContent = "Click a note/chord to apply the selected color. Range rules color every matching tone; a note's own color overrides its rule; later rules win on overlap.";
  el.append(note);

/* ═══════════ Pattern Sets ═══════════
   Studio: 16 slots, sequential commit gating, combine 2–8 adjacent slots,
   exact time-signature fill required to commit. Committed patterns are
   absolute in compositions: transposable and time-draggable only, boxed
   in the pattern's color, with Li / Lo / ×N loop modes per instance.   */
const PAT_SLOTS = 16, PAT_MAX_GROUP = 8, PAT_DEFAULT_COLOR = "#1b5e20";
const PAT_LIB_CAP = 6;
let patLibAll = false;
const PAT_LSKEY = "toneComposerV2.patterns", PATSET_LSKEY = "toneComposerV2.patset";
function patLoad() {
  try {
    S.patterns = JSON.parse(localStorage.getItem(PAT_LSKEY) || "[]") || [];
  } catch (e) { S.patterns = []; }
}
function patStore() {
  try { localStorage.setItem(PAT_LSKEY, JSON.stringify(S.patterns)); } catch (e) {}
}
function patById(pid) { return S.patterns.find(p => p.pid === pid) || null; }
function patSetLoad() {
  try { return JSON.parse(localStorage.getItem(PATSET_LSKEY) || "null"); } catch (e) { return null; }
}
function patSetStore(groups) {
  try { localStorage.setItem(PATSET_LSKEY, JSON.stringify(groups)); } catch (e) {}
}
const patBarCap = () => (TS_BEATS[S.patEdit.sig] || 4) * (60 / S.patEdit.tempo);
const patGroupCap = () => patBarCap() * S.patEdit.groupLen;
const SHOW_BAR_SEPARATORS = false;   // vertical bar/beat separators parked for now, per request
const OVERLAY_MAX = 7;
const OVERLAY_FALLBACK = ["#1565c0", "#c62828", "#6a1b9a", "#ef6c00", "#00838f", "#2e7d32", "#ad1457"];
function pcompBaseColor() {
  const d = S.pcompDraft;
  const p = d && d.mode === "edit" ? patById(d.pid) : null;
  return (p && p.color) || PAT_DEFAULT_COLOR;
}
function overlayColor(pid, idx) {
  /* the rack box's border colour if it has one, otherwise a fallback that is
     never the colour of the pattern being edited */
  const entry = S.pcomp.find(x => x.pid === pid);
  if (entry && entry.border) return entry.border;
  const base = String(pcompBaseColor()).toLowerCase();
  const pool = OVERLAY_FALLBACK.filter(c => c.toLowerCase() !== base);
  return pool[idx % pool.length];
}
function overlayDelta(pid) {
  /* where the overlay begins RELATIVE to the pattern being edited, using the
     rack's own timing (anchor + offset) rather than the pattern's internal 0 */
  const d = S.pcompDraft;
  const { starts } = pcompResolveStarts();
  const base = d && d.mode === "edit" && starts.has(d.pid) ? starts.get(d.pid) : 0;
  return r3n((starts.get(pid) || 0) - base);
}
function overlayPlacements(o, draftLen) {
  /* cycle start times for one overlay across the draft window, honouring its
     loop mode: N× gives exactly N cycles, ∞ repeats to cover the draft */
  const p = patById(o.pid);
  if (!p || !(p.span > 0)) return [];
  const entry = S.pcomp.find(x => x.pid === o.pid);
  const d = overlayDelta(o.pid);
  const need = Math.max(1, Math.ceil((Math.max(draftLen, 0.001) - d) / p.span));
  const n = Math.min(entry && entry.mode === "n" ? entry.count : need, 200);
  const out = [];
  for (let k = 0; k < n; k++) out.push(r3n(d + k * p.span));
  return out;
}
function pcompNorm(x) {
  return {
    pid: x.pid,
    on: x.on !== false,
    mode: x.mode === "n" ? "n" : "inf",          // infinite by default
    count: Math.max(1, Math.min(64, parseInt(x.count, 10) || 8)),
    anchor: x.anchor == null ? null : x.anchor,  // pid this one starts with
    offset: Number.isFinite(+x.offset) ? r3n(+x.offset) : 0,
    border: typeof x.border === "string" && /^#[0-9a-f]{6}$/i.test(x.border) ? x.border : null,
  };
}
function pcompStore() {
  try { localStorage.setItem("toneComposerV2.pcomp", JSON.stringify(S.pcomp)); } catch (e) {}
}
function pcompLoad() {
  try {
    const v = JSON.parse(localStorage.getItem("toneComposerV2.pcomp") || "[]");
    S.pcomp = Array.isArray(v) ? v.filter(x => x && patById(x.pid)).map(pcompNorm) : [];
  } catch (e) { S.pcomp = []; }
}
function pcompOnShelf(pid) {
  return !!(S.patEdit && S.patEdit.groups.some(g => g.pid === pid));
}
function patUsedSlots() { return S.patEdit.groups.reduce((a, g) => a + g.len, 0); }
/* coverage check: notes+rests must tile [0, cap] with no holes (3 ms tolerance) */
function patCoverage(evts, cap) {
  if (!evts.length) return { ok: false, msg: "The pattern is empty." };
  const sorted = [...evts].sort((a, b) => a.start - b.start);
  /* ms-rounded entries accumulate up to ~1–2 ms of drift EACH, so the
     end tolerance scales with the entry count (never below 12 ms) */
  const tol = Math.max(0.012, sorted.length * 0.002);
  let frontier = 0;
  for (const ev of sorted) {
    if (ev.start > frontier + 0.006)
      return { ok: false, msg: `Gap at ${fmt(frontier)}–${fmt(ev.start)} s — fill it with a rest (all entries are manual; the ⌷ Gap→Rest tool clicks it closed).` };
    frontier = Math.max(frontier, evEnd(ev));
  }
  if (frontier < cap - tol)
    return { ok: false, msg: `Filled ${fmt(frontier)} of ${fmt(cap)} s — the time signature isn't complete.` };
  if (frontier > cap + tol)
    return { ok: false, msg: `Content runs ${fmt(frontier)} s — ${fmt(frontier - cap)} s past the bar${S.patEdit.groupLen > 1 ? " group" : ""}. Trim it to exactly ${fmt(cap)} s.` };
  return { ok: true, frontier };
}
function enterPatternStudio() {
  if (S.patEdit) return;
  stopPlayback(); midiPanic();
  const saved = patSetLoad();
  S.patEdit = {
    snapshot: {
      bars: S.bars, barIdx: S.barIdx, loop: S.loop, colorRules: S.colorRules,
      notation: S.notation, tonal: S.tonal, voice: S.voice,
    },
    tempo: S.stTempo, sig: "4/4",
    groups: Array.isArray(saved) ? saved.filter(g => patById(g.pid)) : [],
    groupLen: 1,
    editSlot: null,          // committed slot being renamed/recolored
    combineOn: false,
    combineSel: [],
  };
  S.bars = [[]]; S.barIdx = 0; S.loop = null;
  S.patSel.clear();
  MODES.forEach(k => S[k] = false);
  flash("Pattern Studio — set the tempo first, then enter notes and rests manually to fill the bar exactly.");
  renderAll();
}
function exitPatternStudio() {
  if (!S.patEdit) return;
  stopPlayback(); midiPanic(); patPreviewStop();
  const sn = S.patEdit.snapshot;
  S.bars = sn.bars; S.barIdx = Math.min(sn.barIdx, S.bars.length - 1);
  S.loop = sn.loop; S.colorRules = sn.colorRules;
  S.notation = sn.notation; S.tonal = sn.tonal; S.voice = sn.voice;
  S.patEdit = null;
  S.patSel.clear();
  flash("Back to the composition.");
  renderKeys(true);
  renderAll();
}
function patCombine() {
  const sel = [...S.patSel].sort((a, b) => a - b);
  const next = patUsedSlots();
  if (sel.length < 2 || sel.length > PAT_MAX_GROUP) { flash(`Select 2–${PAT_MAX_GROUP} adjacent bars to combine.`); return; }
  for (let i = 1; i < sel.length; i++)
    if (sel[i] !== sel[i - 1] + 1) { flash("Combined bars must be adjacent."); return; }
  if (sel[0] !== next) { flash(`Combining must start at the next empty bar (bar ${next + 1}).`); return; }
  if (sel[sel.length - 1] >= PAT_SLOTS) { flash("Selection runs past the 16-slot set."); return; }
  S.patEdit.groupLen = sel.length;
  S.patSel.clear();
  flash(`Bars ${sel[0] + 1}–${sel[sel.length - 1] + 1} combined — one pattern of ${sel.length} bars (${fmt(patGroupCap())} s).`);
  renderAll();
}
function patMergeCommitted() {
  const P = S.patEdit;
  const sel = P.combineSel.map(patById).filter(Boolean);
  if (sel.length < 2) { flash("Tap at least two shelf patterns first."); return; }
  const nb = sel.reduce((a, p) => a + p.nbars, 0);
  if (patUsedSlots() + nb > PAT_SLOTS) { flash(`Not enough free slots (needs ${nb}).`); return; }
  let t = 0; const events = [];
  sel.forEach(p => {
    p.events.forEach(e => events.push({ type: e.type, start: r3n(e.start + t), dur: e.dur,
      midis: e.midis ? [...e.midis] : undefined, vel: e.vel, shape: e.shape }));
    t = r3n(t + p.span);
  });
  const pat = { pid: newPid(), name: `P${P.groups.length + 1}`, color: PAT_DEFAULT_COLOR,
    tempo: sel[0].tempo, sig: sel[0].sig, nbars: nb, span: t, events };
  S.patterns.push(pat); patStore();
  P.groups.push({ len: nb, pid: pat.pid }); patSetStore(P.groups);
  P.combineSel = []; P.combineOn = false;
  flash(`${pat.name} = ${sel.map(p => p.name).join(" + ")} · ${fmt(t)} s, ${nb} bars.`);
  renderAll();
}

function patDeletePattern(pid) {
  const P = S.patEdit;
  S.patterns = S.patterns.filter(q => q.pid !== pid);
  patStore();
  if (P) {
    P.groups = P.groups.filter(g => g.pid !== pid);
    patSetStore(P.groups);
    P.combineSel = P.combineSel.filter(q => q !== pid);
    if (P.snapshot && P.snapshot.bars)
      P.snapshot.bars.forEach((b, i) => P.snapshot.bars[i] = b.filter(e => !(e.type === "pattern" && e.pid === pid)));
  }
  S.bars.forEach((b, i) => S.bars[i] = b.filter(e => !(e.type === "pattern" && e.pid === pid)));
  S.bank = S.bank.filter(b => b.pid !== pid);
  S.pcomp = S.pcomp.filter(x => x.pid !== pid);
  pcompStore();
}

function patCommit(endHere) {
  const evts = S.bars[0].filter(e => e.type === "note" || e.type === "rest");
  let cap;
  if (endHere) {
    /* End bar here: the pattern's length is wherever the content currently
       stops — only gaps are checked, not the time signature */
    if (!evts.length) { flash("The pattern is empty."); return; }
    const sorted = [...evts].sort((a, b) => a.start - b.start);
    let frontier = 0;
    for (const ev of sorted) {
      if (ev.start > frontier + 0.006) { flash(`Gap at ${fmt(frontier)}–${fmt(ev.start)} s — fill it with a rest first (⌷ Gap→Rest).`); return; }
      frontier = Math.max(frontier, evEnd(ev));
    }
    cap = frontier;
  } else {
    cap = patGroupCap();
    const cov = patCoverage(evts, cap);
    if (!cov.ok) { flash(cov.msg); return; }
    cap = r3(cap);
  }
  /* snap to mathematical exactness: absorb rounding drift into the final event */
  const frontierNow = Math.max(...evts.map(evEnd));

/* ── multi-bar grid view ── */
function drawMiniEvents(svg, b, MXof, MY, nh, PTm, PBm, H) {
  const inView = m => m >= VIEW_LO && m <= VIEW_HI;
  b.forEach(ev => {
    const MX = MXof;
    if (ev.type === "note") {
      ev.midis.forEach(m => inView(m) && svg.append(svgEl("rect", {
        x: MX(ev.start), y: MY(m) - nh / 2,
        width: Math.max(MX(ev.start + ev.dur) - MX(ev.start), 2), height: nh,
        rx: 1, fill: toneColor(ev, m) || TH().note, opacity: ev.muted ? 0.3 : 0.95 })));
    } else if (ev.type === "rest") {
      svg.append(svgEl("rect", { x: MX(ev.start), y: PTm,
        width: Math.max(MX(ev.start + ev.dur) - MX(ev.start), 2),
        height: H - PTm - PBm, fill: TH().restFill }));
    } else if (ev.type === "bass") {
      svg.append(svgEl("rect", { x: MX(ev.start), y: MY(ev.midi) - nh / 2,
        width: Math.max(MX(ev.start + ev.dur) - MX(ev.start), 2), height: nh,
        fill: TH().note, opacity: 0.7 }));
    } else if (ev.type === "pattern") {
      const p = patById(ev.pid);
      const col = p ? p.color : "#888";
      const x0 = MX(ev.start);
      svg.append(svgEl("rect", { x: x0, y: PTm, width: Math.max(MX(ev.start + patInstSpan(ev)) - x0, 6),
        height: H - PTm - PBm, fill: col, opacity: 0.13 }));
      if (p) p.events.forEach(pe => {
        if (pe.type !== "note") return;
        pe.midis.forEach(m => {
          const mm = m + (ev.tr || 0);
          if (mm < VIEW_LO || mm > VIEW_HI) return;
          svg.append(svgEl("rect", { x: MX(ev.start + pe.start), y: MY(mm) - nh / 2,
            width: Math.max(MX(ev.start + pe.start + pe.dur) - MX(ev.start + pe.start), 1.6),
            height: nh, fill: col, opacity: 0.8, rx: 1 }));
        });
      });
      svg.append(svgEl("text", { x: x0 + 2, y: PTm + 7, "font-size": 6.5, "font-weight": 700,
        fill: col }, p ? p.name : "?"));
    }
  });
}

/* one ROW of the continuous staff: staff lines run unbroken across `cols` bars,
   a single pitch gutter at the left, barlines between bars, shared time scale */
function gridRowSvg(startBar, cols) {
  const step = cols === 2 ? 4 : 3;
  const PLm = cols === 2 ? 38 : 30, PRm = 6, PTm = 17, PBm = 8;
  const H = PTm + (VIEW_HI - VIEW_LO) * step + PBm;
  const W = 960;
  const T = TH();
  const MY = m => PTm + (VIEW_HI - m) * step;
  const nh = Math.max(step - 0.8, 2.2);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: "auto" });
  svg.style.display = "block";
  svg.style.background = T.sheet;
  svg.style.borderRadius = "4px";

  /* the bars of this row and their PROPORTIONAL widths on one shared time scale */
  const segs = [];
  for (let i = 0; i < cols; i++) {
    const bi = startBar + i;
    const exists = bi < S.bars.length;
    const span = Math.max(exists ? barLen(S.bars[bi]) : 0, bankFloor(bi), 0.5);
    segs.push({ bi, exists, span });
  }
  const totalSpan = segs.reduce((a, g) => a + g.span, 0);
  const avail = W - PLm - PRm;
  let x = PLm;
  segs.forEach(g => { g.x0 = x; g.w = (g.span / totalSpan) * avail; x += g.w; g.x1 = x; });

  /* continuous line system + one gutter of labels */
  const labEvery = step >= 8 ? 1 : step >= 5 ? 2 : 4;
  for (let m = VIEW_LO; m <= VIEW_HI; m++) {
    const y = MY(m), oct = OCTAVE_FS.includes(m), sh = isSharp(m);
    svg.append(svgEl("line", { x1: PLm - 2, x2: W - PRm, y1: y, y2: y,
      stroke: oct ? T.lineOct : sh ? T.lineSharp : T.lineNat,
      "stroke-width": oct ? Math.max(1, T.wOct * 0.7) : Math.max(0.5, T.wNat * 0.55) }));
    if (oct || (m - MIDI_MIN) % labEvery === 0)
      svg.append(svgEl("text", { x: PLm - 3.5, y: y + 2, "text-anchor": "end",
        "font-size": oct ? 6.2 : 5.4, "font-weight": oct ? 700 : 400,
        fill: oct ? T.labOct : sh ? T.labSharp : T.labNat }, dName(m)));
  }

  segs.forEach((g, i) => {
    const local = t => g.x0 + (t / g.span) * g.w;
    if (g.exists) drawMiniEvents(svg, S.bars[g.bi], local, MY, nh, PTm, PBm, H);

    /* barline at the segment's right edge; composition's final bar gets a double */
    if (SHOW_BAR_SEPARATORS) {
      const isFinal = g.bi === S.bars.length - 1;
      svg.append(svgEl("line", { x1: g.x1, x2: g.x1, y1: PTm - 4, y2: H - PBm + 4,
        stroke: T.lineOct, "stroke-width": 1.5 }));
      if (isFinal)
        svg.append(svgEl("line", { x1: g.x1 - 3, x2: g.x1 - 3, y1: PTm - 4, y2: H - PBm + 4,
          stroke: T.lineOct, "stroke-width": 0.8 }));
    }

    /* header: bar number (+ state), bank dots, ✎ */
    const selMark = g.bi === S.barIdx;
    svg.append(svgEl("text", { x: g.x0 + 3, y: 10, "font-size": 8.5, "font-weight": 700,
      fill: g.exists ? T.labOct : T.labSharp },
      g.exists ? `Bar ${g.bi + 1} · ♪ ${noteCount(S.bars[g.bi])}` : `Bar ${g.bi + 1} (empty — tap to create)`));
    let dx = g.x0 + 3;
    S.bank.forEach(be => {
      if (be.muted || !bankAppliesTo(be, g.bi)) return;
      const p = patById(be.pid);
      svg.append(svgEl("circle", { cx: g.x0 + g.w - 8 - (dx - g.x0 - 3), cy: 7, r: 3.2,
        fill: p ? p.color : "#888", stroke: "rgba(0,0,0,0.3)", "stroke-width": 0.6 }));
      dx += 9;
    });
    const ped = svgEl("text", { x: g.x1 - 12, y: H - PBm + 2, "font-size": 9, fill: T.labOct,
      "font-weight": 700 }, "✎");
    ped.style.cursor = "pointer";
    ped.addEventListener("click", e => {
      e.stopPropagation();
      while (S.bars.length <= g.bi) S.bars.push([]);
      S.barIdx = g.bi;
      S.gridView = 1;
      try { localStorage.setItem("toneComposerV2.gridView", "1"); } catch (err) {}
      renderAll();
    });
    svg.append(ped);

    /* selection / playing indication */
    if (selMark)
      svg.append(svgEl("rect", { x: g.x0 + 1, y: PTm - 5, width: g.w - 2, height: H - PTm - PBm + 10,
        fill: "none", stroke: "#000", "stroke-width": 2, rx: 3, "pointer-events": "none" }));
    if (S.playing && S.playBarIdx === g.bi)
      svg.append(svgEl("rect", { x: g.x0 + 1, y: PTm - 5, width: g.w - 2, height: H - PTm - PBm + 10,
        fill: "rgba(27,94,32,0.10)", stroke: "#1b5e20", "stroke-width": 2, rx: 3, "pointer-events": "none" }));

    /* tap surface: select; tap the selected bar again to edit it */
    const hit = svgEl("rect", { x: g.x0, y: 0, width: g.w, height: H, fill: "transparent" });
    hit.style.cursor = "pointer";
    attachTap(hit, () => {
      if (S.barIdx === g.bi && g.exists) {
        S.gridView = 1;
        try { localStorage.setItem("toneComposerV2.gridView", "1"); } catch (err) {}
      } else {
        while (S.bars.length <= g.bi) S.bars.push([]);
        S.barIdx = g.bi;
      }
      renderAll();
    });
    svg.append(hit);
  });
  return svg;
}
