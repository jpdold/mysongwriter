<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Song Writer</title>
<meta name="theme-color" content="#5a5c5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235a5c5f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. TOKENS — the mock: graphite ground, white paper windows, green tags,
      blue lyric strip, orange rhythm boxes. Dark and custom themes retint.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --ground: #5b5d60;          /* phone body */
  --ground2: #4c4e51;         /* strips, headers */
  --paper: #fbf7ee;           /* windows: light eggshell */
  --paper2: #f3eee2;
  --line: #1a1a1a;            /* staff lines */
  --line-soft: #bdbdbd;       /* half-step guide lines */
  --beat: #111;               /* dotted beat dividers */
  --ink: #111;                /* notes, text on paper */
  --ink2: #666;
  --on-ground: #f4f4f4;       /* text on graphite */
  --on-ground2: #c9c9c9;
  --tag: #8fd14f;             /* green labels */
  --tag-ink: #123;
  --lyric: #4da3e0;           /* lyric strip */
  --lyric-ink: #ffffff;
  --box: #e8790f;             /* rhythm boxes: deep orange */
  --box-soft: #f5a623;        /* highlights that use the orange */
  --accent: #2f7fd6;          /* Setup… */
  --danger: #e5322d;          /* Save… */
  --melody: #111; --sub: #d99a2b; --backup: #9b7bc6; --bass: #2e4a9e; --accomp: #1f7a70; --ensemble: #4d8f3a;
  --green: #4caf7d; --yellow: #e6b422;
  --bezel: 18px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --music: "Bravura", "Noto Music", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1c1d20; --ground2: #141517; --paper: #26272b; --paper2: #2e2f34;
  --line: #d8d8d8; --line-soft: #4a4b50; --beat: #e6e6e6; --ink: #f2f2f2; --ink2: #9a9a9a;
  --on-ground: #eee; --on-ground2: #999; --tag: #7cc242; --lyric: #2f6fa8; --box: #f0841c; --box-soft: #e39a2a; --accent: #4f95e6;
  --melody: #f2f2f2; --bass: #8ea6f0; --accomp: #5fc0b3;
}

/* ═══════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--on-ground); font-family: var(--sans); font-size: 14px; line-height: 1.3;
  overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { -webkit-user-select: text; user-select: text; }
.hidden { display: none !important; }
svg text { pointer-events: none; }

/* ═══════════════════════════════════════════════════════════════════════
   3. LAYOUT — one column on a phone; melody stack left / band right when wide
   ═══════════════════════════════════════════════════════════════════════ */
#app { max-width: 560px; margin: 0 auto; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 7px;
  grid-template-columns: 1fr; grid-template-areas: "head" "nav" "mel" "rhy" "lyr" "arrows" "undo" "pal" "acc" "bass"; }
#rollBar { grid-area: rollbar; display: none; gap: 6px; }
/* rolled-up view: three labelled bars across the top; open staves drop down beneath; strips and tools follow */
#app.rolled { max-width: 560px !important; grid-template-columns: 1fr !important; grid-template-areas: "head" "nav" "rollbar" "mel" "acc" "bass" "rhy" "lyr" "arrows" "undo" "pal" !important; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4), (max-height: 520px) and (min-aspect-ratio: 5/4) { #app.rolled { max-width: 1180px !important; padding-left: 16px; padding-right: 16px; } #app.rolled .win .focus { display: none !important; } }
#app.rolled #rollBar { display: flex; }
#app.rolled .win.closed { display: none !important; }
#app.rolled .win .sizer { display: none; }
#app.rolled #melWin { margin-top: 0; }
#app.rolled #accWin, #app.rolled #bassWin { margin-top: 12px; }
#app.rolled #accWin.lead, #app.rolled #bassWin.lead { margin-top: 0; }
#app.rolled .win.lead .winHead { display: none; }
.rollItem { flex: 1; display: flex; align-items: center; gap: 6px; height: 22px; background: #111; color: #fff; border: 1px solid #000; border-radius: 4px; padding: 0 4px 0 8px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.rollItem .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.rollItem .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.rollItem button { width: 22px; height: 18px; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(255,255,255,.12); color: #fff; font-size: 16px; line-height: 1; padding: 0; flex: 0 0 auto; }
.rollItem.open { background: var(--ground2); }
.rollItem.open button { background: var(--box); color: #111; border-color: #a86d10; }
#head { grid-area: head; } #nav { grid-area: nav; } #melWin { grid-area: mel; } #rhyStrip { grid-area: rhy; }
#lyrStrip { grid-area: lyr; } #palette { grid-area: pal; } #accWin { grid-area: acc; } #bassWin { grid-area: bass; } #arrows { grid-area: arrows; } #undoRow, #mvRow { grid-area: undo; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4) {
  #app { max-width: 1180px; grid-template-columns: 1fr 1fr; column-gap: 14px; align-content: start;
    grid-template-areas: "head head" "nav nav" "mel acc" "rhy bass" "lyr bass" "arrows bass" "undo bass" "pal bass"; }
  #accWin, #bassWin { align-self: start; }
}
/* phone turned sideways: no thin strip — two columns, small chrome */
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  #app { max-width: none; padding: 4px 8px; gap: 4px; grid-template-columns: 1fr 1fr; column-gap: 10px;
    grid-template-areas: "head nav" "mel acc" "rhy bass" "lyr bass" "arrows bass" "undo bass" "pal bass"; }
}

/* ── header ── */
#head { display: grid; grid-template-columns: 44px 1fr 44px; grid-template-rows: auto auto; gap: 2px 6px; align-items: center; }
#topTransport { justify-self: center; display: flex; gap: 4px; min-width: 0; }
#topTransport button { width: 36px; height: 34px; position: relative; border: 1.5px solid #141414; border-radius: 4px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 17px; padding: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#topTransport button.on { background: linear-gradient(#ffd27a, #f5a623); }
#topTransport button .bar { position: absolute; left: calc(50% + 4.5px); top: 50%; transform: translateY(-50%); width: 3.5px; height: 12px; background: #111; border-radius: 1px; }   /* almost touching the triangle, as tall as its base */
#topTransport #playAllBtn { padding-right: 6px; }
#topTransport button .dots { font-size: 11px; font-weight: 800; margin-left: 1px; letter-spacing: -1px; }
#topTransport #stopBtn { font-size: 15px; }
#topTransport #saveBtn { background: linear-gradient(#ff5a4e, #e5322d); color: #fff; border-color: #6e1712; display: grid; place-items: center; }   /* the floppy: save, beside the tempo */
#topTransport #saveBtn .ico { width: 21px; height: 21px; display: block; }
#topTransport #rangeBtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
#topTransport #rangeBtn .top { display: block; line-height: 15px; }
#topTransport #rangeBtn .sub { display: block; font-size: 6.5px; font-weight: 800; letter-spacing: .04em; line-height: 8px; font-family: var(--sans); margin-top: 1px; }
#tempo { display: flex; align-items: center; margin-left: 2px; border: 1.5px solid #141414; border-radius: 4px; overflow: hidden; height: 34px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#topTransport #tempo button { width: 24px; height: 34px; border: none; border-radius: 0; box-shadow: none; font-size: 18px; font-weight: 700; }
#topTransport #tempo button#tempoLbl { width: auto; min-width: 46px; padding: 0 2px; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; background: #111; color: #fff; }
#topTransport #tempo button:active { background: linear-gradient(#ffd27a, #f5a623); }
#app { overflow-x: hidden; }
.btn.warn { background: #c8402f; color: #fff; border-color: #a93226; }
#app > * { min-width: 0; }                     /* no child may widen the column: text and svgs never push the staves about */
#palette { min-width: 0; overflow: hidden; }
#palette .prow { min-width: 0; overflow: hidden; }
#palette .who { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#songTitle { grid-column: 1 / -1; justify-self: center; width: min(100%, 360px); text-align: center; font-size: 22px; line-height: 1.2;
  background: var(--paper); color: var(--ink); border: 1.5px solid #141414; border-radius: 4px; padding: 4px 10px; font-family: var(--sans); box-shadow: inset 0 1px 3px rgba(0,0,0,.15), 0 2px 5px rgba(0,0,0,.25); }
#songTitle::placeholder { color: #999; font-style: italic; }
.iconBtn { width: 44px; height: 40px; border: none; background: none; color: var(--on-ground); font-size: 26px; display: grid; place-items: center; border-radius: 8px; }
.iconBtn:active { background: rgba(255,255,255,.12); }
#setupBtn { justify-self: center; min-width: 150px; padding: 5px 20px; font-size: 17px; color: #123; background: linear-gradient(#f7fbff, #cfe3fb); border: 1px solid #7fa6d6; border-radius: 4px; box-shadow: 0 1px 0 #fff inset, 0 2px 4px rgba(0,0,0,.35); }
#setupBtn:active { background: linear-gradient(#cfe3fb, #f7fbff); }

/* ── bar navigation (bracket) ── */
#nav { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; gap: 6px; }
#nav .arrow { width: 30px; height: 30px; padding: 0; border: 1.5px solid #141414; border-radius: 5px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 19px; font-weight: 800; line-height: 1; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#nav .arrow:active { background: linear-gradient(#ffd27a, #f5a623); }
#nav .arrow:disabled { opacity: .35; box-shadow: none; }
#bracket { position: relative; height: 30px; }
#bracket::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 10px; border: 2px solid var(--tag); border-bottom: none; border-radius: 3px 3px 0 0; }
#barLabel { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); background: #111; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  padding: 2px 10px; border-radius: 3px; white-space: nowrap; border: none; text-transform: uppercase; }
#barDots { position: absolute; left: 8px; right: 8px; top: 25px; height: 5px; display: flex; gap: 2px; }
#barDots i { flex: 1; height: 5px; border-radius: 2px; background: rgba(255,255,255,.18); cursor: pointer; }
#barDots i.g { background: var(--green); } #barDots i.y { background: var(--yellow); } #barDots i.w { background: rgba(255,255,255,.55); }
#barDots i.cur { outline: 1.5px solid #fff; outline-offset: 1px; }
#barDots i.play { box-shadow: 0 0 0 1px var(--box); }

/* ── beat header ── */
#beatRow { position: relative; height: 20px; margin-bottom: -3px; overflow: hidden; grid-column: 1 / -1; grid-row: 1; }
#beatRow[hidden] { display: none; }
#beatRow .inner { position: absolute; inset: 0; will-change: transform; }
#beatRow .beat { position: absolute; top: 2px; height: 16px; display: flex; align-items: center; transform: translateX(-50%); }
#beatRow .beat b { background: #111; color: #fff; font-size: 10px; font-weight: 600; height: 16px; line-height: 16px; padding: 0 6px; border-radius: 2px; white-space: nowrap; border: 1px solid #000; }
#beatRow .beat i { display: none; }
#beatRow .beat .ch { color: #ffd58a; font-family: var(--serif); font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
#beatRow .beat .ch.carried { opacity: .55; font-style: italic; }
#beatRow .beat:active b { background: var(--accent); }
#beatRow .beat.active b { background: var(--box); color: #111; border-color: #a86d10; }

/* ── windows ── */
.win { position: relative; display: grid; grid-template-columns: 42px 1fr 30px; gap: 0 4px; align-items: start; }
.win .frame, .win .gutter { align-self: start; }
.win .gutter { position: relative; display: flex; flex-direction: column; align-items: stretch; margin-top: 0; margin-bottom: 0; }
.win .gutter svg { display: block; width: 42px; }
.win .frame { background: var(--paper); border: 1.5px solid #141414; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.18);
  overflow: hidden; position: relative; }
.win .frame { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.win .frame::-webkit-scrollbar { display: none; }
.win .frame svg { display: block; touch-action: none; shape-rendering: geometricPrecision; }
.win .frame svg line.stl { shape-rendering: crispEdges; }
.win .side { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 7px; padding: 2px 0; align-self: stretch; }   /* as tall as the stave, so the trash can sink to its foot */
.win .solo { width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); font-size: 12px; }
.win .solo.on { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
.win .psel { width: 24px; height: 24px; padding: 0; border: 2px solid #2f7fd6; border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); font-size: 12px; }
.win .psel.on { background: #2f7fd6; color: #fff; }
.win .psel.playing { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
.win.closed .psel { display: none; }
.win .chordBtn { width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); display: grid; place-items: center; }
.win .chordBtn .ico { width: 20px; height: 20px; display: block; }
.win .chordBtn.on { background: linear-gradient(#ffd27a, #f5a623); color: #111; border-color: #a86d10; }
.win.closed .chordBtn { display: none; }
.win .pselClose { width: 24px; height: 24px; padding: 0; border: 1.5px solid #2f7fd6; border-radius: 4px; background: rgba(0,0,0,.25); color: #fff; font-size: 13px; font-weight: 700; line-height: 1; }
.win .pselClose:active { background: #2f7fd6; }
.win.closed .pselClose { display: none; }
.win .focus { display: none; width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); font-size: 13px; }
.win .focus.on { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
.win .trash:active { background: var(--danger); }
.win.closed .trash { display: none; }
.win .trash { margin-top: auto; width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.7); border-radius: 4px; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; }   /* sinks to the bottom of the column; a bright bin */
.win .trash .ico { width: 18px; height: 18px; display: block; }
.win .trash:active { background: var(--danger); }
.win.closed .trash { display: none; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4), (max-height: 520px) and (min-aspect-ratio: 5/4) { .win .focus { display: block; } }
/* one window given the whole screen (wide layouts) */
#app.focused { max-width: none !important; grid-template-columns: 1fr !important; }
#app.focus-mel { grid-template-areas: "head" "nav" "mel" "rhy" "lyr" "arrows" "undo" "pal" !important; }
#app.focus-acc { grid-template-areas: "head" "nav" "acc" !important; }
#app.focus-bass { grid-template-areas: "head" "nav" "bass" !important; }
#app.focus-mel :is(#accWin, #bassWin, #foot), #app.focus-acc :is(#melWin, #rhyStrip, #lyrStrip, #palette, #bassWin, #foot), #app.focus-bass :is(#melWin, #rhyStrip, #lyrStrip, #palette, #accWin, #foot) { display: none !important; }
.win.closed .solo { display: none; }
.win .gear { width: 24px; height: 24px; border: none; background: none; color: var(--on-ground); font-size: 17px; padding: 0; line-height: 1; opacity: .9; }
.ico { width: 1em; height: 1em; display: block; margin: auto; pointer-events: none; }
#gearBtn .ico { width: 22px; height: 22px; }
.win .gear .ico { width: 16px; height: 16px; }
.win .sizer { width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); display: grid; place-items: center; }
.win .sizer .sz { display: block; width: 12px; height: 9px; border: 1.5px solid currentColor; border-radius: 1px; position: relative; }
.win.half .sizer .sz { height: 5px; }
.win.closed .sizer .sz { height: 9px; border-top-width: 4px; }
.win.closed .frame, .win.closed .gutter { display: none; }
.win.closed { min-height: 22px; grid-template-columns: 42px 1fr 30px; }
.win.closed .side { flex-direction: row; gap: 6px; grid-column: 3; }
.win.closed .winHead { position: static; transform: none; justify-self: start; grid-column: 2; }
#melWin.closed::before { content: ""; grid-column: 1; }
.win .rArr { width: 16px; height: 16px; flex: 0 0 16px; align-self: center; border: 1.5px solid #141414; border-radius: 4px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 12px; font-weight: 800; padding: 0; line-height: 13px; position: static; margin: 0 auto; letter-spacing: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); z-index: 1; display: grid; place-items: center; }
.win .rArr:active { background: linear-gradient(#ffd27a, #f5a623); }
.win .rArr.up { top: 1px; } .win .rArr.dn { bottom: 1px; }
.win .rArr { font-size: 0; position: absolute; left: 1px; margin: 0; }
.win .rArr::before { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-left: 2px solid #111; border-top: 2px solid #111; }   /* a drawn chevron sits dead centre */
.win .rArr.up::before { transform: translate(-50%, -30%) rotate(45deg); }
.win .rArr.dn::before { transform: translate(-50%, -70%) rotate(225deg); }
.win .gutter svg text { paint-order: stroke; stroke: var(--ground); stroke-width: 2px; stroke-linejoin: round; }
.winHead { position: absolute; left: 50%; transform: translateX(-50%); top: -9px; z-index: 2; background: #111; color: #fff; font-size: 10.5px; font-weight: 700; height: 18px; line-height: 16px;
  letter-spacing: .06em; padding: 0 12px; border-radius: 3px; white-space: nowrap; text-transform: uppercase; border: 1px solid #000; max-width: calc(100% - 100px); overflow: hidden; text-overflow: ellipsis; }
#accWin, #bassWin { margin-top: 10px; }
#rhyStrip { margin-top: -3px; }                 /* right under the stave */
/* rolled layout: the hidden windows' empty grid rows still add gaps — take them back so the strip hugs the open stave */
#app.rolled.open-mel #rhyStrip { margin-top: -17px; }
#app.rolled.open-acc #rhyStrip { margin-top: -10px; }
#app.rolled.open-acc #accWin.lead { margin-top: -7px; }
#app.rolled.open-bass #bassWin.lead { margin-top: -14px; }
#app:not(.rolled) .win.lead:not(#melWin) { margin-top: 26px; }
#app:not(.rolled) .win.lead .winHead { top: -30px; }
#melWin .winHead { display: none; }
#melWin.closed .winHead { display: block; }
.win.compact .gutter svg text { font-size: 7px; }
.win.playing .frame { box-shadow: inset 0 0 0 2px var(--box), inset 0 2px 8px rgba(0,0,0,.28); }

/* ── strips ── */
.strip { display: grid; grid-template-columns: 42px 1fr 30px; gap: 0 4px; align-items: center; }
.strip .tag { justify-self: stretch; height: 24px; display: grid; place-items: center; background: linear-gradient(#a6e06a, var(--tag)); color: var(--tag-ink); border: 1px solid #3a8a1e; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: none; padding: 0 2px; white-space: nowrap; overflow: hidden; }
.strip .tag:active { filter: brightness(1.1); }
.strip .body { border: 1.5px solid #141414; border-radius: 4px; overflow-x: auto; overflow-y: hidden; position: relative; scrollbar-width: none; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
.strip .body::-webkit-scrollbar { display: none; }
.strip .body svg { display: block; touch-action: none; }
/* the Rhythm strip: an inset bar of matte silver; the white entries carry a dark hairline so they stay crisp on it */
#rhyStrip .body { border-radius: 0; border: 1px solid #4a4e54; border-top-color: #2e3136; border-left-color: #35383d; border-bottom-color: #f2f3f5; border-right-color: #e6e8eb;   /* a shallow flat inset: square corners, a dark edge above and left, a light lip below and right */
  background: linear-gradient(180deg, #cfd3d8 0%, #e4e7eb 30%, #dcdfe4 55%, #cdd1d6 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,.22), inset 1px 0 1px rgba(0,0,0,.12); }
#rhySvg { filter: drop-shadow(0 0 0.7px rgba(0,0,0,.9)) drop-shadow(0 0.6px 0.6px rgba(0,0,0,.45)); }
#lyrStrip .body { background: var(--lyric); box-shadow: 0 0 0 2px var(--tag) inset; }
#lyrStrip .body svg text { font-family: var(--sans); font-weight: 700; fill: var(--lyric-ink); }
#lyrStrip.serif .body svg text, #wordEdit.serif input { font-family: var(--serif); font-weight: 600; }
#lyrStrip.smallcaps .body svg text, #wordEdit.smallcaps input { font-family: var(--serif); font-variant: small-caps; font-weight: 700; letter-spacing: .02em; }

/* ── palette: note lengths + editing tools ── */
#palette { display: flex; flex-direction: column; gap: 4px; padding: 5px 6px; background: var(--ground2); border: 1.5px solid #141414; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 5px rgba(0,0,0,.25); }
#palette .prow { display: flex; gap: 4px; align-items: center; justify-content: flex-start; height: 30px; }
#palette .prow[hidden] { display: none; }
#palette .prow .flexgap { flex: 1 1 0; min-width: 4px; }                                      /* pushes what follows to the right corner */
#palette .prow button { width: 32px; min-width: 32px; height: 28px; padding: 0; flex: 0 0 32px; }
#palette .prow button.txt { padding: 0; }
#palette .prow .who { margin-left: 4px; }
#palette .prow button.chord { width: auto; min-width: 44px; flex: 0 0 auto; padding: 0 7px; }
#palette .prow button.len { flex: 1 1 0; width: auto; min-width: 22px; padding: 0; }          /* the lengths fill the top row edge to edge */
#palette .prow button.gn { display: inline-flex; align-items: center; justify-content: center; }
#palette .prow button.gn svg { display: block; }
/* ── time signature calculator ── */
.tsc .strip { background: var(--ground2); border: 1.5px solid #141414; border-radius: 4px; overflow-x: auto; overflow-y: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,.3); }
.tsc .strip svg { display: block; }
.tsc .pal { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.tsc .prow { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
.tsc .k { flex: 0 0 40px; width: 40px; height: 44px; padding: 0; border: 1px solid #222; border-radius: 6px; background: linear-gradient(#fff, #d9d9d9); color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.tsc .k .g { font-size: 18px; line-height: 20px; font-family: var(--serif); }
.tsc .k .cap { font-size: 8px; line-height: 10px; color: #444; font-family: var(--sans); font-weight: 600; }
.tsc .prow.rests .k { background: linear-gradient(#f4f4f4, #cfcfcf); }
.tsc .prow.mods .k { background: linear-gradient(#ffe38a, #e6b400); border-color: #a07d00; }
.tsc .ctl { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
.tsc .ctl .flex { flex: 1; }
.tsc .ctl .bpm { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
.tsc .res { margin-top: 8px; }
.tsc .best { font-size: 16px; margin: 4px 0 6px; }
.tsc .rank { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.tsc .rank .sc { font-size: 10px; opacity: .7; }
.tsc .bars .bar { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-bottom: 1px solid #ddd; }
.tsc .bars .no { font-size: 11px; font-weight: 700; color: #555; min-width: 44px; }
.tsc .bars .gl { font-family: var(--serif); font-size: 20px; letter-spacing: .04em; white-space: pre-wrap; }
#palette .prow button.wide { width: auto; min-width: 48px; flex: 0 0 auto; padding: 0 8px; }
#palette .prow button.lyr.warn { color: var(--danger); }
#palette .prow .gap { flex: 0 0 8px; }
/* ── floating tool palette ── */
#app.ftp #palette { visibility: hidden; }
#app.ftp #rhySvg, #app.ftp #lyrSvg { pointer-events: none; }                   /* the staves keep their pointer: swipes scroll, taps are ignored in code */
#ftp { position: fixed; z-index: 60; left: 0; top: 0; width: 196px; background: #3fb5f2; border: 2px solid #0d2f45; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.45); padding: 0 5px 5px; user-select: none; -webkit-user-select: none; transform-origin: top left; touch-action: none; font-family: var(--sans); }
#ftp[hidden] { display: none; }
#ftp.size-s { transform: scale(.82); } #ftp.size-l { transform: scale(1.2); }
#ftp .ftpGrip { height: 26px; margin: 0 -5px; display: grid; place-items: center; color: transparent; font-size: 0; cursor: grab; touch-action: none; }
#ftp .ftpGrip::before { content: ""; width: 72px; height: 7px; border-radius: 4px; background: rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
#ftp .ftpGrip:active { cursor: grabbing; }
#ftp .row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
#ftp button { border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; border-radius: 4px; height: 30px; min-width: 30px; padding: 0 4px; font-size: 17px; line-height: 1; display: grid; place-items: center; }
#ftp button:disabled { opacity: .35; }
#ftp button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; border-color: #1b4f8a; }
#ftp button.warn { color: var(--danger); }
#ftp .seg3 { display: flex; border: 1.5px solid #111; border-radius: 4px; overflow: hidden; }
#ftp .seg3 button { border: none; border-radius: 0; width: 30px; min-width: 30px; height: 26px; font-weight: 800; font-size: 15px; background: linear-gradient(#f4f4f4, #cfcfcf); }
#ftp .seg3 button.on { background: #111; color: #fff; }
#ftp .sp { flex: 1; }
#ftp .ftpLbl { flex: 1; min-width: 0; height: 30px; background: #111; color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .02em; border-radius: 3px; border: 1px solid #000; white-space: nowrap; overflow: hidden; padding: 0 2px; display: flex; flex-direction: column; justify-content: center; line-height: 11px; }
#ftp .ftpLbl .sub { font-size: 7.5px; font-weight: 600; opacity: .75; letter-spacing: .04em; }
#ftp .arrow { width: 38px; min-width: 38px; height: 32px; border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; font-size: 22px; font-weight: 800; border-radius: 4px; }
#ftp .arrow:active { background: linear-gradient(#ffd27a, #f5a623); }
#ftp .ftpPlay { width: 34px; min-width: 34px; height: 26px; font-size: 13px; }
#ftp .main { display: flex; gap: 5px; align-items: stretch; margin-bottom: 4px; }
#ftp.side-left .main { flex-direction: row-reverse; }
#ftp .grid { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; padding: 4px; background: #0d2f45; border-radius: 4px; }
#ftp .grid button { width: 40px; min-width: 40px; height: 34px; font-size: 19px; }
#ftp .grid button.art { font-family: var(--serif); font-size: 16px; }
#ftp .grid button.art.armed { background: linear-gradient(#ffd27a, #f5a623); border-color: #a86d10; }
#ftp .grid button.undo { font-size: 16px; }
#ftp .grid button.txt { font-size: 14px; font-weight: 700; }
#ftp .pitch { display: flex; flex-direction: column; align-items: center; width: 40px; }
#ftp .pitch .pBtn { width: 40px; min-width: 40px; height: 40px; border: none; background: none; color: #111; font-size: 28px; font-weight: 800; padding: 0; }
#ftp .pitch .pBtn:active { color: #fff; }
#ftp .pitch .pLbl { flex: 1; width: 22px; min-width: 22px; height: auto; padding: 0; background: #111; color: #fff; writing-mode: vertical-rl; text-orientation: mixed; display: grid; place-items: center; font-size: 9px; font-weight: 700; letter-spacing: .1em; border-radius: 3px; border: 1px solid #000; margin: 2px 0; }
#ftp .pitch .pLbl.on { background: linear-gradient(#6fb3ff, #2f7fd6); border-color: #1b4f8a; }
#ftp .pitch .pCur { width: 34px; height: 22px; margin-top: 4px; background: #ffe600; color: #111; font-weight: 800; font-size: 10.5px; border: 1.5px solid #111; border-radius: 3px; display: grid; place-items: center; }
#ftp .tag { height: 24px; min-width: 0; padding: 0 6px; background: var(--tag); border-color: #3f6f18; color: #143; font-weight: 800; font-size: 12px; font-family: var(--sans); }
#ftp .ftpIn { width: 30px; min-width: 30px; height: 26px; font-size: 15px; }
#ftp .ftpHead button.icon { width: 30px; min-width: 30px; height: 26px; }
#ftp .ftpHead .ico { width: 16px; height: 16px; }
#palette .prow button.pop { margin-left: auto; font-size: 16px; }

#palette button { min-width: 28px; height: 28px; border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; border-radius: 4px; font-size: 18px; padding: 0 6px;
  font-family: var(--music), var(--serif); box-shadow: 0 1px 2px rgba(0,0,0,.4); }

#palette button.txt { font-family: var(--sans); font-size: 12px; font-weight: 600; }


#palette button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; border-color: #1b4f8a; }
#palette button.warn { color: var(--danger); }
#palette button.undo { font-family: var(--sans); font-size: 17px; }
#palette button.art { font-family: var(--serif); font-size: 16px; }
#palette button.art.slurk { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1; }   /* the slur: its arc with SLUR beneath */
#palette button.art.slurk .aglyph { font-size: 15px; line-height: 1; }
#palette button.art.slurk .acap { font-family: var(--sans); font-size: 6.5px; font-weight: 800; letter-spacing: .04em; line-height: 1; }
#palette button.art.armed { background: linear-gradient(#ffd27a, #f5a623); border-color: #a86d10; }
#palette button.lyr { font-family: var(--sans); font-size: 10.5px; font-weight: 600; }
#palette button:disabled { opacity: .35; }
#palette .gap { width: 8px; }
#palette .who { font-size: 11px; color: var(--on-ground2); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

/* ── footer ── */
/* the arrow row and UNDO / REDO: wide, not tall, between the Lyrics strip and the tools */
#arrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
#undoRow { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 22px; }             /* the arrows are 22px tall: this row sits flush beneath them */
#mvRow { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 44px; }               /* and MOVE / DELETE flush beneath UNDO / REDO */
#arrows, #undoRow, #mvRow { width: 37.5%; justify-self: end; }                                           /* the right side of the row, three quarters of the size it was */
#arrows, #undoRow, #mvRow { grid-row: arrows-start / undo-end; align-self: start; }                     /* both share the tall cell beside the quick palette, at its top, the same distance from the Lyrics strip */
#arrows button, #undoRow button, #mvRow button { border-radius: 0; }                                            /* one block: shared edges, rounded only at the corners */
#arrows button + button, #undoRow button + button, #mvRow button + button { border-left: none; }
#undoRow button, #mvRow button { border-top: none; }
#arrows button:first-child { border-top-left-radius: 4px; } #arrows button:last-child { border-top-right-radius: 4px; }
#mvRow button:first-child { border-bottom-left-radius: 4px; } #mvRow button:last-child { border-bottom-right-radius: 4px; }
#arrows button { display: grid; place-items: center; }
/* the quick palette: the left half beside the arrows — its own lengths, movable when unlocked, and it can float */
#quick { grid-column: arrows; grid-row: arrows-start / undo-end; justify-self: start; align-self: start; width: calc(50% - 3px); display: grid; grid-template-columns: 24px repeat(4, 1fr); grid-template-rows: repeat(3, 30px); gap: 0; border: 1.5px solid #141414; border-radius: 4px; background: var(--ground2); overflow: hidden; box-shadow: 0 2px 4px rgba(0,0,0,.4); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
#quick .qgrip { display: none; }
#quick .qctl { grid-row: 1 / 4; display: flex; flex-direction: column; background: #111; }
#quick .qctl button { flex: 1 1 0; width: 24px; min-width: 0; padding: 0; border: none; border-radius: 0; background: transparent; color: #ddd; font-size: 14px; line-height: 1; display: grid; place-items: center; }
#quick .qctl button.on { color: #f5c518; }
#quick .qctl .lico { width: 17px; height: 19px; display: block; }
#quick .cell { display: grid; place-items: center; border-left: 1px solid rgba(0,0,0,.35); min-width: 0; }
#quick .cell button { width: 100%; height: 100%; padding: 0; border: none; border-radius: 0; background: linear-gradient(#fff, #d9d9d9); color: #111; display: grid; place-items: center; }
#quick .cell:nth-child(n+7) button { border-top: 1px solid rgba(0,0,0,.35); }
#quick .cell button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; }
#quick .cell button.artk { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1; font-family: var(--serif); }
#quick .cell button.artk .aglyph { font-size: 15px; line-height: 1; }
#quick .cell button.artk .acap { font-family: var(--sans); font-size: 6.5px; font-weight: 800; letter-spacing: .04em; line-height: 1; }
#quick .cell button .dotg { font-size: 22px; line-height: 1; font-weight: 700; }
#quick .cell button.lift { position: relative; z-index: 5; opacity: .9; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
#quick .cell.over { outline: 2px dashed #f5a623; outline-offset: -3px; }
#quick.unlocked .cell button { cursor: grab; }
#quick.float { position: fixed; z-index: 60; width: 190px; grid-template-rows: 24px repeat(3, 30px); }
#quick.float .qgrip { display: block; grid-column: 1 / -1; height: 24px; background: #333; cursor: move; position: relative; touch-action: none; }
#quick.float .qgrip::after { content: ""; position: absolute; left: 50%; top: 4px; width: 27px; height: 16px; margin-left: -13px;   /* a raised six-dot waffle: three across, two down */
  background-image: radial-gradient(circle at 42% 38%, #f2f2f2 0.9px, transparent 1.3px), radial-gradient(circle at 50% 50%, #a8a8a8 2.1px, #6a6a6a 2.5px, transparent 3px);
  background-size: 9px 8px; background-position: 0 0, 0 0; }
#quick.float .qctl { grid-row: 2 / 5; }
#app.focus-acc #quick, #app.focus-bass #quick { display: none; }
#arrows .aico { width: 15px; height: 15px; display: block; }
#arrows button, #undoRow button, #mvRow button { height: 22px; padding: 0; border: 1.5px solid #141414; border-radius: 4px; background: linear-gradient(#fff, #d9d9d9); color: #111; font-size: 14px; font-weight: 700; box-shadow: 0 2px 4px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7); }
#undoRow button, #mvRow button { font-family: var(--sans); font-size: 10px; letter-spacing: .05em; }
#mvRow #delBtn { color: var(--danger); }
#mvRow button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; }
#arrows button:active, #undoRow button:active, #mvRow button:active { background: linear-gradient(#ffd27a, #f5a623); }
#undoRow button:disabled { opacity: .45; }
#transport { display: flex; gap: 6px; }
#transport button { width: 42px; height: 40px; border: 1.5px solid #141414; border-radius: 4px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 17px; padding: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#transport button.on { background: linear-gradient(#ffd27a, #f5a623); }

/* ═══════════════════════════════════════════════════════════════════════
   4. SHEETS & CONTROLS (settings, setup, chords, library)
   ═══════════════════════════════════════════════════════════════════════ */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 80; align-items: flex-end; justify-content: center; }

#modal { background: #f7f7f7; color: #111; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(0,0,0,.4); -webkit-user-select: text; user-select: text; }
@media (min-width: 640px) { #overlay { align-items: center; padding: 20px; } #modal { border-radius: 16px; } }

.pLbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #555; font-weight: 700; margin: 10px 0 4px; }
.pRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #111; color: #fff; padding: 9px 16px; border-radius: 999px;
  font-size: 13px; opacity: 0; transition: .2s; z-index: 90; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* inline word editor on the lyric strip */
#lyrStrip { position: relative; }
#wordEdit { position: fixed; z-index: 70; display: none; flex-direction: column; gap: 4px; background: #fff; border: 2px solid var(--tag); border-radius: 8px 8px 0 0; padding: 4px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,.4); color: #111; left: 0 !important; right: 0; bottom: 0; top: auto; margin: 0 auto; max-width: 560px; }
#wordEdit.on { display: flex; }
body.kbOpen #app { padding-bottom: 410px; }              /* room to scroll the strip up above the docked keyboard */
#wordEdit .weGrip { height: 26px; margin: -2px -4px 0; display: grid; place-items: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#wordEdit .weGrip:active { cursor: grabbing; }
#wordEdit .weGrip span { width: 64px; height: 7px; border-radius: 4px; background: #b5b5b5; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #888; }
#wordEdit.floating { bottom: auto; right: auto; margin: 0; width: min(560px, calc(100vw - 8px)); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
#wordEdit .weRow { display: flex; align-items: center; gap: 4px; }
#wordEdit .weRow .flex { flex: 1; }
#wordEdit .weRow button { width: 32px; height: 30px; }
#wordEdit .weRow button.panelk { width: auto; padding: 0 9px; font-size: 10px; font-weight: 800; letter-spacing: .04em; border: 1px solid #93a9c2; border-radius: 6px; background: #edf1f6; color: #123; }   /* HIDE PANEL / SHOW PANEL */
#wordEdit .weRow .mico2 { width: 40px; height: 10px; display: block; }
/* a tap outside the keyboard: it blinks twice around its edge and the small ✕ flashes, and stays open */
@keyframes weBlink { 0%, 100% { border-color: var(--tag); box-shadow: 0 -4px 16px rgba(0,0,0,.4); } 25%, 75% { border-color: #ff3b30; box-shadow: 0 0 0 4px rgba(255,59,48,.55), 0 -4px 16px rgba(0,0,0,.4); } 50% { border-color: var(--tag); box-shadow: 0 -4px 16px rgba(0,0,0,.4); } }
@keyframes weFlash { 0%, 100% { background: transparent; color: inherit; } 25%, 75% { background: #ff3b30; color: #fff; } 50% { background: transparent; } }
#wordEdit.blink { animation: weBlink .9s ease-in-out 1; }
#wordEdit.blink .weRow button.close { animation: weFlash .9s ease-in-out 1; }
#lyrInline { position: absolute; top: 3px; height: 30px; display: none; border: none; outline: none; background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 3px;
  font-family: var(--sans); font-weight: 700; font-size: 16px; color: #fff; caret-color: transparent; min-width: 10px; }   /* the empty box may be as narrow as what is left of its beat */
#weCaret { position: absolute; top: 8px; width: 2px; height: 20px; background: #fff; border-radius: 1px; display: none; pointer-events: none; z-index: 3; }
#weCaret.on { display: block; }
#lyrSvg rect.chip { cursor: grab; } #lyrSvg rect.grip { cursor: ew-resize; }
#lyrInline.on { display: block; }
#lyrInline::placeholder { color: rgba(255,255,255,.6); font-weight: 400; }
#lyrStrip.serif #lyrInline { font-family: var(--serif); font-weight: 600; }
#lyrStrip.smallcaps #lyrInline { font-family: var(--serif); font-variant: small-caps; }
#lyrStrip .body { overflow-y: visible; }
#wordEdit .weKeys { display: flex; flex-direction: column; gap: 3px; }
#wordEdit .weKeys .krow { display: flex; gap: 3px; justify-content: center; }
#wordEdit .weKeys button { flex: 1 1 0; min-width: 0; height: 38px; padding: 0; font-size: 17px; font-family: var(--sans); background: #f4f4f4; border: 1px solid #bbb; border-radius: 6px; color: #111; box-shadow: 0 1px 0 #999; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#wordEdit .weKeys button:active { background: #cfe3fb; transform: translateY(1px); }
#wordEdit .weKeys .krow { gap: 4px; }
#wordEdit .weKeys button.sym { font-family: var(--serif); }
#wordEdit .weKeys button.wide { flex: 1.6 1 0; font-size: 12px; font-weight: 600; }
#wordEdit .weKeys button.space { flex: 2.4 1 0; }
#wordEdit .weKeys button.on { background: #cfe3fb; border-color: #7fa6d6; }
#wordEdit .weKeys button.go { background: var(--accent); color: #fff; border-color: var(--accent); }
#wordEdit .weKeys button.go, #wordEdit .weKeys button.go2 { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; white-space: normal; padding: 0; }
#wordEdit .weKeys button.space { flex: 2.4 1 0; }
#wordEdit .weKeys button.setk { background: var(--lyric); border-color: #2a6aa0; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .06em; box-shadow: inset 0 0 0 4px rgba(255,255,255,.22), inset 0 0 0 5px rgba(255,255,255,.55); }   /* SET: looks like a chip sitting on the Lyrics strip */
/* the tool panel below the letters: four columns of rounded keys with silver-blue edges */
#wordEdit .weKeys .panel { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.3fr; grid-auto-rows: 31px; gap: 4px; padding: 5px; border: 1px solid #93a9c2; border-radius: 10px; background: #edf1f6; }
#wordEdit .weKeys .panel button { height: 31px; width: 100%; font-size: 8.5px; font-weight: 800; letter-spacing: .03em; line-height: 1.15; white-space: normal; padding: 0 2px; border: 1px solid #93a9c2; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 1px 0 #a9b9cc; }
#wordEdit .weKeys .panel button .l { display: block; }
#wordEdit .weKeys .panel button .cap { font-size: 7.5px; }
#wordEdit .weKeys .panel button.modek { flex-direction: row; gap: 3px; font-size: 9px; font-weight: 700; white-space: nowrap; }
#wordEdit .weKeys .panel button.modek .mico2 { width: 24px; height: 9px; display: block; flex: 0 0 auto; }
#wordEdit .weKeys .panel button.modek.on { background: #cfe3fb; border-color: #7fa6d6; }
#wordEdit .weKeys .panel button.delk { background: #ff3b30; border-color: #b8211a; color: #fff; }
#wordEdit .weKeys .panel button.pickk { background: #92d050; border-color: #5f9a2a; color: #0f2a05; }
#wordEdit .weKeys .panel button.pickk.on { background: #3f9a2e; border-color: #2c6e1f; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.8); }
#wordEdit .weKeys .panel button.go, #wordEdit .weKeys .panel button.go2 { font-size: 8.5px; }
#wordEdit .weKeys .panel button.go3 { background: #fff; gap: 1px; }
#wordEdit .weKeys .panel button.go3 .l { font-size: 7.2px; letter-spacing: .01em; white-space: nowrap; }
#wordEdit .weKeys .panel button.go3 .big { font-size: 13px; line-height: 1; font-weight: 800; }
#wordEdit .weKeys .panel button.setk { font-size: 10px; gap: 0; }
#wordEdit .weKeys .panel button.setk .big { font-size: 15px; line-height: 1; }
#wordEdit .weKeys .panel button.setk .cap { font-size: 8.5px; }
#wordEdit .weKeys .panel button.urk { flex-direction: row; gap: 4px; }
#wordEdit .weKeys .panel button.urk .cap { font-size: 9px; }
#wordEdit .weKeys .panel button.restk .rest { font-size: 15px; line-height: 1; font-family: var(--serif); }
#wordEdit .weKeys .panel .curl { width: 16px; height: 13px; display: block; }
#wordEdit .weKeys .panel .sico2 { width: 40px; height: 13px; display: block; }
#wordEdit .weKeys .panel .narr { margin: 0; }
#wordEdit .weKeys .panel .sico { width: 44px; }
#wordEdit .weKeys button.go2 { background: #e8f1fc; border-color: #7fa6d6; color: #123d6e; }
#wordEdit .lbl2 { display: none; }                                                              /* no hint line above the keys */
#wordEdit .weKeys button.nudge, #wordEdit .weKeys button.splitk { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; }
#wordEdit .weKeys button .big { font-size: 22px; line-height: 1; font-weight: 700; }
#wordEdit .weKeys button .cap { font-size: 7.5px; font-weight: 800; letter-spacing: .04em; line-height: 1; }
#wordEdit .weKeys .sico { width: 56px; height: 12px; display: block; }
#wordEdit .weKeys .narr { width: 28px; height: 14px; display: block; margin: 2px auto 0; }
#wordEdit .weKeys button.backk { flex: 2.3 1 0; display: flex; align-items: center; justify-content: center; gap: 1px; padding: 0; }   /* a small arrow tight against the B */
#wordEdit .weKeys button.backk .cap { letter-spacing: .01em; }
#wordEdit .weKeys button .sarr { font-size: 11px; line-height: 1; font-weight: 700; }
#lyrInline:disabled { opacity: .7; }
#wordEdit.native .weKeys { display: none; }
#wordEdit button.kb.on { background: #cfe3fb; }
#wordEdit { width: 100%; }
#wordEdit .lbl2 { font-size: 10px; color: #555; white-space: nowrap; }
#wordEdit input { width: 130px; border: none; background: none; font-family: var(--serif); font-size: 16px; font-weight: 700; padding: 3px 2px; outline: none; color: #111; }
#wordEdit button { width: 28px; height: 28px; border: none; border-radius: 6px; background: #e6e6e6; font-size: 13px; padding: 0; color: #111; }
#wordEdit button.ok { background: var(--accent); color: #fff; }

/* ═══════════════════════════════════════════════════════════════════════
   5. PART VIEW & PERFORMANCE MODE (unchanged from the engine)
   ═══════════════════════════════════════════════════════════════════════ */
#partView, #perfView { position: fixed; inset: 0; z-index: 100; background: #f7f7f7; color: #111; overflow: auto; display: none; -webkit-user-select: text; user-select: text; }
#partView.on, #perfView.on { display: block; }
.pvTop { position: sticky; top: 0; background: #f7f7f7; border-bottom: 1px solid #ccc; padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 2; flex-wrap: wrap; }
.pvTop h2 { flex: 1 1 100%; font-size: 22px; margin: 0; font-family: var(--serif); font-weight: 500; }
@media (min-width: 700px) { .pvTop h2 { flex: 1 1 auto; } }
.pvBody { padding: 14px 16px 60px; max-width: 1100px; margin: 0 auto; }
.pvSec { margin: 14px 0 22px; }
.pvSec h3 { font-size: 18px; margin: 0 0 6px; font-family: var(--serif); font-weight: 500; }
.pvBars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pvBar { border: 1px solid #ccc; border-radius: 12px; padding: 8px 10px; background: #fff; min-height: 64px; }
.pvBar .bn { font-size: 10px; color: #888; }
.pvBar .ch { font-family: var(--serif); font-size: 22px; }
.pvBar .ly { font-family: var(--serif); font-size: 15px; margin-top: 2px; }
.pvBar .nt { font-size: 12px; color: #555; margin-top: 3px; font-variant-numeric: tabular-nums; }
.pvBar .pat { font-size: 11px; color: #555; }
#perfView { background: #111; color: #eee; }
#perfView .pvTop { background: #111; border-color: #333; color: #eee; }
.perfLine { font-family: var(--serif); font-size: clamp(26px, 6vw, 54px); line-height: 1.3; padding: 6px 20px; color: #777; transition: color .2s, transform .2s; }
.perfLine.cur { color: #fff; transform: scale(1.02); }
.perfLine.done { color: #444; }
.perfLine .sec { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #a06a5a; margin-top: 18px; }
.perfWrap { padding: 40px 0 50vh; max-width: 900px; margin: 0 auto; }
@media print { #app, #overlay, #toast { display: none !important; } #partView { position: static; display: block !important; } .pvTop button { display: none; } }
</style>
</head>

    let chain = sel && S.sel.part === "melody" && !sel.rest ? chainOf(bar, sel) : null;
    if (!chain) chain = chains(bar).find(c => !c.rest && c.head.m == null && !tiedFromPrev(bi, c)) || null;
    if (chain) { setChainPitch(bar, chain, m); S.sel = null; const next = chains(bar).find(c => !c.rest && c.head.m == null && !tiedFromPrev(bi, c)); if (next) S.sel = { bi, part: "melody", id: next.head.id }; }
    else { const t = rhythmEnd(bar); if (t >= B - 1e-6) { toast("Bar is full"); return; } bar.ev.melody.push({ id: uid(), t, d: Math.min(noteLenBeats(), freeSpan(bar, t)), m }); }
    syncNotesToChips(bar); if (S.followWords) S.cursor = nextUnpitchedChip(bi, null);
  } else {
    if (!bar.custom[part]) { toast(`${PART_META[part].label}: switch to Custom to record notes`); return; }
    const last = [...bar.ev[part]].sort((a, b) => a.t - b.t).pop(), t = last ? r3(last.t + last.d) : 0;
    if (t >= B - 1e-6) { toast("Bar is full"); return; }
    bar.ev[part].push({ id: uid(), t, d: Math.min(noteLenBeats(), B - t), m });

}
function midiRow(part, win) {
  const row = el("div", { class: "pRow tight" });
  if (!navigator.requestMIDIAccess) { row.append(el("span", { class: "tiny" }, "Web MIDI isn't available in this browser (Chrome, Edge and Opera support it; iOS Safari doesn't).")); return row; }
  const sel = el("select", { class: "sel", onchange: e => { S.midi = S.midi || {}; S.midi[part] = e.target.value || null; savePrefs(); if (S.midi[part]) midiConnect().then(() => toast("MIDI connected: play a key to pitch the next note")).catch(() => toast("MIDI access was refused")); } });
  sel.append(el("option", { value: "" }, MIDI.access ? "No controller" : "Not connected"));
  MIDI.inputs.forEach(inp => sel.append(el("option", { value: inp.id, selected: S.midi && S.midi[part] === inp.id }, inp.name || inp.id)));
  row.append(sel, el("button", { class: "btn sm", onclick: () => midiConnect().then(() => { toast(MIDI.inputs.length ? `${MIDI.inputs.length} controller${MIDI.inputs.length === 1 ? "" : "s"} found` : "No MIDI controllers found — plug one in"); openWinSettings(win); }).catch(() => toast("MIDI access was refused")) }, MIDI.access ? "Rescan" : "Connect…"));
  row.append(el("span", { class: "tiny" }, part === "melody" ? "Keys pitch the selected or next empty rhythm box, or add notes at the palette length." : "Keys add notes at the palette length (Custom mode)."));
  return row;
}

/* bar text from chips — letters, spaces and symbols included */
function lyricFromChips(bar) {
  const words = []; let cur = "";
  for (const c of bar.chips) {
    if (c.rest) { if (cur) { words.push(cur); cur = ""; } words.push(REST_MARK); continue; }
    if (c.kind === "space") { if (cur) { words.push(cur); cur = ""; } continue; }
    cur += c.text;
    if (!c.kind && (c.pos === "single" || c.pos === "end")) { words.push(cur); cur = ""; }
  }
  if (cur) words.push(cur);
  return words.join(" ");
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTION 14 · BOOT
   ═══════════════════════════════════════════════════════════════════════ */
function upgradeTies(song) {                       // older songs: a note past its bar becomes a tie chain
  const B = TS_BEATS[song.sig] || 4;
  song.bars.forEach((bar, bi) => {
    bar.ev.melody.forEach(e => { if (!e.rest && e.t + e.d > B + 1e-6) { const over = r3(e.t + e.d - B); e.d = r3(B - e.t); e.tie = true; const nb = song.bars[bi + 1]; if (nb && !nb.ev.melody.some(x => x.t < over - 1e-6)) nb.ev.melody.push({ id: uid(), t: 0, d: Math.min(over, B), m: e.m }); } });
    ["bass", "accomp", "ensemble"].forEach(p => (bar.ev[p] || []).forEach(e => { if (e.t + e.d > B) e.d = r3(B - e.t); }));
    if (song.view && song.view.bassLo == null) { song.view.bassLo = 40; if (song.view.accLo === 36 || song.view.accLo === 48) song.view.accLo = 55; }
  });
}
async function boot() {
  loadPrefs();
  const fromLink = await importFromHash();
  if (!fromLink) { const cur = readJSON(STORE.cur, null); if (!cur || !loadSong(cur)) { S.song = newSong(); saveNow(); } }
  upgradeTies(S.song); S.chordsDisp = S.song.showRoman ? "roman" : S.chordsDisp;
  loadSampleMeta().then(loadSongBanks);
  $("songTitle").addEventListener("input", e => { S.song.title = e.target.value; saveSoon(); });
  $("songTitle").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("menuBtn").addEventListener("click", openMenu);
  $("gearBtn").addEventListener("click", openSettings);
  $("prevBar").addEventListener("click", () => { S.bi = Math.max(0, S.viewSpan > 1 ? viewFirst() - S.viewSpan : S.bi - 1); S.sel = null; S.ghost = null; S.active = null; renderAll(); });
  $("nextBar").addEventListener("click", () => { S.bi = Math.min(S.song.bars.length - 1, S.viewSpan > 1 ? viewFirst() + S.viewSpan : S.bi + 1); S.sel = null; S.ghost = null; S.active = null; renderAll(); });
  /* the five frames scroll as one; the beat row follows */
  const scrollers = ["melWin", "accWin", "bassWin"].map(id => $(id).querySelector(".frame")).concat(["rhyStrip", "lyrStrip"].map(id => $(id).querySelector(".body")));
  let syncing = false;
  scrollers.forEach(sc => sc.addEventListener("scroll", () => { if (syncing) return; syncing = true; scrollers.forEach(o => { if (o !== sc) o.scrollLeft = sc.scrollLeft; }); const inner = $("beatRow").querySelector(".inner"); if (inner) inner.style.transform = `translateX(${-sc.scrollLeft}px)`; syncing = false; }, { passive: true }));
  $("barLabel").addEventListener("click", openSectionOps);
  wireTempo();
  $("saveBtn").addEventListener("click", openLibrary);
  document.querySelectorAll(".win .trash").forEach(b => b.addEventListener("click", () => staveTrash(b.dataset.win)));
  $("arrUp").addEventListener("click", () => arrowUD(1)); $("arrDn").addEventListener("click", () => arrowUD(-1));
  $("arrL").addEventListener("click", () => arrowLR(-1)); $("arrR").addEventListener("click", () => arrowLR(1));
  $("undoBtn").addEventListener("click", undo); $("redoBtn").addEventListener("click", redo);
  $("moveBtn").addEventListener("click", () => mvStart("move")); $("delBtn").addEventListener("click", () => mvStart("delete"));
  $("playAllBtn").addEventListener("click", playAll);
  $("rangeBtn").addEventListener("click", openPlayRange);
  $("stopBtn").addEventListener("click", stopAll);
  document.querySelectorAll(".win .psel").forEach(b => b.addEventListener("click", () => togglePlaySelect(b.dataset.win, b)));
  document.querySelectorAll(".win .chordBtn").forEach(b => b.addEventListener("click", () => toggleChordMode(b.dataset.win)));
  document.querySelectorAll(".win .pselClose").forEach(b => b.addEventListener("click", leavePlaySelect));
  midiInit();
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });
  initPointer(); initWindowChrome(); initWordEdit(); initWake(); initQuick();
  window.addEventListener("keydown", e => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || $("overlay").classList.contains("on")) return;
    if (e.key === " ") { e.preventDefault(); if (S.playing) stopAll(); else playBarAll(); }
    else if (e.key === "Escape") { S.sel = null; S.ghost = null; S.artic = null; S.slurFrom = null; S.active = null; closeWordEdit(); if (S.focus) setFocus(S.focus); else renderAll(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
    else if (e.key === "ArrowLeft" && !S.sel) { e.preventDefault(); if (S.bi > 0) { S.bi--; renderAll(); } }
    else if (e.key === "ArrowRight" && !S.sel) { e.preventDefault(); if (S.bi < S.song.bars.length - 1) { S.bi++; renderAll(); } }
    else if (S.sel) {
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSel(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); transposeSel(e.shiftKey ? 12 : 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); transposeSel(e.shiftKey ? -12 : -1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); moveSel(-gridStep()); }
      else if (e.key === "ArrowRight") { e.preventDefault(); moveSel(gridStep()); }
      else if (e.key === "t") tapTie();
    }
  });
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

}
boot();
