  const cap = patGroupCap();
  const evts = S.bars[0].filter(e => e.type === "note" || e.type === "rest");
  const fill = evts.length ? Math.max(...evts.map(evEnd)) : 0;
  const cov = patCoverage(evts, cap);
  const meter = document.createElement("span");
  meter.style.cssText = "font-size:12.5px;font-variant-numeric:tabular-nums;" + (cov.ok ? "color:#1b5e20;font-weight:700" : "color:#444");
  meter.textContent = `P${P.groups.length + 1}: ${P.groupLen} bar${P.groupLen === 1 ? "" : "s"} · filled ${fmt(fill)} / ${fmt(cap)} s${cov.ok ? " ✓ complete" : ""}`;
  r3.append(meter,
    mkB(`Commit P${P.groups.length + 1}`, cov.ok, () => patCommit(false), !cov.ok || used >= PAT_SLOTS),
    mkB("⏭ End bar here", false, () => patCommit(true), !evts.length || used >= PAT_SLOTS));

  if (used >= PAT_SLOTS) { const d = document.createElement("span"); d.style.cssText = "font-size:11px;color:#999"; d.textContent = "set full (16 bars used)"; r3.append(d); }
  el.append(r3);

  /* row 4: note shape (entry default + apply to selection) */
  const r4 = document.createElement("div"); r4.className = "row";
  r4.append(lab("Note shape"));
  [["Regular", "regular"], ["Staccato", "staccato"], ["Elongated", "elongated"]].forEach(([labTxt, key]) =>
    r4.append(mkB(labTxt, S.noteShape === key, () => { S.noteShape = key; renderAll(); })));
  r4.append(mkB("Apply to selection", false, () => {
    const ids = anySelIds();
    if (!ids.length) { flash("Select notes on the staff first (▣ Select or Stencil selection)."); return; }
    ids.forEach(id => { const f = findEv(id); if (f && f.ev.type === "note") {
      if (S.noteShape === "regular") delete f.ev.shape; else f.ev.shape = S.noteShape;
    } });
    flash(`Shape "${S.noteShape}" applied to ${ids.length} note${ids.length === 1 ? "" : "s"}.`);
    renderAll();
  }));
  el.append(r4);

  /* row 5: rename / recolor a committed pattern */
  if (P.editSlot != null) {
    const p = patById(P.editSlot);
    if (p) {
      const r5 = document.createElement("div"); r5.className = "row";
      r5.append(lab("Pattern"));
      const nin = document.createElement("input");
      nin.type = "text"; nin.value = p.name; nin.style.width = "90px";
      nin.addEventListener("change", () => { p.name = nin.value.trim() || p.name; patStore(); renderAll(); });
      const cin = document.createElement("input");
      cin.type = "color"; cin.value = p.color;
      cin.title = "Box color — changes every instance of this pattern in the composition";
      cin.addEventListener("change", () => { p.color = cin.value; patStore(); renderAll(); });
      r5.append(nin, cin);
      const note = document.createElement("span");
      note.style.cssText = "font-size:11px;color:#999";
      note.textContent = "color applies to all instances of this pattern";
      r5.append(note);
      el.append(r5);
    }
  }

  /* row 6: add to composition */
  if (S.patterns.length) {
    const r6 = document.createElement("div"); r6.className = "row";
    r6.append(lab("Add to composition"));
    const psel = document.createElement("select");
    psel.className = "pitchSel";
    S.patterns.forEach(p => {
      const o = document.createElement("option");
      o.value = p.pid; o.textContent = `${p.name} (${fmt(p.span)} s)`;
      psel.append(o);
    });
    const bin = document.createElement("input");
    bin.type = "text"; bin.inputMode = "numeric"; bin.value = "1"; bin.style.width = "44px";
    bin.title = "target bar number";
    const evn = document.createElement("input");
    evn.type = "text"; evn.inputMode = "numeric"; evn.value = ""; evn.placeholder = "n"; evn.style.width = "40px";
    evn.title = "optional: repeat every n bars";
    r6.append(psel, lab("bar"), bin, lab("every"), evn,
      mkB("Add", true, () => {
        const pid = +psel.value;
        const bi = Math.max(1, parseInt(bin.value, 10) || 1) - 1;
        const n = parseInt(evn.value, 10) || 0;
        if (bi >= S.patEdit.snapshot.bars.length) { flash(`The composition has ${S.patEdit.snapshot.bars.length} bar(s).`); return; }
        const added = patInsertIntoSnapshot(pid, bi, n);
        flash(`Added ${added} instance${added === 1 ? "" : "s"} — you'll see them when you exit the studio.`);
      }));
    el.append(r6);
  }
}

function renderTonal() {
  const el = $("tonalPanel");
  if (S.notation !== "tonal" || S.patEdit) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();
  const row = document.createElement("div");
  row.className = "row";
  const who = document.createElement("span");
  who.style.cssText = "font-family:Georgia,serif;font-size:15px";
  who.textContent = "Tonal";
  row.append(who);

  const lab = t => { const x = document.createElement("span");
    x.style.cssText = "font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666"; x.textContent = t; return x; };

  row.append(lab("Key"));
  const ksel = document.createElement("select");
  ksel.className = "pitchSel";
  KEY_LIST.forEach(([k, sig]) => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = `${k}${k.endsWith("m") ? " minor" : " major"} (${sig})`;
    if (k === S.tonal.key) o.selected = true;
    ksel.append(o);
  });
  ksel.addEventListener("change", () => { S.tonal.key = ksel.value; renderKeys(true); renderAll(); });
  row.append(ksel);

  row.append(lab("Time"));
  Object.keys(TS_BEATS).forEach(sig => {
    const b = document.createElement("button");
    b.className = "btn small" + (S.tonal.sig === sig ? " active" : "");
    b.textContent = sig;
    b.addEventListener("click", () => { S.tonal.sig = sig; renderAll(); });
    row.append(b);
  });

  row.append(lab("♩ ="));
  const tin = document.createElement("input");
  tin.type = "text"; tin.inputMode = "numeric"; tin.value = S.tonal.tempo; tin.style.width = "56px";
  tin.addEventListener("change", () => {
    let v = parseInt(String(tin.value).trim(), 10);
    if (isNaN(v)) v = 60;
    S.tonal.tempo = Math.max(20, Math.min(240, v));
    S.stTempo = S.tonal.tempo;
    renderAll();
  });
  row.append(tin);

  row.append(lab("Instrument"));
  const iin = document.createElement("input");
  iin.type = "text"; iin.value = S.tonal.instrument; iin.style.width = "120px";
  iin.addEventListener("input", () => { S.tonal.instrument = iin.value || "Sine"; });
  iin.addEventListener("change", () => renderAll());
  row.append(iin);

  const note = document.createElement("span");
  note.style.cssText = "font-size:11px;color:#999";
  note.textContent = "voice: sine or synth piano — instrument names the part; flat keys spell notes with ♭";
  row.append(note);
  el.append(row);
}

function renderStencil() {
  const el = $("stencilPanel");
  if (!S.stencilMode) { el.style.display = "none"; el.replaceChildren(); return; }
  el.style.display = "block";
  el.replaceChildren();
  const mkBtn = (txt, active, fn, dis, small) => {
    const b = document.createElement("button");
    b.className = (small === false ? "btn" : "btn small") + (active ? " active" : "");
    b.textContent = txt;
    b.disabled = !!dis;
    b.addEventListener("click", fn);
    return b;
  };
  const seg = lblTxt => {
    const row = document.createElement("div");
    row.className = "row";
    const lab = document.createElement("span");
    lab.className = "seglbl";
    lab.textContent = lblTxt;
    row.append(lab);
    return row;
  };

  /* row 1: entry mode + tempo (+ margin in quant) */
  const r1 = seg("Entry");
  r1.append(
    mkBtn("Stencil", S.stEntry === "stencil", () => { S.stEntry = "stencil"; renderAll(); }),
    mkBtn("Quantized β", S.stEntry === "quant", () => {
      S.stEntry = "quant";
      S.stTempo = Math.max(40, Math.min(140, S.stTempo));
      renderAll();
    }));
  const tl = document.createElement("span");
  tl.style.cssText = "font-size:12px;color:#444;margin-left:8px";
  tl.textContent = "♩ = ";
  const tin = document.createElement("input");
  tin.type = "text"; tin.inputMode = "numeric"; tin.value = S.stTempo; tin.style.width = "56px";
  tin.addEventListener("change", () => {
    let v = parseInt(String(tin.value).trim(), 10);
    if (isNaN(v)) v = 60;
    const lo = S.stEntry === "quant" ? 40 : 20, hi = S.stEntry === "quant" ? 140 : 240;
    S.stTempo = Math.max(lo, Math.min(hi, v));
    renderAll();
  });
  const bpm = document.createElement("span");
  bpm.style.cssText = "font-size:12px;color:#444";
  bpm.textContent = `BPM ${S.stEntry === "quant" ? "(40–140)" : ""}`;
  r1.append(tl, tin, bpm);
  if (S.stEntry === "quant") {
    const ml = document.createElement("span");
    ml.style.cssText = "font-size:12px;color:#444;margin-left:8px";
    ml.textContent = `margin ±${Math.round(S.stMarginPct * 100)}% (floor 20 ms)`;
    const mr = document.createElement("input");
    mr.type = "range"; mr.min = "0.20"; mr.max = "0.25"; mr.step = "0.01"; mr.value = S.stMarginPct;
    mr.style.width = "80px";
    mr.addEventListener("input", () => { S.stMarginPct = +mr.value; ml.textContent = `margin ±${Math.round(S.stMarginPct * 100)}% (floor 20 ms)`; });
    r1.append(ml, mr);
    const pl = document.createElement("span");
    pl.style.cssText = "font-size:12px;color:#444;margin-left:8px";
    pl.textContent = `pitch floor ${Math.round(S.stPitchFloor * 100)}%`;
    const pr = document.createElement("input");
    pr.type = "range"; pr.min = "0.4"; pr.max = "0.9"; pr.step = "0.05"; pr.value = S.stPitchFloor;
    pr.style.width = "80px";
    pr.title = "Mic takes: a sung note whose frames agree on its pitch less than this is dropped as unstable";
    pr.addEventListener("input", () => { S.stPitchFloor = +pr.value; pl.textContent = `pitch floor ${Math.round(S.stPitchFloor * 100)}%`; });
    r1.append(pl, pr);
  }
  el.append(r1);

  /* row 2: note value + dots */
  const r2 = seg("Note");
  ST_ORDER.forEach(k => r2.append(
    mkBtn(`${ST_GLYPH[k]} ${({ whole: "Whole", half: "Half", quarter: "Quarter", eighth: "8th", sixteenth: "16th", thirtysecond: "32nd" })[k]}`,
      S.stDur === k, () => { S.stDur = k; renderAll(); })));
  r2.append(
    mkBtn("· dot", S.stDots === 1, () => { S.stDots = S.stDots === 1 ? 0 : 1; renderAll(); }),
    mkBtn("·· double", S.stDots === 2, () => { S.stDots = S.stDots === 2 ? 0 : 2; renderAll(); }));
  const eq = document.createElement("span");
  eq.style.cssText = "font-size:12px;color:#444;font-variant-numeric:tabular-nums";
  eq.textContent = `= ${fmt(stencilDurSec())} s`;
  r2.append(eq);
  el.append(r2);

  /* row 3: MIDI controller range */
  const r3r = seg("MIDI range");
  const mkSel = (val, set) => {
    const sel = document.createElement("select");
    sel.className = "pitchSel";
    for (let m = MIDI_MIN; m <= MIDI_MAX; m++) {
      const o = document.createElement("option");
      o.value = m; o.textContent = midiName(m);
      if (m === val) o.selected = true;
      sel.append(o);
    }
    sel.addEventListener("change", () => { set(+sel.value); renderAll(); });
    return sel;
  };
  const dash = document.createElement("span"); dash.textContent = "–";
  r3r.append(
    mkSel(S.stMidiLo, v => { S.stMidiLo = Math.min(v, S.stMidiHi); }),
    dash,
    mkSel(S.stMidiHi, v => { S.stMidiHi = Math.max(v, S.stMidiLo); }));
  const rn = document.createElement("span");
  rn.style.cssText = "font-size:11px;color:#999";
  rn.textContent = "keys outside this span are ignored in stencil mode";
  r3r.append(rn);
  el.append(r3r);

  /* row 4: chord entry status */
  if (S.chordMode && S.stEntry === "stencil") {
    const r4 = seg("Chord+");
    const cur = S.stencilChordId != null ? findEv(S.stencilChordId) : null;
    const info = document.createElement("span");
    info.style.cssText = "font-size:12px;color:#444";
    info.textContent = cur
      ? `Building ${evLabel(cur.ev)} (${cur.ev.midis.length}/${S.stChordMax})`
      : `Next entry starts a chord`;
    const maxLab = document.createElement("span");
    maxLab.style.cssText = "font-size:11px;color:#666";
    maxLab.textContent = "max";
    const maxIn = document.createElement("input");
    maxIn.type = "text"; maxIn.inputMode = "numeric"; maxIn.value = S.stChordMax; maxIn.style.width = "42px";
    maxIn.addEventListener("change", () => {
      let v = parseInt(String(maxIn.value).trim(), 10);
      if (isNaN(v)) v = 7;
      S.stChordMax = Math.max(2, Math.min(10, v));
      renderAll();
    });
    r4.append(info, maxLab, maxIn,
      mkBtn("Next ▸", false, () => { S.stencilChordId = null; renderAll(); }, S.stencilChordId == null));
    const ah = document.createElement("span");
    ah.style.cssText = "font-size:11px;color:#999";
    ah.textContent = "auto-advances when the chord hits max";
    r4.append(ah);
    el.append(r4);
  }

  /* harmony entry row */
  if (S.stEntry === "stencil") {
    const rh2 = seg("Harmony");
    rh2.append(mkBtn(S.harmonyOn ? "Harmony on" : "Harmony", S.harmonyOn, () => {
      S.harmonyOn = !S.harmonyOn;
      if (!S.harmonyOn) { S.harmonyT = null; S.adoptArm = false; }
      renderAll();
    }));
    if (S.harmonyOn) {
      const pos = document.createElement("span");
      pos.style.cssText = "font-size:12px;color:#444;font-variant-numeric:tabular-nums";
      pos.textContent = S.harmonyT != null ? `entry at ${fmt(S.harmonyT)} s` : "click the staff to place the entry point";
      rh2.append(pos);
    }
    const hint = document.createElement("span");
    hint.style.cssText = "font-size:11px;color:#999";
    hint.textContent = S.harmonyOn
      ? "keys/MIDI enter from the ▼ bar (advancing as played); harmonies auto-select; changing bars resets to linear"
      : "layer notes above/below/on existing entries at a chosen time point";
    rh2.append(hint);
    el.append(rh2);
  }

  /* row 5: selection + the two executors */
  const ids = stencilIds();
  const r5 = seg(`Selected ${ids.length}`);
  r5.append(
    mkBtn("All", false, stencilSelectAll, !bar().some(e => e.type === "note")),
    mkBtn("Clear", false, () => { S.stencilSel.clear(); renderAll(); }, !ids.length),
    mkBtn(`Set ${ST_GLYPH[S.stDur]}${S.stDots ? "·".repeat(S.stDots) : ""}`, false, stencilApplySel, !ids.length, false),
    mkBtn("Quantize", false, quantizeSel, !ids.length, false),
    mkBtn(S.adoptArm ? "Adopt: click ref…" : "Adopt dur", S.adoptArm, () => {
      if (!S.adoptArm && !stencilIds().length) { flash("Select notes first — they'll adopt the reference note's duration."); return; }
      S.adoptArm = !S.adoptArm;
      if (S.adoptArm) flash("Now click the reference note on the staff.");
      renderAll();
    }, false, false));
  const selHint = document.createElement("span");
  selHint.style.cssText = "font-size:11px;color:#999";
  selHint.textContent = "Set = consecutive stencil notes · Quantize = snap durations to the beat";
  r5.append(selHint);
  el.append(r5);

  /* row 6: rhythm overlay */
  const r6 = seg("Rhythm");
  const rsel = document.createElement("select");
  rsel.className = "pitchSel";
  RHYTHMS.forEach(([name], i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = name;
    rsel.append(o);
  });
  r6.append(rsel, mkBtn("Apply", false, () => applyRhythm(+rsel.value)));
  const rh = document.createElement("span");
  rh.style.cssText = "font-size:11px;color:#999";
  rh.textContent = "applies to the selection, or the whole bar if nothing is selected";
  r6.append(rh);
  el.append(r6);

  /* row 7: insert space */
  const r7 = seg("Space");
  [["𝅝", 4], ["𝅗𝅥", 2], ["♩", 1], ["♪", 0.5], ["𝅘𝅥𝅯", 0.25]].forEach(([g, b]) =>
    r7.append(mkBtn(g + (S.stDots ? "·".repeat(S.stDots) : ""), false, () => insertSpace(b))));
  const sh = document.createElement("span");
  sh.style.cssText = "font-size:11px;color:#999";
  sh.textContent = "inserts empty time before the selection (dots apply), or a rest at the end if nothing is selected";
  r7.append(sh);
  el.append(r7);
}

function renderStatus() {
  const el = $("statusStrip");
  el.replaceChildren();
  if (S.holding) {
    const n = document.createElement("span"); n.className = "noteName";
    n.textContent = S.holding.kind === "rest" ? "Rest" : midiName(S.holding.midi);
    const t = document.createElement("span"); t.className = "timer";
    t.textContent = S.elapsed.toFixed(2) + " s";
    const cap = document.createElement("span");
    cap.style.cssText = "font-size:11px;color:#999";
    cap.textContent = "recording — release to commit";
    el.append(n, t, cap);
  } else {
    const span = document.createElement("span");
    span.className = "hint" + ((S.restMode || S.chordMode || S.alignPending || S.timeAdjust || S.deleteMode || S.dragMode) ? " armed" : "");
    span.textContent = S.alignPending
      ? "Alignment pending — click the reference note/rest on the staff (click empty staff to cancel)."
      : S.loopMode
        ? (S.loopPickStart
          ? `Loop — start marked at ${fmt(S.loopPickStart.t)} s; click the ending note/chord.`
          : "Loop — click a note/chord to set the loop start, then a later one for the stop.")
        : S.stencilMode
        ? (S.stEntry === "stencil"
          ? `Stencil — every key/click enters a ${ST_GLYPH[S.stDur]}${S.stDots ? "·".repeat(S.stDots) : ""} at ♩=${S.stTempo}` +
            (S.chordMode ? ` · Chord+ stacks entries (auto-advance at ${S.stChordMax})` : "") +
            (S.adoptArm ? " · Adopt armed: click the reference note" :
              S.harmonyOn ? " · Harmony: click the staff to place/move the ▼ entry point" : "; staff clicks select notes.")
          : `Quantized entry β — hold to record at ♩=${S.stTempo}; durations snap to the nearest beat value within the margin.`)
        : S.gapRestMode
        ? "Gap→Rest — every gap between notes is outlined; click one and it registers as a rest of exactly that duration."
        : S.selMode
          ? `Select — click notes to build a group (${S.groupSel.size} selected); drag a selected note to move them all, or mute / set durations below.`
          : S.quantMode
          ? `Quantize — click notes to select (${S.quantSel.size} selected), pick a set size, then Apply in the panel below.`
          : S.colorMode
          ? (S.colorSel ? "Color — click notes/chords to paint them with the selected swatch."
                        : "Color — ∅ selected: click notes/chords to clear their custom color.")
          : S.grabMode
        ? "Grab — drag a note/chord: sideways moves it in time (duration kept), up/down transposes it along the scale."
        : S.penMode
          ? "Insert — click anywhere on the staff to place a note at that pitch and time (set its duration in the controls above)."
          : S.mergeMode
            ? `Chord maker — click notes to select them (${S.mergeSel.size} selected), then Create chord in the panel below.`
            : S.dragMode
        ? "Duration drag — drag any note, chord, or rest sideways; yellow fill = its stop edge exactly matches a neighbor's start (forward) or stop (backward)."
        : S.deleteMode
          ? "Delete mode — click any note on the staff to delete it (a tone inside a chord deletes just that tone)."
          : S.timeAdjust
        ? (S.chordMode
          ? "Time adjust · whole-chord scope — click a chord on the staff, then take off / add on time below."
          : "Time adjust · single-tone scope — click a tone on the staff, then take off / add on time below.")
        : S.chordMode
        ? "Chord+ active — click the staff directly above/below an existing note to stack a tone (click a stacked tone to remove it)."
        : S.restMode
          ? "Rest armed — click/press and hold the rest pad below for the desired silence."
          : `Click/press and hold a melody key to record into bar ${S.barIdx + 1} (${melodyLane(bar()).length} melody event${melodyLane(bar()).length === 1 ? "" : "s"} so far) — release ends the note.`;
    el.append(span);
  }
  if (S.audioOn) {
    const l = document.createElement("span");
    l.className = "latchNote";
    const live = document.createElement("span");
    live.id = "vLive";
    live.textContent = "listening…";
    l.append(document.createTextNode("🎤 "), live);
    const stop = document.createElement("button");
    stop.className = "btn small active";
    stop.textContent = "■ Stop";
    stop.style.marginLeft = "6px";
    stop.title = S.stencilMode && S.stEntry === "quant"
      ? "Stop recording — the take is then quantized against the beat grid and pitch floor"
      : "Stop the microphone";
    stop.addEventListener("click", audioToggle);
    l.append(stop);
    el.append(l);
  }
  if (S.midiOn && midiHeld.size) {
    const l = document.createElement("span");
    l.className = "latchNote";
    l.textContent = `🎹 ${[...midiHeld.keys()].sort((a, b) => a - b).map(midiName).join(" ")} recording…`;
    el.append(l);
  }
}

function renderChips() {
  const el = $("chips");
  el.replaceChildren();
  const b = [...bar()].sort((x, y) => x.start - y.start || x.id - y.id);
  if (!b.length && !S.holding) {
    const s = document.createElement("span");
    s.className = "chipEmpty";
    s.textContent = "This bar is empty.";
    el.append(s);
    return;
  }
  b.forEach((ev, i) => {
    const btn = document.createElement("button");
    btn.className = "btn chip" + (S.selectedId === ev.id ? " sel" : "");
    btn.disabled = S.playing;
    btn.title = "Click to select · right-click for precise timing";
    const inLoop = S.loop && S.loop.barIdx === S.barIdx &&
      ev.start >= S.loop.startT - 1e-9 && ev.start < S.loop.endT;
    btn.textContent = `${i + 1}. ${inLoop ? "⟲ " : ""}${ev.muted ? "🔇 " : ""}${ev.type === "rest" ? "𝄽 " : ""}${evLabel(ev)} · ${fmt(ev.start)}–${fmt(evEnd(ev))} s`;
    btn.addEventListener("click", () => {
      S.selectedId = (S.selectedId === ev.id) ? null : ev.id;
      S.selectedMidi = null;
      renderAll();
    });
    btn.addEventListener("contextmenu", e => { e.preventDefault(); openPreciseDialog(ev); });
    el.append(btn);
  });
}

function renderBarNav() {
  $("barLabel").textContent = `${S.barIdx + 1} of ${S.bars.length}`;
  $("prevBarBtn").disabled = S.barIdx === 0;
  $("nextBarBtn").disabled = S.barIdx >= S.bars.length - 1;
  $("delBarBtn").disabled = S.playing;
  $("endBarBtn").disabled = S.playing;
  $("addBeforeBtn").disabled = S.playing;
  $("addAfterBtn").disabled = S.playing;
  $("dupBarBtn").disabled = S.playing;
}

function renderControls() {
  $("playAllBtn").textContent = "▶ All";

function buildKeyRows(container, lo, hi, cls, onDown, holdStyle) {
  container.replaceChildren();
  let row = null, curOct = null;
  for (let m = lo; m <= hi; m++) {
    const oct = Math.floor(m / 12) - 1;
    if (oct !== curOct) {
      curOct = oct;
      row = document.createElement("div");
      row.className = "keyRow";
      const lab = document.createElement("span");
      lab.className = "oct";
      lab.textContent = "O" + oct;
      row.append(lab);
      container.append(row);
    }
    const k = document.createElement("button");
    k.className = cls + (isSharp(m) ? " sharp" : "");
    k.textContent = dName(m);
    k.dataset.midi = m;
    onDown(k, m);
    row.append(k);
  }
}

function renderKeys(rebuild) {
  if (rebuild) {
    buildKeyRows($("keys"), MIDI_MIN, MIDI_MAX, "key", (k, m) => {
      k.addEventListener("pointerdown", e => {
        try { k.setPointerCapture(e.pointerId); } catch (err) {}
        startHold("note", m);

      k.addEventListener("pointerup", () => endHold());
      k.addEventListener("pointercancel", () => endHold());

    });

    const m = +k.dataset.midi;
    k.classList.toggle("held",
      !!(S.holding && S.holding.kind === "note" && S.holding.midi === m));
  });
}

/* ── rubber-band (box) selection: in ▣ Select, drag on empty staff to select
      every note the box touches. Whole events select if any of their tones are
      inside; under-10px presses remain ordinary taps. ── */
function marqueeSelect(x0, y0, x1, y1) {
  const L = Math.min(x0, x1), R = Math.max(x0, x1);
  const Tp = Math.min(y0, y1), Bt = Math.max(y0, y1);
  const xs = t => PAD_L + t * lastPxPerSec;
  let added = 0;
  bar().forEach(ev => {
    if (ev.type === "pattern") return;
    const ex0 = xs(ev.start), ex1 = xs(ev.start + ev.dur);
    let hit;
    if (ev.type === "rest") {
      /* rests span the staff's full height, so the box only needs to cross
         their time span — this makes gap rests box-selectable like anything else */
      hit = ex1 >= L && ex0 <= R;
    } else {
      const ms = ev.type === "note" ? ev.midis : [ev.midi];
      hit = ms.some(m => {
        /* out-of-window tones render clamped at the staff edge — the box must
           test the position the user actually sees */
        const y = Math.max(PAD_T + 4, Math.min(STAFF_H - PAD_B - 4, yOfMidi(m)));
        return ex1 >= L && ex0 <= R && y + 5 >= Tp && y - 5 <= Bt;

    }
    if (hit && !S.groupSel.has(ev.id)) { S.groupSel.add(ev.id); added++; }
  });
  return added;
}

$("mNewC").addEventListener("click", () => {
  const body = document.createElement("div");
  const p = document.createElement("div");
  p.style.cssText = "font-size:13px";
  p.textContent = "Start a new composition? Unsaved changes to the current one are lost.";
  const line = document.createElement("div");
  line.className = "mline";
  const ok = document.createElement("button");
  ok.className = "btn active"; ok.textContent = "New composition";
  ok.addEventListener("click", () => { closeModal(); startNewComposition(S.notation); flash("New composition."); });
  const ca = document.createElement("button");
  ca.className = "btn"; ca.textContent = "Cancel";

$("mDiag").addEventListener("click", () => {
  const body = document.createElement("div");
  body.className = "mrow";
  const pre = document.createElement("div");
  pre.style.cssText = "font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;line-height:1.5";
  const armed = MODES.filter(k => S[k]).join(", ") || "none";
  pre.textContent =
    `build: ${BUILD}\n` +
    `armed tool: ${armed}\n` +
    `drag states: drag=${!!drag} grab=${!!grab} gdrag=${!!gdrag} pgrab=${!!pgrab}\n` +
    `selection: group=${S.groupSel.size} stencil=${S.stencilSel.size} single=${S.selectedId != null}\n` +
    `bars: ${S.bars.length} (bar ${S.barIdx + 1}, ${bar().length} events)\n` +
    `patterns: ${S.patterns.length} committed · studio ${S.patEdit ? "OPEN" : "closed"}\n` +
    `playing: ${S.playing} paused: ${S.paused}\n` +
    `audio latency: ${audioCtx ? `base ${Math.round((audioCtx.baseLatency || 0) * 1000)} ms · output ${Math.round((audioCtx.outputLatency || 0) * 1000)} ms` : "context not started yet"}\n` +
    `recent errors: ${errLog.length ? "\n  " + errLog.join("\n  ") : "none"}\n` +
    `tap trace: ${tapTrace.length ? "\n  " + tapTrace.join("\n  ") : "none yet"}`;
  const line = document.createElement("div");
  line.className = "mline";
  const rst = document.createElement("button");
  rst.className = "btn";
  rst.textContent = "Reset tool state";
  rst.addEventListener("click", () => {
    drag = null; grab = null; gdrag = null; pgrab = null; staffPan = null;
    selClickSuppressUntil = 0;
    MODES.forEach(k => S[k] = false);
    closeModal();
    flash("Tool state reset.");
    renderAll();
  });
  const ok = document.createElement("button");
  ok.className = "btn active";
  ok.textContent = "Close";
  ok.addEventListener("click", closeModal);
  line.append(rst, ok);
  body.append(pre, line);
  showModal("Diagnostics", body);
});
$("mAbout").addEventListener("click", () => {
  const body = document.createElement("div");
  body.className = "mrow";
  const t = document.createElement("div");
  t.style.cssText = "font-size:13px;line-height:1.5";
  t.textContent = "Sine Tone Composer — free-time and tonal composition on a chromatic C2–F7 staff. " +
    "Durations are literal press lengths (ms precision); fully offline, single file. " +
    "Voices: pure sine, synthesized piano, or sampled piano (Salamander Grand Piano " +
    "samples by Alexander Holm, CC BY 3.0). © 2026 · build " + BUILD + ".";
  body.append(t);
  const line = document.createElement("div");
  line.className = "mline";
  const okb = document.createElement("button");
  okb.className = "btn active";
  okb.textContent = "Close";
  okb.addEventListener("click", closeModal);
  line.append(okb);
  body.append(line);
  showModal("About", body);
});
/* click-away: close menus; clicking the margin deselects the current tone */
document.addEventListener("click", e => {
  if (openMenuEl && !e.target.closest("#menubar")) closeMenus();
  if (S.selectedId == null) return;
  if (e.target.closest("#staff, #menubar, button, input, select, summary, textarea, " +
      "#inspector, #chips, .barBox, .key, #restPad, #modalOverlay, .dropdown, .savedChip, label")) return;
  S.selectedId = null;
  S.selectedMidi = null;
  renderAll();
}, true);

/* re-fit the staff when the window (or pane) resizes */
let resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (!drag && !grab && !gdrag) renderStaff(); }, 120);
});

/* PWA: register the service worker when served over http(s); harmless on file:// */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

const BUILD = 63;

viewRangeInit();
hzoomInit();
noteStyleInit();
qtInit();
ibInit();
dbInit();
buildInstructions();
applySpacing();
$("copyLine").textContent = `Sine Tone Composer © 2026 · build ${BUILD}`;
patLoad();
applySpacing();
if (typeof indexedDB !== "undefined") loadSamplesFromDB();
renderKeys(true);
renderSaved();
renderAll();
