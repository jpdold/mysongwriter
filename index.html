<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Song Writer</title>
<meta name="theme-color" content="#f6f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c8553d'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --paper: #f6f2ea;          /* page ground: warm paper */
  --card: #fffdf9;           /* raised surfaces */
  --card2: #f0ebe1;          /* sunken surfaces, chips */
  --line: #e2dbcd;           /* hairlines */
  --line2: #cfc6b4;          /* stronger hairlines */
  --ink: #221f1a;            /* primary text */
  --ink2: #6d665b;           /* secondary text */
  --ink3: #a39b8d;           /* tertiary text */
  --accent: #c8553d;         /* terracotta: primary action, melody */
  --accent-ink: #ffffff;
  --accent-soft: #f5d9d1;
  --melody: #c8553d;
  --sub: #d99a2b;
  --backup: #9b7bc6;
  --bass: #3a4f8f;
  --accomp: #2f7f78;
  --ensemble: #5a8f3d;
  --green: #4caf7d;
  --yellow: #e6b422;
  --white: #ffffff;
  --sheet: #fffdf9;          /* stave background */
  --row-scale: rgba(200,85,61,0.06);
  --row-tonic: rgba(200,85,61,0.13);
  --row-line: #e9e3d7;
  --row-line-oct: #bdb39f;
  --beat-line: #ece6da;
  --bar-line: #b9ae99;
  --shadow: 0 10px 30px rgba(60,40,20,0.10);
  --shadow-sm: 0 2px 8px rgba(60,40,20,0.08);
  --radius: 14px;
  --dock-h: 60px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #17161a; --card: #201f24; --card2: #2a292f; --line: #33313a; --line2: #45424c;
    --ink: #ece8e0; --ink2: #a8a297; --ink3: #6f6a62;
    --accent: #e0745c; --accent-ink: #1a120f; --accent-soft: #4a2a22;
    --melody: #e0745c; --sub: #e5b04a; --backup: #b79ae0; --bass: #7f95dd; --accomp: #5fb8ae; --ensemble: #8cc46a;
    --sheet: #1d1c21; --row-scale: rgba(224,116,92,0.08); --row-tonic: rgba(224,116,92,0.16);
    --row-line: #2c2b31; --row-line-oct: #55525c; --beat-line: #2a292f; --bar-line: #5c5965;
    --shadow: 0 10px 30px rgba(0,0,0,0.45); --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #17161a; --card: #201f24; --card2: #2a292f; --line: #33313a; --line2: #45424c;
  --ink: #ece8e0; --ink2: #a8a297; --ink3: #6f6a62;
  --accent: #e0745c; --accent-ink: #1a120f; --accent-soft: #4a2a22;
  --melody: #e0745c; --sub: #e5b04a; --backup: #b79ae0; --bass: #7f95dd; --accomp: #5fb8ae; --ensemble: #8cc46a;
  --sheet: #1d1c21; --row-scale: rgba(224,116,92,0.08); --row-tonic: rgba(224,116,92,0.16);
  --row-line: #2c2b31; --row-line-oct: #55525c; --beat-line: #2a292f; --bar-line: #5c5965;
  --shadow: 0 10px 30px rgba(0,0,0,0.45); --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
}

/* ═══════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.35; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; }
.hidden { display: none !important; }
.muted { color: var(--ink2); }
.tiny { font-size: 11.5px; color: var(--ink2); }
.mono { font-variant-numeric: tabular-nums; }
::selection { background: var(--accent-soft); }

/* ═══════════════════════════════════════════════════════════════════════
   3. APP SHELL
   ═══════════════════════════════════════════════════════════════════════ */
#app { min-height: 100%; display: flex; flex-direction: column; padding-bottom: calc(var(--dock-h) + var(--panel-h, 200px) + 24px + env(safe-area-inset-bottom)); }

/* ── header ── */
#top { position: sticky; top: 0; z-index: 30; background: var(--paper);
  padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
#titleRow { display: flex; align-items: center; gap: 10px; }
#songTitle { flex: 1; min-width: 0; font-family: var(--serif); font-size: 24px; line-height: 1.15;
  border: none; background: none; padding: 2px 4px; margin: -2px -4px; border-radius: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#songTitle:focus { outline: 2px solid var(--accent-soft); background: var(--card); }
#songTitle::placeholder { color: var(--ink3); font-style: italic; }
#keyPill { font-size: 12.5px; color: var(--ink2); background: var(--card2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
#keyPill:hover { border-color: var(--line2); }
#menuBtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
  font-size: 18px; display: grid; place-items: center; box-shadow: var(--shadow-sm); }

/* ── section strip (indicator) ── */
#sectionStrip { display: flex; align-items: center; gap: 6px; margin-top: 8px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
#sectionStrip::-webkit-scrollbar { display: none; }
.secTab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink2);
  border-radius: 999px; padding: 6px 13px; font-size: 13px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.secTab .n { font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.secTab.cur { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.secTab.cur .n { color: var(--paper); opacity: .7; }
.secTab.omit { text-decoration: line-through; opacity: .55; }
.secTab.playing { box-shadow: 0 0 0 2px var(--accent); }
.secAdd { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 1px dashed var(--line2);
  background: none; color: var(--ink2); font-size: 18px; line-height: 1; }
#secOps { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 16px; }

/* ── progression lights ── */
#lights { display: flex; align-items: flex-end; gap: 3px; margin: 8px 0 2px; overflow-x: auto; scrollbar-width: none; min-height: 18px; }
#lights::-webkit-scrollbar { display: none; }
.lightGrp { display: flex; gap: 2px; padding: 0 3px; border-left: 1px solid var(--line2); }
.lightGrp:first-child { border-left: none; padding-left: 0; }
.lightGrp.cur .light { height: 16px; }
.light { width: 5px; height: 12px; border-radius: 3px; background: var(--white); border: 1px solid var(--line2); transition: height .15s, background .2s; flex: 0 0 auto; }
.light.g { background: var(--green); border-color: var(--green); }
.light.y { background: var(--yellow); border-color: var(--yellow); }
.light.play { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── workspace ── */
#secHead { display: flex; align-items: baseline; gap: 10px; padding: 0 14px 6px; }
#secHead h2 { font-size: 20px; }
#secHead .meta { font-size: 12px; color: var(--ink2); }
#secHead .spacer { flex: 1; }
#secHead button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 12px; padding: 4px 10px; color: var(--ink2); }

.staffFrame { position: relative; margin: 0 8px; background: var(--sheet); border: 1px solid var(--line2);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: inset 0 3px 8px rgba(60,40,20,0.10), inset 0 -1px 0 rgba(255,255,255,0.5), 0 1px 0 rgba(255,255,255,0.6); }
#work { padding: 10px 0 0; background: linear-gradient(var(--card2), var(--paper) 60px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .staffFrame { box-shadow: inset 0 3px 10px rgba(0,0,0,0.45); } }
:root[data-theme="dark"] .staffFrame { box-shadow: inset 0 3px 10px rgba(0,0,0,0.45); }
.staffScroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  display: flex; align-items: flex-start; touch-action: pan-x pan-y; }
#gutter { position: sticky; left: 0; z-index: 5; flex: 0 0 auto; background: var(--sheet);
  box-shadow: 3px 0 6px rgba(0,0,0,0.06); }
#stave { flex: 0 0 auto; display: block; user-select: none; -webkit-user-select: none; }
#stave text { user-select: none; pointer-events: none; }
#stave .hit { cursor: pointer; }
#stave .chip { cursor: grab; touch-action: none; }
#stave .noteEl { cursor: pointer; touch-action: none; }
#gutter { touch-action: none; cursor: ns-resize; }
#gutter .gbtn { cursor: pointer; pointer-events: all; }
#notePop { position: absolute; z-index: 8; display: none; gap: 3px; align-items: center; background: var(--card); border: 1px solid var(--line2);
  border-radius: 12px; padding: 4px; box-shadow: var(--shadow); left: 50%; top: 4px; transform: translateX(-50%); max-width: calc(100% - 12px); flex-wrap: wrap; justify-content: center; }
#notePop.moved { transform: none; }
#notePop .grip { cursor: grab; touch-action: none; color: var(--ink3); font-size: 14px; padding: 0 4px; user-select: none; letter-spacing: -2px; }
#notePop.on { display: flex; }
#notePop button { width: 30px; height: 30px; border: none; background: var(--card2); border-radius: 8px; font-size: 14px; padding: 0; color: var(--ink); display: grid; place-items: center; }
#notePop button.on { background: var(--ink); color: var(--paper); }
#notePop button.del { color: #b3261e; }
#notePop .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
#notePop .who { font-size: 11px; color: var(--ink2); padding: 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#wordEdit { position: absolute; z-index: 9; display: none; align-items: center; gap: 4px; background: var(--card); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 4px 4px 4px 8px; box-shadow: var(--shadow); }
#wordEdit.on { display: flex; }
#wordEdit .lbl2 { font-size: 10px; color: var(--ink2); white-space: nowrap; letter-spacing: .04em; }
#wordEdit input { width: 150px; border: none; background: none; font-family: var(--serif); font-size: 16px; font-weight: 700; padding: 4px 2px; outline: none; }
#wordEdit button { width: 30px; height: 30px; border: none; border-radius: 8px; background: var(--card2); font-size: 14px; padding: 0; color: var(--ink); }
#wordEdit button.ok { background: var(--accent); color: var(--accent-ink); }

/* full-screen accompaniment entry */
body.fsAccomp #work { position: fixed; inset: 0; z-index: 60; background: var(--paper); padding: 0; overflow: auto; }
body.fsAccomp #top, body.fsAccomp #panel { display: none; }
body.fsAccomp .staffFrame { margin: 0; border-radius: 0; border: none; height: 100%; }
body.fsAccomp .staffScroll { height: 100%; overflow-y: auto; }
#fsClose { position: fixed; top: 12px; right: 12px; z-index: 70; display: none; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); font-size: 20px; box-shadow: var(--shadow); }
body.fsAccomp #fsClose { display: grid; place-items: center; }

/* ── bottom panel (mode sheet) ── */
#panel { position: fixed; left: 0; right: 0; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom)); z-index: 25;
  background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(60,40,20,0.08);
  max-height: 44vh; overflow-y: auto; padding: 4px 12px 10px; overscroll-behavior: contain; }
#panelGrip { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line2); margin: 2px auto 6px; cursor: pointer; }
@media (min-width: 1000px) { #panelGrip { display: none; } }
#panel:empty, #panel.collapsed { display: none; }
.dockBtn.cur.collapsed { opacity: .7; }
.pRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.pRow.tight { gap: 5px; }
.pLbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); font-weight: 600; margin: 8px 0 2px; }
.pHead { display: flex; align-items: center; gap: 8px; }
.pHead h3 { font-size: 16px; flex: 1; }
.pHead { margin-bottom: 2px; }

/* ── dock ── */
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--dock-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line);
  display: flex; align-items: stretch; }
.dockBtn { flex: 1; border: none; background: none; color: var(--ink2); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 10.5px; letter-spacing: .02em; }
.dockBtn .ic { font-size: 20px; line-height: 1; }
.dockBtn.cur { color: var(--accent); font-weight: 600; }
.dockBtn.cur .ic { transform: translateY(-1px); }
#playBtn { flex: 0 0 68px; margin: 8px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  border: none; font-size: 20px; box-shadow: 0 6px 16px rgba(200,85,61,0.35); }
#playBtn.on { background: var(--ink); color: var(--paper); box-shadow: none; }

/* ═══════════════════════════════════════════════════════════════════════
   4. CONTROLS
   ═══════════════════════════════════════════════════════════════════════ */
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
  padding: 7px 12px; font-size: 13.5px; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:active { transform: translateY(1px); }
.btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.acc { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
.btn.round { border-radius: 999px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: #b3261e; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card2); }
.seg button { border: none; background: none; padding: 6px 11px; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg.sm button { padding: 4px 8px; font-size: 12px; }
select.sel, input.txt { border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; background: var(--card); font-size: 13px; max-width: 100%; }
input.txt { min-width: 0; }
input[type=range] { accent-color: var(--accent); }
textarea.lyricArea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  background: var(--card); font-family: var(--serif); font-size: 16px; line-height: 1.5; resize: vertical; }
.chipRow { display: flex; flex-wrap: wrap; gap: 6px; }
.chipBtn { border: 1px solid var(--line); background: var(--card2); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.chipBtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chipBtn.adv { border-style: dashed; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
.toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: var(--line2); position: relative; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { left: 16px; }

/* bar lyric fields */
.barLyrics { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.barField { display: flex; flex-direction: column; gap: 3px; }
.barField label { font-size: 10.5px; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; }
.barField label b { color: var(--ink2); font-weight: 600; }
.barField input { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--card); font-family: var(--serif); font-size: 15px; }
.barField input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.barField.cur input { border-color: var(--accent); }

/* note-length picker */
.lenPick { display: inline-flex; gap: 4px; }
.lenPick button { width: 40px; height: 38px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-size: 18px; font-family: var(--serif); }
.lenPick button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* parts (band) cards */
.partCard { border: 1px solid var(--line); border-radius: 12px; padding: 5px 9px; margin: 4px 0; background: var(--card); display: flex; flex-direction: column; gap: 3px; }
.partCard .ph { display: flex; align-items: center; gap: 8px; }
.partCard .dot { width: 10px; height: 10px; border-radius: 50%; }
.partCard .ph b { flex: 1; font-weight: 600; }
.partCard.off { opacity: .55; }

/* ═══════════════════════════════════════════════════════════════════════
   5. MODALS, TOASTS, MENUS
   ═══════════════════════════════════════════════════════════════════════ */
#overlay { position: fixed; inset: 0; background: rgba(20,15,10,.42); display: none; z-index: 80; align-items: flex-end; justify-content: center; padding: 0; }
#overlay.on { display: flex; }
#modal { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
@media (min-width: 640px) { #overlay { align-items: center; padding: 20px; } #modal { border-radius: 20px; } }
#modal h3 { font-size: 20px; margin-bottom: 8px; }
#modal .mrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
#modal .mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.genreGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.genreGrid button { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 13px; }
.genreGrid button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.genreGrid button small { display: block; color: inherit; opacity: .65; font-size: 10.5px; }
.chordGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
.chordGrid button { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 4px; font-size: 14px; font-family: var(--serif); }
.chordGrid button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chordGrid button small { display: block; font-family: var(--sans); font-size: 10px; opacity: .6; }
.listRow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.listRow b { flex: 1; font-weight: 500; }
.menuList { display: flex; flex-direction: column; }
.menuList button { border: none; background: none; text-align: left; padding: 11px 6px; border-bottom: 1px solid var(--line); font-size: 15px; display: flex; gap: 12px; align-items: center; }
.menuList button:last-child { border-bottom: none; }
.menuList button .ic { width: 24px; text-align: center; opacity: .8; }
#toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .2s; z-index: 90; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* ═══════════════════════════════════════════════════════════════════════
   6. PART VIEW & PERFORMANCE MODE
   ═══════════════════════════════════════════════════════════════════════ */
#partView, #perfView { position: fixed; inset: 0; z-index: 100; background: var(--paper); overflow: auto; display: none; }
#partView.on, #perfView.on { display: block; }
.pvTop { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 2; flex-wrap: wrap; }
.pvTop h2 { flex: 1 1 100%; font-size: 22px; }
@media (min-width: 700px) { .pvTop h2 { flex: 1 1 auto; } }
.pvBody { padding: 14px 16px 60px; max-width: 1100px; margin: 0 auto; }
.pvSec { margin: 14px 0 22px; }
.pvSec h3 { font-size: 18px; margin-bottom: 6px; }
.pvBars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pvBar { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--card); min-height: 64px; }
.pvBar .bn { font-size: 10px; color: var(--ink3); }
.pvBar .ch { font-family: var(--serif); font-size: 22px; }
.pvBar .ly { font-family: var(--serif); font-size: 15px; margin-top: 2px; }
.pvBar .nt { font-size: 12px; color: var(--ink2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pvBar .pat { font-size: 11px; color: var(--ink2); }
#perfView { background: #111; color: #eee; }
#perfView .pvTop { background: #111; border-color: #333; color: #eee; }
.perfLine { font-family: var(--serif); font-size: clamp(26px, 6vw, 54px); line-height: 1.3; padding: 6px 20px; color: #777; transition: color .2s, transform .2s; }
.perfLine.cur { color: #fff; transform: scale(1.02); }
.perfLine.done { color: #444; }
.perfLine .sec { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #a06a5a; margin-top: 18px; }
.perfWrap { padding: 40px 0 50vh; max-width: 900px; margin: 0 auto; }

/* ═══════════════════════════════════════════════════════════════════════
   7. RESPONSIVE / DESKTOP
   ═══════════════════════════════════════════════════════════════════════ */
@media (min-width: 900px) {
  #app { max-width: 1180px; margin: 0 auto; }
  #dock { left: 50%; transform: translateX(-50%); width: min(1180px, 100%); }
  .staffFrame { margin: 0 14px; }
}
/* wide screens: the mode panel becomes a side column instead of a sheet */
@media (min-width: 1000px) {
  #app { padding-right: 372px; padding-bottom: calc(var(--dock-h) + 40px); }
  #panel { left: auto; right: max(0px, calc((100vw - 1180px) / 2)); top: 0; bottom: var(--dock-h); width: 360px; max-height: none;
    border-left: 1px solid var(--line); border-top: none; box-shadow: none; border-radius: 0; padding-top: 16px; }
  #top { padding-right: 386px; }
}
@media print {
  #top, #dock, #panel, #work, #overlay, #toast { display: none !important; }
  #partView { position: static; display: block !important; }
  .pvTop button { display: none; }
}

<div id="app">

  <!-- ── header: title, key pill, menu; section indicator; progression lights ── -->
  <header id="top">
    <div id="titleRow">
      <input id="songTitle" type="text" placeholder="Untitled song" autocomplete="off" spellcheck="false" aria-label="Song title">
      <button id="keyPill" title="Key, time signature, tempo, genre">C · 4/4 · 100</button>
      <button id="menuBtn" title="Menu" aria-label="Menu">☰</button>

    <div id="sectionStrip" aria-label="Sections"></div>
    <div id="lights" aria-label="Bar progress"></div>

    <div id="secHead">
      <h2 id="secName">Verse 1</h2>
      <span class="meta" id="secMeta"></span>
      <span class="spacer"></span>
      <button id="zoomOut" title="Smaller">−</button>
      <button id="zoomIn" title="Larger">+</button>
      <button id="fsBtn" title="Full-screen accompaniment entry">⛶</button>

    <div class="staffFrame" id="staffFrame">

        <svg id="stave"></svg>

      <div id="wordEdit"><span class="lbl2"></span><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="word(s)"><button class="ok" title="Place (Enter)">✓</button><button title="Close (Esc)">✕</button></div>
    </div>
  </main>
  <button id="fsClose" title="Close full screen">✕</button>

</div>

<!-- ── mode panel + dock ── -->
<div id="panel"></div>
<nav id="dock">

</nav>

<div id="toast"></div>
<div id="partView"></div>

function b64url(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function fromB64url(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const bin = atob(s), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function shareURL(part) {
  const song = JSON.parse(JSON.stringify(S.song)); if (part) song.sharePart = part;
  const json = new TextEncoder().encode(JSON.stringify(song));
  let tag = "s", bytes = json;
  if (window.CompressionStream) { try { const cs = new CompressionStream("deflate-raw"); const w = cs.writable.getWriter(); w.write(json); w.close(); bytes = new Uint8Array(await new Response(cs.readable).arrayBuffer()); tag = "z"; } catch (e) {} }
  return location.origin + location.pathname + "#" + tag + "=" + b64url(bytes);
}
async function importFromHash() {
  const m = /^#(z|s)=(.+)$/.exec(location.hash); if (!m) return false;
  try {
    const bytes = fromB64url(m[2]); let json;
    if (m[1] === "z") { const ds = new DecompressionStream("deflate-raw"); const w = ds.writable.getWriter(); w.write(bytes); w.close(); json = await new Response(ds.readable).text(); }
    else json = new TextDecoder().decode(bytes);
    const song = upgradeSong(JSON.parse(json)); song.id = uid(); song.updated = Date.now();
    const part = song.sharePart; delete song.sharePart;
    S.song = song; S.si = 0; S.sel = null; S.cursor = null; saveNow(); loadSongBanks();
    history.replaceState(null, "", location.pathname);
    toast("Song opened from the link");
    if (part) setTimeout(() => openPartView(part), 300);
    return true;
  } catch (e) { toast("Couldn't read that link"); return false; }
}
function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (e) { prompt("Copy this:", t); } }

      navigator.share ? el("button", { class: "btn", onclick: () => navigator.share({ title: song.title || "My song", url: linkBox.value }).catch(() => {}) }, "Share…") : null,
      el("span", { class: "tiny" }, "Anyone who opens it gets an editable copy. Open the link on a tablet and pick a part for the music stand.")),

function partNotesText(part, bi) {
  const song = S.song, key = keyObj(song.key), bar = song.bars[bi];
  const fmt = evs => evs.sort((a, b) => a.t - b.t).map(e => e.rest ? `𝄽${durGlyph(e.d)}` : `${noteName(e.m, key)}${durGlyph(e.d)}${tiedOver(e) ? "⌒" : ""}`).join("  ");
  if (part === "melody") return fmt([...bar.ev.melody]);
  if (part === "sub") return fmt(subVocalEvents(bi));
  if (part === "backup") { const v = backupVoicing(bi); return v.length ? "pad: " + v.map(m => noteName(m, key)).join(" ") : ""; }
  if (bar.custom[part]) return fmt([...(bar.ev[part] || [])]);
  const evs = partEvents(part, bi);
  if (!evs.length) return "";
  const pcs = [...new Set(evs.flatMap(e => e.ms))].sort((a, b) => a - b).map(m => noteName(m, key));
  return `${song.parts[part].pattern} · ${pcs.join(" ")}`;
}
