<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Song Writer</title>
<meta name="theme-color" content="#5a5c5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235a5c5f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. TOKENS — the mock: graphite ground, white paper windows, green tags,
      blue lyric strip, orange rhythm boxes. Dark and custom themes retint.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --ground: #5b5d60;          /* phone body */
  --ground2: #4c4e51;         /* strips, headers */
  --paper: #fbf7ee;           /* windows: light eggshell */
  --paper2: #f3eee2;
  --line: #1a1a1a;            /* staff lines */
  --line-soft: #bdbdbd;       /* half-step guide lines */
  --beat: #111;               /* dotted beat dividers */
  --ink: #111;                /* notes, text on paper */
  --ink2: #666;
  --on-ground: #f4f4f4;       /* text on graphite */
  --on-ground2: #c9c9c9;
  --tag: #8fd14f;             /* green labels */
  --tag-ink: #123;
  --lyric: #4da3e0;           /* lyric strip */
  --lyric-ink: #ffffff;
  --box: #e8790f;             /* rhythm boxes: deep orange */
  --box-soft: #f5a623;        /* highlights that use the orange */
  --accent: #2f7fd6;          /* Setup… */
  --danger: #e5322d;          /* Save… */
  --melody: #111; --sub: #d99a2b; --backup: #9b7bc6; --bass: #2e4a9e; --accomp: #1f7a70; --ensemble: #4d8f3a;
  --green: #4caf7d; --yellow: #e6b422;
  --bezel: 18px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --music: "Bravura", "Noto Music", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1c1d20; --ground2: #141517; --paper: #26272b; --paper2: #2e2f34;
  --line: #d8d8d8; --line-soft: #4a4b50; --beat: #e6e6e6; --ink: #f2f2f2; --ink2: #9a9a9a;
  --on-ground: #eee; --on-ground2: #999; --tag: #7cc242; --lyric: #2f6fa8; --box: #f0841c; --box-soft: #e39a2a; --accent: #4f95e6;
  --melody: #f2f2f2; --bass: #8ea6f0; --accomp: #5fc0b3;
}

/* ═══════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--on-ground); font-family: var(--sans); font-size: 14px; line-height: 1.3;
  overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { -webkit-user-select: text; user-select: text; }
.hidden { display: none !important; }
svg text { pointer-events: none; }

/* ═══════════════════════════════════════════════════════════════════════
   3. LAYOUT — one column on a phone; melody stack left / band right when wide
   ═══════════════════════════════════════════════════════════════════════ */
#app { max-width: 560px; margin: 0 auto; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 7px;
  grid-template-columns: 1fr; grid-template-areas: "head" "nav" "mel" "rhy" "lyr" "pal" "acc" "bass" "foot"; }
#rollBar { grid-area: rollbar; display: none; gap: 6px; }
/* rolled-up view: three labelled bars across the top; open staves drop down beneath; strips and tools follow */
#app.rolled { max-width: 560px !important; grid-template-columns: 1fr !important; grid-template-areas: "head" "nav" "rollbar" "mel" "acc" "bass" "rhy" "lyr" "pal" "foot" !important; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4), (max-height: 520px) and (min-aspect-ratio: 5/4) { #app.rolled { max-width: 1180px !important; padding-left: 16px; padding-right: 16px; } #app.rolled .win .focus { display: none !important; } }
#app.rolled #rollBar { display: flex; }
#app.rolled .win.closed { display: none !important; }
#app.rolled .win .sizer { display: none; }
#app.rolled #melWin { margin-top: 0; }
#app.rolled #accWin, #app.rolled #bassWin { margin-top: 12px; }
#app.rolled #accWin.lead, #app.rolled #bassWin.lead { margin-top: 0; }
#app.rolled .win.lead .winHead { display: none; }
.rollItem { flex: 1; display: flex; align-items: center; gap: 6px; height: 30px; background: #111; color: #fff; border: 1px solid #000; border-radius: 4px; padding: 0 4px 0 8px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.rollItem .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.rollItem .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.rollItem button { width: 24px; height: 22px; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(255,255,255,.12); color: #fff; font-size: 16px; line-height: 1; padding: 0; flex: 0 0 auto; }
.rollItem.open { background: var(--ground2); }
.rollItem.open button { background: var(--box); color: #111; border-color: #a86d10; }
#head { grid-area: head; } #nav { grid-area: nav; } #melWin { grid-area: mel; } #rhyStrip { grid-area: rhy; }
#lyrStrip { grid-area: lyr; } #palette { grid-area: pal; } #accWin { grid-area: acc; } #bassWin { grid-area: bass; } #foot { grid-area: foot; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4) {
  #app { max-width: 1180px; grid-template-columns: 1fr 1fr; column-gap: 14px; align-content: start;
    grid-template-areas: "head head" "nav nav" "mel acc" "rhy bass" "lyr bass" "pal foot"; }
  #accWin, #bassWin { align-self: start; }
}
/* phone turned sideways: no thin strip — two columns, small chrome */
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  #app { max-width: none; padding: 4px 8px; gap: 4px; grid-template-columns: 1fr 1fr; column-gap: 10px;
    grid-template-areas: "head nav" "mel acc" "rhy bass" "lyr bass" "pal foot"; }
}

/* ── header ── */
#head { display: grid; grid-template-columns: 44px 1fr 44px; grid-template-rows: auto auto; gap: 2px 6px; align-items: center; }
#topTransport { justify-self: center; display: flex; gap: 6px; }
#topTransport button { width: 52px; height: 34px; border: 1.5px solid #141414; border-radius: 4px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 17px; padding: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#topTransport button.on { background: linear-gradient(#ffd27a, #f5a623); }
#app { overflow-x: hidden; }
.btn.warn { background: #c8402f; color: #fff; border-color: #a93226; }
#app > * { min-width: 0; }                     /* no child may widen the column: text and svgs never push the staves about */
#palette { min-width: 0; overflow: hidden; }
#palette .prow { min-width: 0; overflow: hidden; }
#palette .hint, #palette .who { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#songTitle { grid-column: 1 / -1; justify-self: center; width: min(100%, 360px); text-align: center; font-size: 22px; line-height: 1.2;
  background: var(--paper); color: var(--ink); border: 1.5px solid #141414; border-radius: 4px; padding: 4px 10px; font-family: var(--sans); box-shadow: inset 0 1px 3px rgba(0,0,0,.15), 0 2px 5px rgba(0,0,0,.25); }
#songTitle::placeholder { color: #999; font-style: italic; }
.iconBtn { width: 44px; height: 40px; border: none; background: none; color: var(--on-ground); font-size: 26px; display: grid; place-items: center; border-radius: 8px; }
.iconBtn:active { background: rgba(255,255,255,.12); }
#setupBtn { justify-self: center; min-width: 150px; padding: 5px 20px; font-size: 17px; color: #123; background: linear-gradient(#f7fbff, #cfe3fb); border: 1px solid #7fa6d6; border-radius: 4px; box-shadow: 0 1px 0 #fff inset, 0 2px 4px rgba(0,0,0,.35); }
#setupBtn:active { background: linear-gradient(#cfe3fb, #f7fbff); }

/* ── bar navigation (bracket) ── */
#nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
#nav .arrow { width: 44px; height: 34px; padding: 0; border: 1.5px solid #141414; border-radius: 5px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 18px; line-height: 1; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#nav .arrow:active { background: linear-gradient(#ffd27a, #f5a623); }
#nav .arrow:disabled { opacity: .35; box-shadow: none; }
#bracket { position: relative; height: 30px; }
#bracket::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 10px; border: 2px solid var(--tag); border-bottom: none; border-radius: 3px 3px 0 0; }
#barLabel { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); background: #111; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  padding: 2px 10px; border-radius: 3px; white-space: nowrap; border: none; text-transform: uppercase; }
#barDots { position: absolute; left: 8px; right: 8px; top: 25px; height: 5px; display: flex; gap: 2px; }
#barDots i { flex: 1; height: 5px; border-radius: 2px; background: rgba(255,255,255,.18); cursor: pointer; }
#barDots i.g { background: var(--green); } #barDots i.y { background: var(--yellow); } #barDots i.w { background: rgba(255,255,255,.55); }
#barDots i.cur { outline: 1.5px solid #fff; outline-offset: 1px; }
#barDots i.play { box-shadow: 0 0 0 1px var(--box); }

/* ── beat header ── */
#beatRow { position: relative; height: 20px; margin-bottom: -3px; overflow: hidden; grid-column: 1 / -1; grid-row: 1; }
#beatRow[hidden] { display: none; }
#beatRow .inner { position: absolute; inset: 0; will-change: transform; }
#beatRow .beat { position: absolute; top: 2px; height: 16px; display: flex; align-items: center; transform: translateX(-50%); }
#beatRow .beat b { background: #111; color: #fff; font-size: 10px; font-weight: 600; height: 16px; line-height: 16px; padding: 0 6px; border-radius: 2px; white-space: nowrap; border: 1px solid #000; }
#beatRow .beat i { display: none; }
#beatRow .beat .ch { color: #ffd58a; font-family: var(--serif); font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
#beatRow .beat .ch.carried { opacity: .55; font-style: italic; }
#beatRow .beat:active b { background: var(--accent); }
#beatRow .beat.active b { background: var(--box); color: #111; border-color: #a86d10; }

/* ── windows ── */
.win { position: relative; display: grid; grid-template-columns: 42px 1fr 30px; gap: 0 4px; align-items: start; }
.win .frame, .win .gutter { align-self: start; }
.win .gutter { position: relative; display: flex; flex-direction: column; align-items: stretch; margin-top: -17px; margin-bottom: -17px; }
.win .gutter svg { display: block; width: 42px; }
.win .frame { background: var(--paper); border: 1.5px solid #141414; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.18);
  overflow: hidden; position: relative; }
.win .frame { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.win .frame::-webkit-scrollbar { display: none; }
.win .frame svg { display: block; touch-action: none; shape-rendering: geometricPrecision; }
.win .frame svg line.stl { shape-rendering: crispEdges; }
.win .side { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 7px; padding: 2px 0; }
.win .solo { width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); font-size: 12px; }
.win .solo.on { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
.win .focus { display: none; width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); font-size: 13px; }
.win .focus.on { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4), (max-height: 520px) and (min-aspect-ratio: 5/4) { .win .focus { display: block; } }
/* one window given the whole screen (wide layouts) */
#app.focused { max-width: none !important; grid-template-columns: 1fr !important; }
#app.focus-mel { grid-template-areas: "head" "nav" "mel" "rhy" "lyr" "pal" !important; }
#app.focus-acc { grid-template-areas: "head" "nav" "acc" !important; }
#app.focus-bass { grid-template-areas: "head" "nav" "bass" !important; }
#app.focus-mel :is(#accWin, #bassWin, #foot), #app.focus-acc :is(#melWin, #rhyStrip, #lyrStrip, #palette, #bassWin, #foot), #app.focus-bass :is(#melWin, #rhyStrip, #lyrStrip, #palette, #accWin, #foot) { display: none !important; }
.win.closed .solo { display: none; }
.win .gear { width: 24px; height: 24px; border: none; background: none; color: var(--on-ground); font-size: 17px; padding: 0; line-height: 1; opacity: .9; }
.ico { width: 1em; height: 1em; display: block; margin: auto; pointer-events: none; }
#gearBtn .ico { width: 22px; height: 22px; }
.win .gear .ico { width: 16px; height: 16px; }
.win .sizer { width: 24px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: rgba(0,0,0,.25); color: var(--on-ground); display: grid; place-items: center; }
.win .sizer .sz { display: block; width: 12px; height: 9px; border: 1.5px solid currentColor; border-radius: 1px; position: relative; }
.win.half .sizer .sz { height: 5px; }
.win.closed .sizer .sz { height: 9px; border-top-width: 4px; }
.win.closed .frame, .win.closed .gutter { display: none; }
.win.closed { min-height: 22px; grid-template-columns: 42px 1fr 30px; }
.win.closed .side { flex-direction: row; gap: 6px; grid-column: 3; }
.win.closed .winHead { position: static; transform: none; justify-self: start; grid-column: 2; }
#melWin.closed::before { content: ""; grid-column: 1; }
.win .rArr { width: 34px; height: 15px; flex: 0 0 15px; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; background: rgba(0,0,0,.32); color: #fff; font-size: 13px; font-weight: 700; padding: 0; line-height: 13px; position: static; margin: 0 4px 0 2px; letter-spacing: 0; box-shadow: 0 1px 2px rgba(0,0,0,.35); z-index: 1; }
.win .rArr:active { background: linear-gradient(#ffd27a, #f5a623); color: #111; }
.win .rArr.up { margin-bottom: 2px; } .win .rArr.dn { margin-top: 2px; }
.win .gutter svg text { paint-order: stroke; stroke: var(--ground); stroke-width: 2px; stroke-linejoin: round; }
.winHead { position: absolute; left: 50%; transform: translateX(-50%); top: -9px; z-index: 2; background: #111; color: #fff; font-size: 10.5px; font-weight: 700; height: 18px; line-height: 16px;
  letter-spacing: .06em; padding: 0 12px; border-radius: 3px; white-space: nowrap; text-transform: uppercase; border: 1px solid #000; max-width: calc(100% - 100px); overflow: hidden; text-overflow: ellipsis; }
#accWin, #bassWin { margin-top: 10px; }
#rhyStrip { margin-top: 10px; }                 /* room for the lower arrow of the window above */
#app:not(.rolled) .win.lead:not(#melWin) { margin-top: 26px; }
#app:not(.rolled) .win.lead .winHead { top: -30px; }
#melWin .winHead { display: none; }
#melWin.closed .winHead { display: block; }
.win.compact .gutter svg text { font-size: 7px; }
.win.playing .frame { box-shadow: inset 0 0 0 2px var(--box), inset 0 2px 8px rgba(0,0,0,.28); }

/* ── strips ── */
.strip { display: grid; grid-template-columns: 42px 1fr 30px; gap: 0 4px; align-items: center; }
.strip .tag { justify-self: stretch; height: 24px; display: grid; place-items: center; background: linear-gradient(#a6e06a, var(--tag)); color: var(--tag-ink); border: 1px solid #3a8a1e; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: none; padding: 0 2px; white-space: nowrap; overflow: hidden; }
.strip .tag:active { filter: brightness(1.1); }
.strip .body { border: 1.5px solid #141414; border-radius: 4px; overflow-x: auto; overflow-y: hidden; position: relative; scrollbar-width: none; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
.strip .body::-webkit-scrollbar { display: none; }
.strip .body svg { display: block; touch-action: none; }
#rhyStrip .body { background: var(--ground2); }
#lyrStrip .body { background: var(--lyric); box-shadow: 0 0 0 2px var(--tag) inset; }
#lyrStrip .body svg text { font-family: var(--sans); font-weight: 700; fill: var(--lyric-ink); }
#lyrStrip.serif .body svg text, #wordEdit.serif input { font-family: var(--serif); font-weight: 600; }
#lyrStrip.smallcaps .body svg text, #wordEdit.smallcaps input { font-family: var(--serif); font-variant: small-caps; font-weight: 700; letter-spacing: .02em; }

/* ── palette: note lengths + editing tools ── */
#palette { display: flex; flex-direction: column; gap: 4px; padding: 5px 6px; background: var(--ground2); border: 1.5px solid #141414; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 5px rgba(0,0,0,.25); }
#palette .prow { display: flex; gap: 4px; align-items: center; justify-content: flex-start; height: 30px; }
#palette .prow button { width: 32px; min-width: 32px; height: 28px; padding: 0; flex: 0 0 32px; }
#palette .prow button.txt { padding: 0; }
#palette .prow .who { margin-left: 4px; }
#palette .prow button.chord { width: auto; min-width: 44px; flex: 0 0 auto; padding: 0 7px; }
/* ── floating tool palette ── */
#app.ftp #palette { visibility: hidden; }
#app.ftp .win .frame svg, #app.ftp #rhySvg, #app.ftp #lyrSvg { pointer-events: none; }
#ftp { position: fixed; z-index: 60; left: 0; top: 0; width: 196px; background: #3fb5f2; border: 2px solid #0d2f45; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.45); padding: 0 5px 5px; user-select: none; -webkit-user-select: none; transform-origin: top left; touch-action: none; font-family: var(--sans); }
#ftp[hidden] { display: none; }
#ftp.size-s { transform: scale(.82); } #ftp.size-l { transform: scale(1.2); }
#ftp .ftpGrip { height: 14px; display: grid; place-items: center; color: rgba(0,0,0,.45); font-size: 10px; letter-spacing: 2px; cursor: grab; touch-action: none; }
#ftp .ftpGrip:active { cursor: grabbing; }
#ftp .row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
#ftp button { border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; border-radius: 4px; height: 30px; min-width: 30px; padding: 0 4px; font-size: 17px; line-height: 1; display: grid; place-items: center; }
#ftp button:disabled { opacity: .35; }
#ftp button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; border-color: #1b4f8a; }
#ftp button.warn { color: var(--danger); }
#ftp .seg3 { display: flex; border: 1.5px solid #111; border-radius: 4px; overflow: hidden; }
#ftp .seg3 button { border: none; border-radius: 0; width: 30px; min-width: 30px; height: 26px; font-weight: 800; font-size: 15px; background: linear-gradient(#f4f4f4, #cfcfcf); }
#ftp .seg3 button.on { background: #111; color: #fff; }
#ftp .sp { flex: 1; }
#ftp .ftpLbl { flex: 1; min-width: 0; height: 30px; background: #111; color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .02em; border-radius: 3px; border: 1px solid #000; white-space: nowrap; overflow: hidden; padding: 0 2px; display: flex; flex-direction: column; justify-content: center; line-height: 11px; }
#ftp .ftpLbl .sub { font-size: 7.5px; font-weight: 600; opacity: .75; letter-spacing: .04em; }
#ftp .arrow { width: 38px; min-width: 38px; height: 32px; border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; font-size: 15px; border-radius: 4px; }
#ftp .arrow:active { background: linear-gradient(#ffd27a, #f5a623); }
#ftp .ftpPlay { width: 34px; min-width: 34px; height: 26px; font-size: 13px; }
#ftp .main { display: flex; gap: 5px; align-items: stretch; margin-bottom: 4px; }
#ftp.side-left .main { flex-direction: row-reverse; }
#ftp .grid { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; padding: 4px; background: #0d2f45; border-radius: 4px; }
#ftp .grid button { width: 40px; min-width: 40px; height: 34px; font-size: 19px; }
#ftp .grid button.art { font-family: var(--serif); font-size: 16px; }
#ftp .grid button.art.armed { background: linear-gradient(#ffd27a, #f5a623); border-color: #a86d10; }
#ftp .grid button.undo { font-size: 16px; }
#ftp .grid button.txt { font-size: 14px; font-weight: 700; }
#ftp .pitch { display: flex; flex-direction: column; align-items: center; width: 40px; }
#ftp .pitch .pBtn { width: 40px; min-width: 40px; height: 40px; border: none; background: none; color: #111; font-size: 26px; padding: 0; }
#ftp .pitch .pBtn:active { color: #fff; }

      "value": "Pattern names match Guitar_Strum_Bank exactly. Bass default names a rhythm pattern from the same bank plus how to voice it (roots, root-fifth, octaves). Default BPM sits inside the pattern's BPM range. Edit any cell — this sheet is meant to be corrected."
    },
    {
      "label": "Piano_Pattern_Bank:",
      "value": "Same timing scheme as Guitar_Strum_Bank (60 BPM reference). Hands column describes LH/RH roles. When piano is the accompaniment instrument, its LH covers the bass role, so the Bass default column applies only when a separate bass instrument is used. Slash values in Ratio/Sustain/Mute alternate per slot, same convention as the guitar sheet."
    },
    {
      "label": "Instruments:",
      "value": "Timbre is separate from pattern. An instrument names which pattern bank it plays from; several instruments can share one bank (acoustic / 12-string / electric all use Guitar_Strum_Bank; bass guitar / 808 / tuba all use Bass_Pattern_Bank). Trumpet and clarinet carry the melody or a countermelody, so they have ranges and timbres but no pattern bank."
    },
    {
      "label": "Bass_Pattern_Bank:",
      "value": "Note choice column says which chord tones the pattern uses. Genre_Pattern_Map's bass column now references these pattern names exactly."
    },
    {
      "label": "Ensemble_Pattern_Bank:",
      "value": "Suits column suggests strings vs horns. Ensemble parts are optional color; '—' in the map means the genre usually omits them."
    },
    {
      "label": "Register_Map:",
      "value": "Defaults for where each role sits relative to the melody. The app applies these automatically when building a song, then lets the user drag any part to a different octave. Hard clamps come from the Instruments sheet ranges — the app warns when a part exceeds its instrument."
    },
    {
      "label": "Custom rows:",
      "value": "Custom entry is two-tier. SIMPLE (default): the user enters just chords, notes, and rhythm — nothing else. The envelope fills in automatically by slot length: slots ≥ 2000 ms → ratio 0.90 · 1000 ms → 0.80 · 500 ms → 0.70 · 250 ms → 0.60 · ≤ 125 ms → 1.00 · swing pairs → 0.75 / 0.50 (values borrowed from the straight presets in the banks). ADVANCED (behind a toggle, labeled 'Fine-tune the feel'): per-slot ratio / sustain / mute, pedal, and accents. A simple-mode custom pattern is stored in the same fields as presets — the auto-filled values are just written for the user."
    },
    {
      "label": "Chord_Vocabulary:",
      "value": "Grammar the progression parser and chord builder support. Plain numerals in Genre_Chord_Bank remain valid and mean root-position triads in key — fully backward compatible. Figured bass (I6, I64, V65) and slash chords (C/E) are two displays of the same data, following the numerals-vs-chord-names toggle. Tier column: Simple chords appear in the quick picker; Advanced appear in the full chord builder."
    }

    h("Settings ⚙", "View (stacked staves, or rolled up into three bars with + / −), theme, window sizing, chords display, note appearance (traditional, pills, circles), half steps on lines, metronome."),
    h("Menu ☰", "Share a link or per-musician parts, export/import files, save."),
  ]);
}

/* hear one part alone, from this bar to the end of the section */
function playSolo(win, btn) {
  const part = WIN_PART[win];
  if (S.playing && S.solo === part) { stopPlayback(); return; }
  if (!S.song.parts[part].on) { toast(`${PART_META[part].label} is off — turn it on in ⚙`); return; }
  const { end } = curRange(), list = []; for (let i = S.bi; i < end; i++) list.push(i);
  startPlayback(list); S.solo = part;
  document.querySelectorAll(".win .solo").forEach(b => b.classList.toggle("on", b === btn));
}
/* ── undo: restore the last idle snapshot ── */
function undo() {
  if (!UNDO.stack.length) { toast("Nothing to undo"); return; }
  const snap = UNDO.stack.pop();
  S.song = upgradeSong(JSON.parse(snap)); UNDO.last = snap; S.sel = null;
  if (S.followWords) S.cursor = nextUnpitchedChip(S.bi, null);
  renderAll(); toast("Undone");
}

/* ── MIDI controller (Web MIDI): a keyboard pitches the melody or places band notes ── */
const MIDI = { access: null, inputs: [], ports: new Map() };
function midiInit() { if (!navigator.requestMIDIAccess || !Object.values(S.midi || {}).some(Boolean)) return; midiConnect().catch(() => {}); }
async function midiConnect() {
  if (!navigator.requestMIDIAccess) throw new Error("no midi");
  if (!MIDI.access) { MIDI.access = await navigator.requestMIDIAccess({ sysex: false }); MIDI.access.onstatechange = () => { midiRefresh(); }; }
  midiRefresh();
}
function midiRefresh() {
  MIDI.inputs = MIDI.access ? [...MIDI.access.inputs.values()] : [];
  MIDI.inputs.forEach(inp => { inp.onmidimessage = e => midiMessage(inp.id, e.data); });
}
function midiMessage(portId, data) {
  const st = data[0] & 0xf0, note = data[1], vel = data[2];
  if (st !== 0x90 || vel === 0) return;
  const part = Object.keys(S.midi || {}).find(p => S.midi[p] === portId); if (!part) return;
  if (document.getElementById("overlay").classList.contains("on")) return;
  midiNote(part, note, vel / 127);
}
function midiNote(part, m, vel) {
  const bar = curBar(), bi = S.bi, B = barBeats(bi);
  if (part === "melody") {
    if (S.ghost && S.ghost.part === "melody" && S.ghost.bi === bi) { const gh = S.ghost; S.ghost = null; bar.ev.melody.push({ id: uid(), t: gh.t, d: gh.d, m }); syncNotesToChips(bar); previewNote(m, part); renderAll(); return; }
    const sel = selEv();
    let chain = sel && S.sel.part === "melody" && !sel.rest ? chainOf(bar, sel) : null;
    if (!chain) chain = chains(bar).find(c => !c.rest && c.head.m == null && !tiedFromPrev(bi, c)) || null;
    if (chain) { setChainPitch(bar, chain, m); S.sel = null; const next = chains(bar).find(c => !c.rest && c.head.m == null && !tiedFromPrev(bi, c)); if (next) S.sel = { bi, part: "melody", id: next.head.id }; }
    else { const t = rhythmEnd(bar); if (t >= B - 1e-6) { toast("Bar is full"); return; } bar.ev.melody.push({ id: uid(), t, d: Math.min(noteLenBeats(), freeSpan(bar, t)), m }); }
    syncNotesToChips(bar); if (S.followWords) S.cursor = nextUnpitchedChip(bi, null);
  } else {
    if (!bar.custom[part]) { toast(`${PART_META[part].label}: switch to Custom to record notes`); return; }
    const last = [...bar.ev[part]].sort((a, b) => a.t - b.t).pop(), t = last ? r3(last.t + last.d) : 0;
    if (t >= B - 1e-6) { toast("Bar is full"); return; }
    bar.ev[part].push({ id: uid(), t, d: Math.min(noteLenBeats(), B - t), m });
  }
  previewNote(m, part); ensureVisible(part, m); renderAll();
}
function midiRow(part, win) {
  const row = el("div", { class: "pRow tight" });
  if (!navigator.requestMIDIAccess) { row.append(el("span", { class: "tiny" }, "Web MIDI isn't available in this browser (Chrome, Edge and Opera support it; iOS Safari doesn't).")); return row; }
  const sel = el("select", { class: "sel", onchange: e => { S.midi = S.midi || {}; S.midi[part] = e.target.value || null; savePrefs(); if (S.midi[part]) midiConnect().then(() => toast("MIDI connected: play a key to pitch the next note")).catch(() => toast("MIDI access was refused")); } });
  sel.append(el("option", { value: "" }, MIDI.access ? "No controller" : "Not connected"));
  MIDI.inputs.forEach(inp => sel.append(el("option", { value: inp.id, selected: S.midi && S.midi[part] === inp.id }, inp.name || inp.id)));
  row.append(sel, el("button", { class: "btn sm", onclick: () => midiConnect().then(() => { toast(MIDI.inputs.length ? `${MIDI.inputs.length} controller${MIDI.inputs.length === 1 ? "" : "s"} found` : "No MIDI controllers found — plug one in"); openWinSettings(win); }).catch(() => toast("MIDI access was refused")) }, MIDI.access ? "Rescan" : "Connect…"));
  row.append(el("span", { class: "tiny" }, part === "melody" ? "Keys pitch the selected or next empty rhythm box, or add notes at the palette length." : "Keys add notes at the palette length (Custom mode)."));
  return row;
}

/* bar text from chips — letters, spaces and symbols included */
function lyricFromChips(bar) {
  const words = []; let cur = "";
  for (const c of bar.chips) {
    if (c.rest) { if (cur) { words.push(cur); cur = ""; } words.push(REST_MARK); continue; }
    if (c.kind === "space") { if (cur) { words.push(cur); cur = ""; } continue; }
    cur += c.text;
    if (!c.kind && (c.pos === "single" || c.pos === "end")) { words.push(cur); cur = ""; }
  }
  if (cur) words.push(cur);
  return words.join(" ");
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTION 14 · BOOT
   ═══════════════════════════════════════════════════════════════════════ */
function upgradeTies(song) {                       // older songs: a note past its bar becomes a tie chain
  const B = TS_BEATS[song.sig] || 4;
  song.bars.forEach((bar, bi) => {
    bar.ev.melody.forEach(e => { if (!e.rest && e.t + e.d > B + 1e-6) { const over = r3(e.t + e.d - B); e.d = r3(B - e.t); e.tie = true; const nb = song.bars[bi + 1]; if (nb && !nb.ev.melody.some(x => x.t < over - 1e-6)) nb.ev.melody.push({ id: uid(), t: 0, d: Math.min(over, B), m: e.m }); } });
    ["bass", "accomp", "ensemble"].forEach(p => (bar.ev[p] || []).forEach(e => { if (e.t + e.d > B) e.d = r3(B - e.t); }));
    if (song.view && song.view.bassLo == null) { song.view.bassLo = 40; if (song.view.accLo === 36 || song.view.accLo === 48) song.view.accLo = 55; }
  });
}
async function boot() {
  loadPrefs();
  const fromLink = await importFromHash();
  if (!fromLink) { const cur = readJSON(STORE.cur, null); if (!cur || !loadSong(cur)) { S.song = newSong(); saveNow(); } }
  upgradeTies(S.song); S.chordsDisp = S.song.showRoman ? "roman" : S.chordsDisp;
  loadSampleMeta().then(loadSongBanks);
  $("songTitle").addEventListener("input", e => { S.song.title = e.target.value; saveSoon(); });
  $("songTitle").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("menuBtn").addEventListener("click", openMenu);
  $("gearBtn").addEventListener("click", openSettings);
  $("prevBar").addEventListener("click", () => { S.bi = Math.max(0, S.viewSpan > 1 ? viewFirst() - S.viewSpan : S.bi - 1); S.sel = null; S.ghost = null; S.active = null; renderAll(); });
  $("nextBar").addEventListener("click", () => { S.bi = Math.min(S.song.bars.length - 1, S.viewSpan > 1 ? viewFirst() + S.viewSpan : S.bi + 1); S.sel = null; S.ghost = null; S.active = null; renderAll(); });
  /* the five frames scroll as one; the beat row follows */
  const scrollers = ["melWin", "accWin", "bassWin"].map(id => $(id).querySelector(".frame")).concat(["rhyStrip", "lyrStrip"].map(id => $(id).querySelector(".body")));
  let syncing = false;
  scrollers.forEach(sc => sc.addEventListener("scroll", () => { if (syncing) return; syncing = true; scrollers.forEach(o => { if (o !== sc) o.scrollLeft = sc.scrollLeft; }); const inner = $("beatRow").querySelector(".inner"); if (inner) inner.style.transform = `translateX(${-sc.scrollLeft}px)`; syncing = false; }, { passive: true }));
  $("barLabel").addEventListener("click", openSectionOps);
  $("rhyTag").addEventListener("click", openRhythmMenu);
  $("lyrTag").addEventListener("click", openWords);
  $("chordsBtn").addEventListener("click", openChordsSheet);
  $("saveBtn").addEventListener("click", openLibrary);
  let holdT = null, held = false; const pb = $("playBtn");
  pb.addEventListener("pointerdown", () => { held = false; holdT = setTimeout(() => { held = true; if (S.playing) stopPlayback(); playSong(); toast("Playing the whole song"); }, 550); });
  const pbUp = () => clearTimeout(holdT); pb.addEventListener("pointerup", pbUp); pb.addEventListener("pointerleave", pbUp); pb.addEventListener("pointercancel", pbUp);
  pb.addEventListener("click", () => { if (held) return; if (S.playing) { stopPlayback(); $("pauseBtn").classList.remove("on"); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); return; } const { end } = curRange(), list = []; for (let i = S.bi; i < end; i++) list.push(i); startPlayback(list); });
  $("pauseBtn").addEventListener("click", () => { if (!S.playing || !audioCtx) return; if (audioCtx.state === "running") { audioCtx.suspend(); $("pauseBtn").classList.add("on"); } else { audioCtx.resume(); $("pauseBtn").classList.remove("on"); } });
  midiInit();
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });
  initPointer(); initWindowChrome(); initWordEdit();
  window.addEventListener("keydown", e => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || $("overlay").classList.contains("on")) return;
    if (e.key === " ") { e.preventDefault(); $("playBtn").click(); }
    else if (e.key === "Escape") { S.sel = null; S.ghost = null; S.artic = null; S.slurFrom = null; S.active = null; closeWordEdit(); if (S.focus) setFocus(S.focus); else renderAll(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
    else if (e.key === "ArrowLeft" && !S.sel) { e.preventDefault(); if (S.bi > 0) { S.bi--; renderAll(); } }
    else if (e.key === "ArrowRight" && !S.sel) { e.preventDefault(); if (S.bi < S.song.bars.length - 1) { S.bi++; renderAll(); } }
    else if (S.sel) {
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSel(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); transposeSel(e.shiftKey ? 12 : 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); transposeSel(e.shiftKey ? -12 : -1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); moveSel(-gridStep()); }
      else if (e.key === "ArrowRight") { e.preventDefault(); moveSel(gridStep()); }
      else if (e.key === "t") tapTie();
    }
  });
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
  if (S.followWords) S.cursor = nextUnpitchedChip(0, null);
  renderAll();
  requestAnimationFrame(renderAll);              // once fonts and widths have settled
}
boot();
</script>
