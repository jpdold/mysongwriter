<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Song Writer</title>
<meta name="theme-color" content="#5a5c5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235a5c5f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. TOKENS — the mock: graphite ground, white paper windows, green tags,
      blue lyric strip, orange rhythm boxes. Dark and custom themes retint.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --ground: #5b5d60;          /* phone body */
  --ground2: #4c4e51;         /* strips, headers */
  --paper: #ffffff;           /* windows */
  --paper2: #f3f3f3;
  --line: #2b2b2b;            /* staff lines */
  --line-soft: #bdbdbd;       /* half-step guide lines */
  --beat: #111;               /* dotted beat dividers */
  --ink: #111;                /* notes, text on paper */
  --ink2: #666;
  --on-ground: #f4f4f4;       /* text on graphite */
  --on-ground2: #c9c9c9;
  --tag: #8fd14f;             /* green labels */
  --tag-ink: #123;
  --lyric: #4da3e0;           /* lyric strip */
  --lyric-ink: #ffffff;
  --box: #f5a623;             /* rhythm boxes */
  --accent: #2f7fd6;          /* Setup… */
  --danger: #e5322d;          /* Save… */
  --melody: #111; --sub: #d99a2b; --backup: #9b7bc6; --bass: #2e4a9e; --accomp: #1f7a70; --ensemble: #4d8f3a;
  --green: #4caf7d; --yellow: #e6b422;
  --bezel: 18px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --music: "Bravura", "Noto Music", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1c1d20; --ground2: #141517; --paper: #26272b; --paper2: #2e2f34;
  --line: #d8d8d8; --line-soft: #4a4b50; --beat: #e6e6e6; --ink: #f2f2f2; --ink2: #9a9a9a;
  --on-ground: #eee; --on-ground2: #999; --tag: #7cc242; --lyric: #2f6fa8; --box: #e39a2a; --accent: #4f95e6;
  --melody: #f2f2f2; --bass: #8ea6f0; --accomp: #5fc0b3;
}

/* ═══════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--on-ground); font-family: var(--sans); font-size: 14px; line-height: 1.3;
  overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { -webkit-user-select: text; user-select: text; }
.hidden { display: none !important; }
svg text { pointer-events: none; }

/* ═══════════════════════════════════════════════════════════════════════
   3. LAYOUT — one column on a phone; melody stack left / band right when wide
   ═══════════════════════════════════════════════════════════════════════ */
#app { max-width: 560px; margin: 0 auto; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 6px;
  grid-template-columns: 1fr; grid-template-areas: "head" "nav" "beats" "mel" "rhy" "lyr" "pal" "acc" "bass" "foot"; }
#head { grid-area: head; } #nav { grid-area: nav; } #beatRow { grid-area: beats; } #melWin { grid-area: mel; } #rhyStrip { grid-area: rhy; }
#lyrStrip { grid-area: lyr; } #palette { grid-area: pal; } #accWin { grid-area: acc; } #bassWin { grid-area: bass; } #foot { grid-area: foot; }
@media (min-width: 860px) and (min-aspect-ratio: 5/4) {
  #app { max-width: 1180px; grid-template-columns: 1fr 1fr; column-gap: 14px; align-content: start;
    grid-template-areas: "head head" "nav nav" "beats acc" "mel acc" "rhy bass" "lyr bass" "pal foot"; }
  #accWin, #bassWin { align-self: start; }
}
/* phone turned sideways: no thin strip — two columns, small chrome */
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  #app { max-width: none; padding: 4px 8px; gap: 4px; grid-template-columns: 1fr 1fr; column-gap: 10px;
    grid-template-areas: "head nav" "beats acc" "mel acc" "rhy bass" "lyr bass" "pal foot"; }
}

/* ── header ── */
#head { display: grid; grid-template-columns: 44px 1fr 44px; grid-template-rows: auto auto; gap: 4px 6px; align-items: center; }
#songTitle { grid-column: 1 / -1; justify-self: center; width: min(100%, 360px); text-align: center; font-size: 22px; line-height: 1.2;
  background: var(--paper); color: var(--ink); border: 2px solid #111; border-radius: 3px; padding: 3px 10px; font-family: var(--sans); }
#songTitle::placeholder { color: #999; font-style: italic; }
.iconBtn { width: 44px; height: 40px; border: none; background: none; color: var(--on-ground); font-size: 26px; display: grid; place-items: center; border-radius: 8px; }
.iconBtn:active { background: rgba(255,255,255,.12); }
#setupBtn { justify-self: center; min-width: 150px; padding: 5px 20px; font-size: 17px; color: #123; background: linear-gradient(#f7fbff, #cfe3fb); border: 1px solid #7fa6d6; border-radius: 4px; box-shadow: 0 1px 0 #fff inset, 0 2px 4px rgba(0,0,0,.35); }
#setupBtn:active { background: linear-gradient(#cfe3fb, #f7fbff); }

/* ── bar navigation (bracket) ── */
#nav { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 4px; }
#nav .arrow { height: 30px; border: none; background: none; color: var(--on-ground); font-size: 20px; border-radius: 6px; }
#nav .arrow:disabled { opacity: .3; }
#bracket { position: relative; height: 30px; }
#bracket::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 10px; border: 2px solid var(--tag); border-bottom: none; border-radius: 3px 3px 0 0; }
#barLabel { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); background: #111; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  padding: 2px 10px; border-radius: 3px; white-space: nowrap; border: none; text-transform: uppercase; }
#barDots { position: absolute; left: 8px; right: 8px; top: 25px; height: 5px; display: flex; gap: 2px; }
#barDots i { flex: 1; height: 5px; border-radius: 2px; background: rgba(255,255,255,.18); cursor: pointer; }
#barDots i.g { background: var(--green); } #barDots i.y { background: var(--yellow); } #barDots i.w { background: rgba(255,255,255,.55); }
#barDots i.cur { outline: 1.5px solid #fff; outline-offset: 1px; }
#barDots i.play { box-shadow: 0 0 0 1px var(--box); }

/* ── beat header ── */
#beatRow { position: relative; height: 22px; margin-bottom: -2px; }
#beatRow .beat { position: absolute; top: 3px; height: 16px; display: flex; align-items: center; gap: 4px; }
#beatRow .beat b { background: #111; color: #fff; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
#beatRow .beat i { display: inline-block; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 8px solid #fff; }
#beatRow .beat .ch { color: #ffd58a; font-family: var(--serif); font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
#beatRow .beat .ch.carried { opacity: .55; font-style: italic; }
#beatRow .beat:active b { background: var(--accent); }

/* ── windows ── */
.win { position: relative; display: grid; grid-template-columns: 42px 1fr 22px; gap: 0 3px; align-items: stretch; }
.win .gutter { position: relative; }
.win .gutter svg { display: block; width: 42px; }
.win .frame { background: var(--paper); border: 2px solid #111; border-radius: 3px; box-shadow: inset 0 0 0 2px #fff, inset 0 2px 8px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.15);
  overflow: hidden; position: relative; }
.win .frame svg { display: block; width: 100%; touch-action: none; }
.win .side { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0; }
.win .gear, .win .sizer { width: 22px; height: 22px; border: none; background: none; color: var(--on-ground); font-size: 17px; padding: 0; line-height: 1; opacity: .85; }
.win .sizer { font-size: 13px; letter-spacing: -2px; }
.win .rArr { width: 42px; height: 14px; border: none; background: none; color: var(--on-ground); font-size: 12px; padding: 0; line-height: 1; position: absolute; left: 0; }
.win .rArr.up { top: -2px; } .win .rArr.dn { bottom: -2px; }
.winHead { position: absolute; left: 50%; transform: translateX(-50%); top: -9px; z-index: 2; background: #111; color: #fff; font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; padding: 1px 12px; border-radius: 3px; white-space: nowrap; text-transform: uppercase; border: none; }
#accWin, #bassWin { margin-top: 10px; }
.win.compact .gutter svg text { font-size: 7px; }
.win.playing .frame { box-shadow: inset 0 0 0 2px var(--box), inset 0 2px 8px rgba(0,0,0,.28); }

/* ── strips ── */
.strip { display: grid; grid-template-columns: 42px 1fr 22px; gap: 0 3px; align-items: center; }
.strip .tag { justify-self: stretch; height: 22px; display: grid; place-items: center; background: var(--tag); color: var(--tag-ink); border: 1px solid #2c5; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: none; padding: 0 2px; white-space: nowrap; overflow: hidden; }
.strip .tag:active { filter: brightness(1.1); }
.strip .body { border: 2px solid #111; border-radius: 3px; overflow: hidden; position: relative; }
.strip .body svg { display: block; width: 100%; touch-action: none; }
#rhyStrip .body { background: var(--ground2); }
#lyrStrip .body { background: var(--lyric); box-shadow: 0 0 0 2px var(--tag) inset; }
#lyrStrip .body svg text { font-family: var(--sans); font-weight: 700; fill: var(--lyric-ink); }
#lyrStrip.serif .body svg text, #wordEdit.serif input { font-family: var(--serif); font-weight: 600; }
#lyrStrip.smallcaps .body svg text, #wordEdit.smallcaps input { font-family: var(--serif); font-variant: small-caps; font-weight: 700; letter-spacing: .02em; }

/* ── palette: note lengths + editing tools ── */
#palette { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 2px 0; }
#palette button { min-width: 31px; height: 32px; border: 1px solid #222; background: linear-gradient(#fff, #d9d9d9); color: #111; border-radius: 4px; font-size: 18px; padding: 0 6px;
  font-family: var(--music), var(--serif); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
#palette { gap: 3px; }
#palette button.txt { font-family: var(--sans); font-size: 12px; font-weight: 600; }
#palette button.on { background: linear-gradient(#6fb3ff, #2f7fd6); color: #fff; border-color: #1b4f8a; }
#palette button.warn { color: var(--danger); }
#palette button.undo { font-family: var(--sans); font-size: 17px; }
#palette button.art { font-family: var(--serif); font-size: 16px; }
#palette button.art.armed { background: linear-gradient(#ffd27a, #f5a623); border-color: #a86d10; }
#palette button.lyr { font-family: var(--sans); font-size: 12px; font-weight: 600; min-width: 0; padding: 0 9px; }
#palette button:disabled { opacity: .35; }
#palette .gap { width: 8px; }
#palette .who { font-size: 11px; color: var(--on-ground2); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

/* ── footer ── */
#foot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 4px; }
.bigBtn { height: 40px; border: 2px solid #111; border-radius: 4px; font-size: 19px; font-weight: 700; box-shadow: 0 2px 4px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7); }
#chordsBtn { background: linear-gradient(#fff, #ddd); color: #111; }
#saveBtn { background: linear-gradient(#ff5a4e, #e5322d); color: #fff; }
#transport { display: flex; gap: 6px; }
#transport button { width: 42px; height: 40px; border: 2px solid #111; border-radius: 4px; background: linear-gradient(#fff, #cfcfcf); color: #111; font-size: 17px; padding: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
#transport button.on { background: linear-gradient(#ffd27a, #f5a623); }

/* ═══════════════════════════════════════════════════════════════════════
   4. SHEETS & CONTROLS (settings, setup, chords, library)
   ═══════════════════════════════════════════════════════════════════════ */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 80; align-items: flex-end; justify-content: center; }
#overlay.on { display: flex; }
#modal { background: #f7f7f7; color: #111; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(0,0,0,.4); -webkit-user-select: text; user-select: text; }
@media (min-width: 640px) { #overlay { align-items: center; padding: 20px; } #modal { border-radius: 16px; } }
#modal h3 { font-size: 19px; margin: 0 0 6px; font-weight: 600; }
#modal .mrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
#modal .mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pLbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #555; font-weight: 700; margin: 10px 0 4px; }
.pRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.pRow.tight { gap: 4px; }
.pHead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.pHead h3 { flex: 1; }
.tiny { font-size: 11.5px; color: #555; }
.muted { color: #666; }
.btn { border: 1px solid #999; background: #fff; color: #111; border-radius: 8px; padding: 7px 12px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn.on { background: #111; color: #fff; border-color: #111; }
.btn.acc { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.ghost { background: none; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; }
.seg { display: inline-flex; border: 1px solid #999; border-radius: 8px; overflow: hidden; background: #eee; }
.seg button { border: none; background: none; padding: 6px 11px; font-size: 13px; color: #444; }
.seg button.on { background: #111; color: #fff; }
.seg.sm button { padding: 4px 8px; font-size: 12px; }
select.sel, input.txt { border: 1px solid #999; border-radius: 8px; padding: 6px 9px; background: #fff; font-size: 13.5px; max-width: 100%; color: #111; }
input[type=range] { accent-color: var(--accent); }
textarea.lyricArea { width: 100%; min-height: 90px; border: 1px solid #999; border-radius: 10px; padding: 8px 10px; background: #fff; font-family: var(--serif); font-size: 16px; line-height: 1.45; resize: vertical; color: #111; }
.chipRow { display: flex; flex-wrap: wrap; gap: 6px; }
.chipBtn { border: 1px solid #aaa; background: #eee; border-radius: 999px; padding: 5px 11px; font-size: 13px; color: #111; }
.chipBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chipBtn.adv { border-style: dashed; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: #bbb; position: relative; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { left: 16px; }
.barLyrics { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.barField { display: flex; flex-direction: column; gap: 3px; }
.barField label { font-size: 10.5px; color: #777; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; }
.barField input { border: 1px solid #aaa; border-radius: 8px; padding: 6px 9px; background: #fff; font-family: var(--serif); font-size: 15px; color: #111; }
.genreGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.genreGrid button { border: 1px solid #aaa; background: #eee; border-radius: 8px; padding: 7px 10px; text-align: left; font-size: 13px; color: #111; }
.genreGrid button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.genreGrid button small { display: block; opacity: .7; font-size: 10.5px; }
.chordGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
.chordGrid button { border: 1px solid #aaa; background: #eee; border-radius: 8px; padding: 8px 4px; font-size: 14px; font-family: var(--serif); color: #111; }
.chordGrid button.on { background: #111; color: #fff; border-color: #111; }
.chordGrid button small { display: block; font-family: var(--sans); font-size: 10px; opacity: .6; }
.listRow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
.listRow b { flex: 1; font-weight: 500; }
.menuList { display: flex; flex-direction: column; }
.menuList button { border: none; background: none; text-align: left; padding: 11px 6px; border-bottom: 1px solid #ddd; font-size: 15px; display: flex; gap: 12px; align-items: center; color: #111; }
.menuList button:last-child { border-bottom: none; }
.menuList button .ic { width: 24px; text-align: center; opacity: .8; }
.partCard { border: 1px solid #ccc; border-radius: 10px; padding: 6px 9px; margin: 4px 0; background: #fff; display: flex; flex-direction: column; gap: 3px; }
.partCard .ph { display: flex; align-items: center; gap: 8px; }
.partCard .dot { width: 10px; height: 10px; border-radius: 50%; }
.partCard .ph b { flex: 1; font-weight: 600; }
.partCard.off { opacity: .55; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #111; color: #fff; padding: 9px 16px; border-radius: 999px;
  font-size: 13px; opacity: 0; transition: .2s; z-index: 90; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* inline word editor on the lyric strip */
#lyrStrip { position: relative; }
#wordEdit { position: absolute; z-index: 9; display: none; flex-direction: column; gap: 4px; background: #fff; border: 2px solid var(--tag); border-radius: 8px; padding: 4px 6px; box-shadow: 0 4px 16px rgba(0,0,0,.4); color: #111; top: 100%; margin-top: 3px; max-width: 100%; }
#wordEdit.on { display: flex; }
#wordEdit .weRow { display: flex; align-items: center; gap: 4px; }
#wordEdit .weRow .flex { flex: 1; }
#wordEdit .weRow button { width: 32px; height: 30px; }
#lyrInline { position: absolute; top: 2px; height: 24px; display: none; border: none; outline: none; background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 3px;
  font-family: var(--sans); font-weight: 700; font-size: 15px; color: #fff; caret-color: #fff; min-width: 40px; }
#lyrInline.on { display: block; }
#lyrInline::placeholder { color: rgba(255,255,255,.6); font-weight: 400; }
#lyrStrip.serif #lyrInline { font-family: var(--serif); font-weight: 600; }
#lyrStrip.smallcaps #lyrInline { font-family: var(--serif); font-variant: small-caps; }
#lyrStrip .body { overflow: visible; }
#wordEdit .weKeys { display: flex; flex-direction: column; gap: 3px; }
#wordEdit .weKeys .krow { display: flex; gap: 3px; justify-content: center; }
#wordEdit .weKeys button { flex: 1 1 0; min-width: 0; height: 38px; padding: 0; font-size: 17px; font-family: var(--sans); background: #f4f4f4; border: 1px solid #bbb; border-radius: 6px; color: #111; box-shadow: 0 1px 0 #999; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#wordEdit .weKeys button:active { background: #cfe3fb; transform: translateY(1px); }
#wordEdit .weKeys .krow { gap: 4px; }
#wordEdit .weKeys button.sym { font-family: var(--serif); }
#wordEdit .weKeys button.wide { flex: 1.6 1 0; font-size: 12px; font-weight: 600; }
#wordEdit .weKeys button.space { flex: 4 1 0; }
#wordEdit .weKeys button.on { background: #cfe3fb; border-color: #7fa6d6; }
#wordEdit .weKeys button.go { background: var(--accent); color: #fff; border-color: var(--accent); }
#wordEdit.native .weKeys { display: none; }
#wordEdit button.kb.on { background: #cfe3fb; }
#wordEdit { width: 100%; left: 0 !important; }
#wordEdit .lbl2 { font-size: 10px; color: #555; white-space: nowrap; }
#wordEdit input { width: 130px; border: none; background: none; font-family: var(--serif); font-size: 16px; font-weight: 700; padding: 3px 2px; outline: none; color: #111; }
#wordEdit button { width: 28px; height: 28px; border: none; border-radius: 6px; background: #e6e6e6; font-size: 13px; padding: 0; color: #111; }
#wordEdit button.ok { background: var(--accent); color: #fff; }

/* ═══════════════════════════════════════════════════════════════════════
   5. PART VIEW & PERFORMANCE MODE (unchanged from the engine)
   ═══════════════════════════════════════════════════════════════════════ */
#partView, #perfView { position: fixed; inset: 0; z-index: 100; background: #f7f7f7; color: #111; overflow: auto; display: none; -webkit-user-select: text; user-select: text; }
#partView.on, #perfView.on { display: block; }
.pvTop { position: sticky; top: 0; background: #f7f7f7; border-bottom: 1px solid #ccc; padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 2; flex-wrap: wrap; }
.pvTop h2 { flex: 1 1 100%; font-size: 22px; margin: 0; font-family: var(--serif); font-weight: 500; }
@media (min-width: 700px) { .pvTop h2 { flex: 1 1 auto; } }
.pvBody { padding: 14px 16px 60px; max-width: 1100px; margin: 0 auto; }
.pvSec { margin: 14px 0 22px; }
.pvSec h3 { font-size: 18px; margin: 0 0 6px; font-family: var(--serif); font-weight: 500; }
.pvBars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pvBar { border: 1px solid #ccc; border-radius: 12px; padding: 8px 10px; background: #fff; min-height: 64px; }
.pvBar .bn { font-size: 10px; color: #888; }
.pvBar .ch { font-family: var(--serif); font-size: 22px; }
.pvBar .ly { font-family: var(--serif); font-size: 15px; margin-top: 2px; }
.pvBar .nt { font-size: 12px; color: #555; margin-top: 3px; font-variant-numeric: tabular-nums; }
.pvBar .pat { font-size: 11px; color: #555; }
#perfView { background: #111; color: #eee; }
#perfView .pvTop { background: #111; border-color: #333; color: #eee; }
.perfLine { font-family: var(--serif); font-size: clamp(26px, 6vw, 54px); line-height: 1.3; padding: 6px 20px; color: #777; transition: color .2s, transform .2s; }
.perfLine.cur { color: #fff; transform: scale(1.02); }
.perfLine.done { color: #444; }
.perfLine .sec { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #a06a5a; margin-top: 18px; }
.perfWrap { padding: 40px 0 50vh; max-width: 900px; margin: 0 auto; }
@media print { #app, #overlay, #toast { display: none !important; } #partView { position: static; display: block !important; } .pvTop button { display: none; } }

<div id="app">

    <div class="body"><svg id="rhySvg"></svg></div>

    <div class="body"><svg id="lyrSvg"></svg><input id="lyrInline" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="word"></div>
    <span></span>
    <div id="wordEdit">
      <div class="weRow"><span class="lbl2"></span><span class="flex"></span><button class="kb" title="Switch between the app keyboard and the phone's keyboard">⌨</button><button class="rest" title="Rest — nothing sung here">𝄽</button><button class="close" title="Done (Esc)">✕</button></div>
      <div class="weKeys" id="weKeys"></div>
    </div>
  </div>

  <div id="palette"></div>

  <section class="win" id="accWin">
    <button class="winHead" data-win="acc">Accompaniment</button>
    <div class="gutter"><button class="rArr up" data-win="acc" data-dir="1" title="Higher">▲</button><svg id="accGut"></svg><button class="rArr dn" data-win="acc" data-dir="-1" title="Lower">▼</button></div>
    <div class="frame"><svg id="accSvg"></svg></div>
    <div class="side"><button class="gear" data-win="acc" title="Accompaniment settings">⚙</button><button class="sizer" data-win="acc" title="Window size">⏶⏷</button></div>
  </section>

  <section class="win" id="bassWin">

    <div class="frame"><svg id="bassSvg"></svg></div>
    <div class="side"><button class="gear" data-win="bass" title="Bass settings">⚙</button><button class="sizer" data-win="bass" title="Window size">⏶⏷</button></div>

  <footer id="foot">
    <button class="bigBtn" id="chordsBtn">Chords…</button>
    <div id="transport">

      <button id="pauseBtn" title="Pause / resume">⏸</button>
    </div>
    <button class="bigBtn" id="saveBtn">Save…</button>
  </footer>

</div>

<div id="toast"></div>
<div id="partView"></div>

  return row;
}

/* bar text from chips — letters, spaces and symbols included */
function lyricFromChips(bar) {
  const words = []; let cur = "";
  for (const c of bar.chips) {
    if (c.rest) { if (cur) { words.push(cur); cur = ""; } words.push(REST_MARK); continue; }
    if (c.kind === "space") { if (cur) { words.push(cur); cur = ""; } continue; }
    cur += c.text;
    if (!c.kind && (c.pos === "single" || c.pos === "end")) { words.push(cur); cur = ""; }
  }
  if (cur) words.push(cur);
  return words.join(" ");
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTION 14 · BOOT
   ═══════════════════════════════════════════════════════════════════════ */
function upgradeTies(song) {                       // older songs: a note past its bar becomes a tie chain
  const B = TS_BEATS[song.sig] || 4;
  song.bars.forEach((bar, bi) => {
    bar.ev.melody.forEach(e => { if (!e.rest && e.t + e.d > B + 1e-6) { const over = r3(e.t + e.d - B); e.d = r3(B - e.t); e.tie = true; const nb = song.bars[bi + 1]; if (nb && !nb.ev.melody.some(x => x.t < over - 1e-6)) nb.ev.melody.push({ id: uid(), t: 0, d: Math.min(over, B), m: e.m }); } });
    ["bass", "accomp", "ensemble"].forEach(p => (bar.ev[p] || []).forEach(e => { if (e.t + e.d > B) e.d = r3(B - e.t); }));
    if (song.view && song.view.bassLo == null) { song.view.bassLo = 40; if (song.view.accLo === 36 || song.view.accLo === 48) song.view.accLo = 55; }
  });
}
async function boot() {
  loadPrefs();
  const fromLink = await importFromHash();
  if (!fromLink) { const cur = readJSON(STORE.cur, null); if (!cur || !loadSong(cur)) { S.song = newSong(); saveNow(); } }
  upgradeTies(S.song); S.chordsDisp = S.song.showRoman ? "roman" : S.chordsDisp;
  loadSampleMeta().then(loadSongBanks);
  $("songTitle").addEventListener("input", e => { S.song.title = e.target.value; saveSoon(); });
  $("songTitle").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("setupBtn").addEventListener("click", openSongSetup);
  $("menuBtn").addEventListener("click", openMenu);
  $("gearBtn").addEventListener("click", openSettings);
  $("prevBar").addEventListener("click", () => { S.bi = Math.max(0, S.viewSpan === 4 ? viewFirst() - 4 : S.bi - 1); S.sel = null; S.ghost = null; renderAll(); });
  $("nextBar").addEventListener("click", () => { S.bi = Math.min(S.song.bars.length - 1, S.viewSpan === 4 ? viewFirst() + 4 : S.bi + 1); S.sel = null; S.ghost = null; renderAll(); });
  $("barLabel").addEventListener("click", openSectionOps);
  $("rhyTag").addEventListener("click", openRhythmMenu);
  $("lyrTag").addEventListener("click", openWords);
  $("chordsBtn").addEventListener("click", openChordsSheet);
  $("saveBtn").addEventListener("click", openLibrary);
  let holdT = null, held = false; const pb = $("playBtn");
  pb.addEventListener("pointerdown", () => { held = false; holdT = setTimeout(() => { held = true; if (S.playing) stopPlayback(); playSong(); toast("Playing the whole song"); }, 550); });
  const pbUp = () => clearTimeout(holdT); pb.addEventListener("pointerup", pbUp); pb.addEventListener("pointerleave", pbUp); pb.addEventListener("pointercancel", pbUp);
  pb.addEventListener("click", () => { if (held) return; if (S.playing) { stopPlayback(); $("pauseBtn").classList.remove("on"); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); return; } const { end } = curRange(), list = []; for (let i = S.bi; i < end; i++) list.push(i); startPlayback(list); });
  $("pauseBtn").addEventListener("click", () => { if (!S.playing || !audioCtx) return; if (audioCtx.state === "running") { audioCtx.suspend(); $("pauseBtn").classList.add("on"); } else { audioCtx.resume(); $("pauseBtn").classList.remove("on"); } });
  midiInit();
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });
  initPointer(); initWindowChrome(); initWordEdit();
  window.addEventListener("keydown", e => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || $("overlay").classList.contains("on")) return;
    if (e.key === " ") { e.preventDefault(); $("playBtn").click(); }
    else if (e.key === "Escape") { S.sel = null; S.ghost = null; S.artic = null; S.slurFrom = null; closeWordEdit(); renderAll(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
    else if (e.key === "ArrowLeft" && !S.sel) { e.preventDefault(); if (S.bi > 0) { S.bi--; renderAll(); } }
    else if (e.key === "ArrowRight" && !S.sel) { e.preventDefault(); if (S.bi < S.song.bars.length - 1) { S.bi++; renderAll(); } }
    else if (S.sel) {
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSel(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); transposeSel(e.shiftKey ? 12 : 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); transposeSel(e.shiftKey ? -12 : -1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); moveSel(-gridStep()); }
      else if (e.key === "ArrowRight") { e.preventDefault(); moveSel(gridStep()); }
      else if (e.key === "t") tapTie();
    }
  });
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
  if (S.followWords) S.cursor = nextUnpitchedChip(0, null);
  renderAll();
  requestAnimationFrame(renderAll);              // once fonts and widths have settled
}
boot();
</script>
